name: Modern Dṛk-Bīja Monthly 1800-2399 Research QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/modern-drik-bija/**'
      - 'tests/modern-drik-bija-true-regression.mjs'
      - 'tests/modern-drik-bija-inpop-monthly-event-validation.mjs'
      - 'tests/fixtures/modern-drik-bija-jpl-de441-apparent-annual-1800-2399.json'
      - '.github/workflows/modern-drik-bija-research-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: modern-drik-bija-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  modern-drik-bija-monthly-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check isolated research modules
        run: |
          node --check research/modern-drik-bija/modern-drik-bija-model.mjs
          node --check research/modern-drik-bija/moshier-apparent-reference.mjs
          node --check research/modern-drik-bija/miriade-inpop-reference.mjs
          node --check tests/modern-drik-bija-true-regression.mjs
          node --check tests/modern-drik-bija-inpop-monthly-event-validation.mjs
      - name: Fit on central 400 years and verify both blind 100-year DE441 edge blocks
        run: node tests/modern-drik-bija-true-regression.mjs
      - name: Compare monthly epochs and dense event windows against independent IMCCE INPOP
        run: node tests/modern-drik-bija-inpop-monthly-event-validation.mjs
      - name: Preserve full monthly and event-focused INPOP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MODERN-DRIK-BIJA-INPOP-MONTHLY-EVENT-VALIDATION
          path: modern-drik-bija-inpop-validation-output/INPOP_MONTHLY_AND_EVENT_REPORT.json
          if-no-files-found: warn
          retention-days: 30
