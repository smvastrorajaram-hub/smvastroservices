name: BPHS isolated Shadbala core QA

on:
  pull_request:
    paths:
      - 'public/horoscope/offline/bphs-shadbala-engine.browser.mjs'
      - 'public/horoscope/offline/bphs-swiss-solar-cheshta.browser.mjs'
      - 'public/horoscope/offline/bphs-shadbala-rectification.browser.mjs'
      - 'public/horoscope/offline/bphs-sputa-drishti.browser.mjs'
      - 'public/horoscope/offline/swiss_vedic.browser.mjs'
      - 'tests/bphs-shadbala-engine-core-regression.mjs'
      - '.github/workflows/bphs-shadbala-engine-core-qa.yml'
  push:
    branches: [main]
    paths:
      - 'public/horoscope/offline/bphs-shadbala-engine.browser.mjs'
      - 'public/horoscope/offline/bphs-swiss-solar-cheshta.browser.mjs'
      - 'public/horoscope/offline/bphs-shadbala-rectification.browser.mjs'
      - 'public/horoscope/offline/bphs-sputa-drishti.browser.mjs'
      - 'public/horoscope/offline/swiss_vedic.browser.mjs'
      - 'tests/bphs-shadbala-engine-core-regression.mjs'
      - '.github/workflows/bphs-shadbala-engine-core-qa.yml'

jobs:
  bphs-engine-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check isolated BPHS engine and regression
        run: |
          node --check public/horoscope/offline/bphs-shadbala-engine.browser.mjs
          node --check tests/bphs-shadbala-engine-core-regression.mjs
      - name: Run BPHS component, frame and boundary regression
        run: node tests/bphs-shadbala-engine-core-regression.mjs
