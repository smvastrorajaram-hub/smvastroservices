name: Oracle backend container validation

on:
  pull_request:
    paths:
      - 'server.js'
      - 'html-pdf-renderer.js'
      - 'package.json'
      - 'ops/oracle/**'
      - '.dockerignore'
      - '.gitignore'
      - '.github/workflows/oracle-backend-image.yml'
      - 'test/oracle-backend-deployment.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax
        run: |
          node --check server.js
          node --check html-pdf-renderer.js
      - name: Test deployment safety contracts
        run: node --test test/oracle-backend-deployment.test.js
      - name: Build runtime image (no production secrets)
        run: docker build --pull -f ops/oracle/Dockerfile -t smvastroservices-api:pr .
      - name: Inspect container metadata
        run: docker image inspect smvastroservices-api:pr --format '{{.Os}}/{{.Architecture}} user={{.Config.User}}'
