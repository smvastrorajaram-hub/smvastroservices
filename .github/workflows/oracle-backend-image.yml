name: Oracle backend container validation

on:
  pull_request:
    paths:
      - 'server.js'
      - 'html-pdf-renderer.js'
      - 'package.json'
      - 'ops/oracle/**'
      - '.dockerignore'
      - '.gitignore'
      - '.github/workflows/oracle-backend-image.yml'
      - 'test/oracle-backend-deployment.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax
        run: |
          node --check server.js
          node --check html-pdf-renderer.js
      - name: Test deployment safety contracts
        run: node --test test/oracle-backend-deployment.test.js
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build x86_64 runtime image (no production secrets)
        run: docker buildx build --pull --platform linux/amd64 --load -f ops/oracle/Dockerfile -t smvastroservices-api:pr .
      - name: Build OCI Ampere ARM64 runtime image (no production secrets)
        run: docker buildx build --pull --platform linux/arm64 -f ops/oracle/Dockerfile -t smvastroservices-api:arm64-ci .
      - name: Inspect x86_64 container metadata
        run: docker image inspect smvastroservices-api:pr --format '{{.Os}}/{{.Architecture}} user={{.Config.User}}'
