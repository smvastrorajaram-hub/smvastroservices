name: Verify SMV ASTRO staging Worker

on:
  push:
    branches:
      - feat/cloudflare-worker-d1-staging-20261030
    paths:
      - "cloudflare/smv-astro-api-staging/**"
      - ".github/workflows/cloudflare-staging-worker-check.yml"
  pull_request:
    paths:
      - "cloudflare/smv-astro-api-staging/**"
      - ".github/workflows/cloudflare-staging-worker-check.yml"

permissions:
  contents: read

jobs:
  test:
    name: Worker syntax, D1 migration and security tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/smv-astro-api-staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Worker tooling
        run: npm install --no-audit --no-fund
      - name: Check Worker syntax and security tests
        run: npm run check
      - name: Validate D1 migration locally
        run: npx wrangler d1 migrations apply smv-astro-staging-db --local
      - name: Validate Worker bundle without deployment
        run: npx wrangler deploy --dry-run --outdir .wrangler-test-out
