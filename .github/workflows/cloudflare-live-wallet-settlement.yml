name: Cloudflare Live Wallet settlement contract tests

on:
  push:
    branches:
      - feature/cloudflare-live-wallet-settlement-guard-20261031
  pull_request:
    branches:
      - feature/cloudflare-wallet-d1-backfill-reconciliation-20261031
    paths:
      - 'shared/backend-platform/live-session-domain.mjs'
      - 'shared/backend-platform/d1-live-session-service.mjs'
      - 'shared/backend-platform/d1-live-withdrawal-service.mjs'
      - 'shared/backend-platform/wallet-domain.mjs'
      - 'cloudflare/backend-api/src/live-session-routes.mjs'
      - 'cloudflare/backend-api/src/live-session-coordinator.mjs'
      - 'cloudflare/backend-api/src/index.mjs'
      - 'cloudflare/backend-api/migrations/0006_d1_live_wallet_settlement.sql'
      - 'cloudflare/backend-api/test/live-session-*.test.mjs'
      - 'cloudflare/backend-api/test/d1-live-withdrawal-service.test.mjs'
      - 'cloudflare/backend-api/test/wallet-domain-backfill-live.test.mjs'
      - 'cloudflare/backend-api/test/live-chat-moderation.test.mjs'
      - 'cloudflare/backend-api/wrangler.jsonc'
      - '.github/workflows/cloudflare-live-wallet-settlement.yml'

permissions:
  contents: read

jobs:
  live-wallet-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Worker dependencies
        working-directory: cloudflare/backend-api
        run: npm install --no-package-lock --ignore-scripts
      - name: Check Live Wallet and route source syntax
        run: |
          node --check shared/backend-platform/live-session-domain.mjs
          node --check shared/backend-platform/d1-live-session-service.mjs
          node --check shared/backend-platform/d1-live-withdrawal-service.mjs
          node --check cloudflare/backend-api/src/live-session-routes.mjs
          node --check cloudflare/backend-api/src/live-session-coordinator.mjs
          node --check cloudflare/backend-api/src/index.mjs
          node --check cloudflare/backend-api/test/live-session-domain.test.mjs
          node --check cloudflare/backend-api/test/live-session-routes.test.mjs
          node --check cloudflare/backend-api/test/d1-live-withdrawal-service.test.mjs
          node --check cloudflare/backend-api/test/wallet-domain-backfill-live.test.mjs
      - name: Run Live Wallet, booking, timer and withdrawal contract tests
        working-directory: cloudflare/backend-api
        run: |
          node --test \
            test/live-session-domain.test.mjs \
            test/live-session-routes.test.mjs \
            test/d1-live-withdrawal-service.test.mjs \
            test/wallet-domain-backfill-live.test.mjs \
            test/live-chat-moderation.test.mjs \
            test/live-session-coordinator.test.mjs
      - name: Apply all migrations through Live settlement to local D1 only
        working-directory: cloudflare/backend-api
        run: npx --yes wrangler@4.156.0 d1 migrations apply smvastro-wallet-staging --local --config wrangler.jsonc
      - name: Validate Worker bundle without deployment
        working-directory: cloudflare/backend-api
        run: npx --yes wrangler@4.156.0 deploy --dry-run --config wrangler.jsonc
