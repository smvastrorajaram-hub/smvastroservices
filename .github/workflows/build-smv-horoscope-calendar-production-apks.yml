name: Build SMV HOROSCOPE and SMV CALENDAR Production Android APKs

on:
  workflow_dispatch:
    inputs:
      horoscope_version_name:
        description: "SMV HOROSCOPE version (v1.0, v1.1, etc.; v2 is accepted as v2.0)"
        required: true
        type: string
        default: "v1.0"
      calendar_version_name:
        description: "SMV CALENDAR version (independent sequence; v2 is accepted as v2.0)"
        required: true
        type: string
        default: "v1.0"
      build_signed_release:
        description: "Build both permanent signed Release APKs with the existing SMV Android signing key"
        required: true
        type: boolean
        default: true
  pull_request:
    paths:
      - "ICON/SMV HOROSCOPE.jpg"
      - "ICON/SMV CALENDAR.jpg"
      - "settings.gradle"
      - "prepare-icons.sh"
      - "prepare-smv-horoscope-calendar-production-icons.sh"
      - "tools/SmvProductLauncherIconGenerator.java"
      - "test/android-horoscope-calendar-launcher-icons.test.mjs"
      - "smvhoroscopeproduction/**"
      - "smvcalendarproduction/**"
      - "smvhoroscope/**"
      - "smvcalendar/**"
      - "smvastroproduction/src/main/java/in/smvastroservices/smvastro/MainActivity.java"
      - ".github/workflows/build-smv-horoscope-calendar-production-apks.yml"
      - "test/android-horoscope-calendar-production.test.mjs"
      - "test/android-horoscope-pdf-native.test.mjs"
      - "scripts/next-android-release-version.mjs"
      - "scripts/normalize-android-release-version-name.mjs"
      - "test/android-release-version-resolution.test.mjs"
      - "test/android-cache-release-build-triggers.test.mjs"
      - "public/horoscope/sw.js"
      - "public/horoscope/calendar/sw.js"
      - "public/horoscope/location-search-online-offline.js"
      - "public/question-place-search.mjs"
      - "public/horoscope/offline/places/place-search.mjs"
      - "public/horoscope/offline/places/india-manifest.json"
  push:
    paths:
      - "ICON/SMV HOROSCOPE.jpg"
      - "ICON/SMV CALENDAR.jpg"
      - "settings.gradle"
      - "prepare-icons.sh"
      - "prepare-smv-horoscope-calendar-production-icons.sh"
      - "tools/SmvProductLauncherIconGenerator.java"
      - "test/android-horoscope-calendar-launcher-icons.test.mjs"
      - "smvhoroscopeproduction/**"
      - "smvcalendarproduction/**"
      - "smvhoroscope/**"
      - "smvcalendar/**"
      - "smvastroproduction/src/main/java/in/smvastroservices/smvastro/MainActivity.java"
      - ".github/workflows/build-smv-horoscope-calendar-production-apks.yml"
      - "test/android-horoscope-calendar-production.test.mjs"
      - "test/android-horoscope-pdf-native.test.mjs"
      - "scripts/next-android-release-version.mjs"
      - "scripts/normalize-android-release-version-name.mjs"
      - "test/android-release-version-resolution.test.mjs"
      - "test/android-cache-release-build-triggers.test.mjs"
      - "public/horoscope/sw.js"
      - "public/horoscope/calendar/sw.js"
      - "public/horoscope/location-search-online-offline.js"
      - "public/question-place-search.mjs"
      - "public/horoscope/offline/places/place-search.mjs"
      - "public/horoscope/offline/places/india-manifest.json"

permissions:
  contents: read

concurrency:
  group: smv-horoscope-calendar-production-apks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SMV_HOROSCOPE_ANDROID_VERSION_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.horoscope_version_name || 'v1.0' }}
      SMV_CALENDAR_ANDROID_VERSION_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.calendar_version_name || 'v1.0' }}
      SMV_SIGNED_RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_signed_release) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select production APKs for this change
        id: app_targets
        shell: bash
        env:
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          horoscope=false
          calendar=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # Manual release dispatch retains the established two-app flow.
            # Pull requests compile both QA packages but never publish signed APKs.
            horoscope=true
            calendar=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ -z "$PUSH_BASE_SHA" || "$PUSH_BASE_SHA" =~ ^0+$ ]]; then
              changed_files="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
            else
              changed_files="$(git diff --name-only "$PUSH_BASE_SHA" "$GITHUB_SHA")"
            fi
            while IFS= read -r file; do
              case "$file" in
                smvhoroscopeproduction/*|smvhoroscope/*|test/android-horoscope-pdf-native.test.mjs)
                  horoscope=true ;;
                smvcalendarproduction/*|smvcalendar/*)
                  calendar=true ;;
                ICON/SMV\ HOROSCOPE.jpg|ICON/SMV\ CALENDAR.jpg|settings.gradle|prepare-icons.sh|prepare-smv-horoscope-calendar-production-icons.sh|tools/SmvProductLauncherIconGenerator.java|public/horoscope/sw.js|public/horoscope/calendar/sw.js|public/horoscope/location-search-online-offline.js|public/question-place-search.mjs|public/horoscope/offline/places/place-search.mjs|public/horoscope/offline/places/india-manifest.json|scripts/next-android-release-version.mjs|scripts/normalize-android-release-version-name.mjs)
                  horoscope=true; calendar=true ;;
              esac
            done <<< "$changed_files"
          fi
          apps=""
          modules=""
          if [[ "$horoscope" == "true" ]]; then
            apps="horoscope"
            modules="smvhoroscopeproduction"
          fi
          if [[ "$calendar" == "true" ]]; then
            apps="${apps:+$apps }calendar"
            modules="${modules:+$modules }smvcalendarproduction"
          fi
          echo "horoscope=$horoscope" >> "$GITHUB_OUTPUT"
          echo "calendar=$calendar" >> "$GITHUB_OUTPUT"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Selected production APK modules: ${modules:-none (tests only)}"

      - name: Node 22 production app regression tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify independent production packages and test-module isolation
        run: node --test test/android-horoscope-calendar-production.test.mjs test/android-horoscope-pdf-native.test.mjs test/android-horoscope-calendar-launcher-icons.test.mjs test/android-permanent-release.test.mjs test/android-release-version-resolution.test.mjs test/android-cache-release-build-triggers.test.mjs

      - name: Normalize manually entered HOROSCOPE and CALENDAR Android versions
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/normalize-android-release-version-name.mjs horoscope calendar

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Allocate only the changed production app version from Cloudflare APK releases
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.app_targets.outputs.apps != '' }}
        run: node scripts/next-android-release-version.mjs ${{ steps.app_targets.outputs.apps }}

      - name: Prepare production Horoscope and Calendar icons
        run: bash prepare-smv-horoscope-calendar-production-icons.sh

      - name: Validate production launcher resources and 300 KB asset limits
        shell: bash
        run: |
          set -euo pipefail
          for module in smvhoroscopeproduction smvcalendarproduction; do
            res="$module/src/main/res"
            for asset in "$res/drawable-nodpi/ic_launcher_foreground.jpg" "$res/mipmap-nodpi/ic_launcher.jpg" "$res/mipmap-nodpi/ic_launcher_round.jpg"; do
              test -s "$asset"
              size="$(stat -c%s "$asset")"
              if (( size > 300000 )); then
                echo "::error::Android launcher asset exceeds 300 KB: $asset ($size bytes)"
                exit 1
              fi
            done
            test -s "$res/mipmap-anydpi-v26/ic_launcher.xml"
            test -s "$res/mipmap-anydpi-v26/ic_launcher_round.xml"
            test -s "$res/values/colors.xml"
            grep -Fq '<color name="smv_launcher_background">#FFFFFF</color>' "$res/values/colors.xml"
            grep -Fq '@drawable/ic_launcher_foreground' "$res/mipmap-anydpi-v26/ic_launcher.xml"
          done
          echo "PASS: HOROSCOPE and CALENDAR production launcher JPEGs are below 300,000 bytes each."

      - name: Build Horoscope and Calendar Debug APKs (test builds only)
        run: |
          gradle --no-daemon \
            :smvhoroscopeproduction:assembleDebug \
            :smvcalendarproduction:assembleDebug

      - name: Upload debug test APKs
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: SMV-HOROSCOPE-CALENDAR-DEBUG-TEST-APKS
          path: |
            smvhoroscopeproduction/build/outputs/apk/debug/
            smvcalendarproduction/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 7

      - name: Compile both Release variants without signing (PR/push validation only)
        if: ${{ env.SMV_SIGNED_RELEASE != 'true' }}
        run: |
          # Do not let a cached/previous unsigned Release APK be reused for the signed publication.
          gradle --no-daemon --no-build-cache -PsmvHoroscopeVersionName="$SMV_HOROSCOPE_ANDROID_VERSION_NAME" -PsmvCalendarVersionName="$SMV_CALENDAR_ANDROID_VERSION_NAME" \
            :smvhoroscopeproduction:clean \
            :smvcalendarproduction:clean \
            :smvhoroscopeproduction:assembleRelease \
            :smvcalendarproduction:assembleRelease

      - name: Validate shared permanent Android Release signing secrets
        if: ${{ env.SMV_SIGNED_RELEASE == 'true' && steps.app_targets.outputs.modules != '' }}
        shell: bash
        env:
          SMV_ANDROID_KEYSTORE_BASE64: ${{ secrets.SMV_ANDROID_KEYSTORE_BASE64 }}
          SMV_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SMV_ANDROID_KEYSTORE_PASSWORD }}
          SMV_ANDROID_KEY_ALIAS: ${{ secrets.SMV_ANDROID_KEY_ALIAS }}
          SMV_ANDROID_KEY_PASSWORD: ${{ secrets.SMV_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for secret_name in SMV_ANDROID_KEYSTORE_BASE64 SMV_ANDROID_KEYSTORE_PASSWORD SMV_ANDROID_KEY_ALIAS SMV_ANDROID_KEY_PASSWORD; do
            if [[ -z "$(printenv "$secret_name" || true)" ]]; then
              missing="$missing $secret_name"
            fi
          done
          if [[ -n "$missing" ]]; then
            echo "::error::Missing repository Actions signing secrets:$missing"
            exit 1
          fi
          if [[ "$SMV_ANDROID_KEY_ALIAS" != "smvastro-release" ]]; then
            echo "::error::The shared permanent Android key alias must remain smvastro-release."
            exit 1
          fi
          echo "Permanent Android signing secrets are present; values are not printed."

      - name: Restore permanent PKCS12 Android signing keystore
        if: ${{ env.SMV_SIGNED_RELEASE == 'true' && steps.app_targets.outputs.modules != '' }}
        shell: bash
        env:
          SMV_ANDROID_KEYSTORE_BASE64: ${{ secrets.SMV_ANDROID_KEYSTORE_BASE64 }}
          SMV_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SMV_ANDROID_KEYSTORE_PASSWORD }}
          SMV_ANDROID_KEY_ALIAS: ${{ secrets.SMV_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          keystore_path="$RUNNER_TEMP/smv-astro-release.p12"
          printf '%s' "$SMV_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          keytool -list -keystore "$keystore_path" -storetype PKCS12 -storepass "$SMV_ANDROID_KEYSTORE_PASSWORD" -alias "$SMV_ANDROID_KEY_ALIAS" >/dev/null
          echo "SMV_ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build selected permanently signed production Release APKs
        if: ${{ env.SMV_SIGNED_RELEASE == 'true' && steps.app_targets.outputs.modules != '' }}
        env:
          SMV_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SMV_ANDROID_KEYSTORE_PASSWORD }}
          SMV_ANDROID_KEY_ALIAS: ${{ secrets.SMV_ANDROID_KEY_ALIAS }}
          SMV_ANDROID_KEY_PASSWORD: ${{ secrets.SMV_ANDROID_KEY_PASSWORD }}
          SMV_BUILD_HOROSCOPE: ${{ steps.app_targets.outputs.horoscope }}
          SMV_BUILD_CALENDAR: ${{ steps.app_targets.outputs.calendar }}
        run: |
          set -euo pipefail
          tasks=()
          if [[ "$SMV_BUILD_HOROSCOPE" == "true" ]]; then
            tasks+=( :smvhoroscopeproduction:clean :smvhoroscopeproduction:assembleRelease )
          fi
          if [[ "$SMV_BUILD_CALENDAR" == "true" ]]; then
            tasks+=( :smvcalendarproduction:clean :smvcalendarproduction:assembleRelease )
          fi
          gradle --no-daemon --no-build-cache \\
            -PsmvHoroscopeVersionName="$SMV_HOROSCOPE_ANDROID_VERSION_NAME" \\
            -PsmvCalendarVersionName="$SMV_CALENDAR_ANDROID_VERSION_NAME" \\
            "${tasks[@]}"

      - name: Verify v2 signature and permanent certificate on selected production APKs
        if: ${{ env.SMV_SIGNED_RELEASE == 'true' && steps.app_targets.outputs.modules != '' }}
        shell: bash
        env:
          SMV_BUILD_MODULES: ${{ steps.app_targets.outputs.modules }}
        run: |
          set -euo pipefail
          expected="7a3be159218a38083986dec117c0bd281b3ef42bda65f2bb7b8c9946b5293401"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for module in $SMV_BUILD_MODULES; do
            apk="$module/build/outputs/apk/release/$module-release.apk"
            test -s "$apk"
            if ! report="$("$apksigner" verify --verbose --print-certs "$apk" 2>&1)"; then
              printf '%s\\n' "$report"
              echo "::error::$module APK signature verification failed; see the apksigner diagnostics above."
              exit 1
            fi
            printf '%s\\n' "$report"
            if ! grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$report"; then
              echo "::error::$module APK is not verified with APK Signature Scheme v2."
              exit 1
            fi
            actual="$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' <<< "$report" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
            if [[ -z "$actual" ]]; then
              echo "::error::$module APK did not report a signer certificate SHA-256 fingerprint."
              exit 1
            fi
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$module certificate fingerprint mismatch: expected $expected, found $actual."
              exit 1
            fi
            echo "PASS: $module is signed with APK Signature Scheme v2 and the existing permanent SMV Android certificate."
          done

      - name: Upload signed SMV HOROSCOPE Production APK
        if: ${{ env.SMV_SIGNED_RELEASE == 'true' && steps.app_targets.outputs.horoscope == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: SMV-HOROSCOPE-PERMANENT-RELEASE-APK
          path: smvhoroscopeproduction/build/outputs/apk/release/smvhoroscopeproduction-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed SMV CALENDAR Production APK
        if: ${{ env.SMV_SIGNED_RELEASE == 'true' && steps.app_targets.outputs.calendar == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: SMV-CALENDAR-PERMANENT-RELEASE-APK
          path: smvcalendarproduction/build/outputs/apk/release/smvcalendarproduction-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare versioned signed SMV HOROSCOPE APK
        if: ${{ env.SMV_SIGNED_RELEASE == 'true' && steps.app_targets.outputs.horoscope == 'true' }}
        run: cp smvhoroscopeproduction/build/outputs/apk/release/smvhoroscopeproduction-release.apk "$RUNNER_TEMP/SMV-HOROSCOPE-$SMV_HOROSCOPE_ANDROID_VERSION_NAME.apk"

      - name: Prepare versioned signed SMV CALENDAR APK
        if: ${{ env.SMV_SIGNED_RELEASE == 'true' && steps.app_targets.outputs.calendar == 'true' }}
        run: cp smvcalendarproduction/build/outputs/apk/release/smvcalendarproduction-release.apk "$RUNNER_TEMP/SMV-CALENDAR-$SMV_CALENDAR_ANDROID_VERSION_NAME.apk"

      - name: Publish raw signed HOROSCOPE and CALENDAR APK direct-download release assets (HOROSCOPE)
        if: ${{ env.SMV_SIGNED_RELEASE == 'true' && steps.app_targets.outputs.horoscope == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: smv-horoscope-apk-${{ env.SMV_HOROSCOPE_ANDROID_VERSION_NAME }}-run-${{ github.run_number }}
          name: SMV HOROSCOPE ${{ env.SMV_HOROSCOPE_ANDROID_VERSION_NAME }} signed APK
          files: ${{ runner.temp }}/SMV-HOROSCOPE-${{ env.SMV_HOROSCOPE_ANDROID_VERSION_NAME }}.apk
          draft: false
          prerelease: false

      - name: Publish raw signed HOROSCOPE and CALENDAR APK direct-download release assets (CALENDAR)
        if: ${{ env.SMV_SIGNED_RELEASE == 'true' && steps.app_targets.outputs.calendar == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: smv-calendar-apk-${{ env.SMV_CALENDAR_ANDROID_VERSION_NAME }}-run-${{ github.run_number }}
          name: SMV CALENDAR ${{ env.SMV_CALENDAR_ANDROID_VERSION_NAME }} signed APK
          files: ${{ runner.temp }}/SMV-CALENDAR-${{ env.SMV_CALENDAR_ANDROID_VERSION_NAME }}.apk
          draft: false
          prerelease: false

      - name: Remove temporary signing keystore
        if: ${{ always() && env.SMV_SIGNED_RELEASE == 'true' }}
        run: rm -f "$RUNNER_TEMP/smv-astro-release.p12"
