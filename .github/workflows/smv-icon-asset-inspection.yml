name: Prepare SMV PWA, Website and Favicon Assets

on:
  push:
    branches:
      - feat/smv-pwa-website-assets-20261105
    paths:
      - .github/workflows/smv-icon-asset-inspection.yml
      - ICON/SMV.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Convert the approved ZIP artwork into web-ready assets
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          from PIL import Image, ImageOps

          archive = Path("ICON/SMV.zip")
          output_root = Path("public")
          release = "20261105-smv-zip-assets-v1"

          def open_member(zf, member):
              with zf.open(member) as stream:
                  image = Image.open(stream)
                  image.load()
              return image.convert("RGB")

          def save_png(image, destination, size, maskable=False):
              resized = image.resize((size, size), Image.Resampling.LANCZOS)
              if maskable:
                  # Keep the complete original artwork inside the launcher safe zone.
                  margin = round(size * 0.10)
                  inner = resized.resize((size - margin * 2, size - margin * 2), Image.Resampling.LANCZOS)
                  corners = [image.getpixel((0, 0)), image.getpixel((image.width - 1, 0)),
                             image.getpixel((0, image.height - 1)), image.getpixel((image.width - 1, image.height - 1))]
                  background = tuple(round(sum(pixel[channel] for pixel in corners) / 4) for channel in range(3))
                  canvas = Image.new("RGB", (size, size), background)
                  canvas.paste(inner, (margin, margin))
                  resized = canvas

              destination.parent.mkdir(parents=True, exist_ok=True)
              for colors in (256, 224, 192, 160, 128, 96, 64):
                  palette = resized.quantize(colors=colors, method=Image.Quantize.MEDIANCUT, dither=Image.Dither.FLOYDSTEINBERG)
                  palette.save(destination, format="PNG", optimize=True, compress_level=9)
                  if destination.stat().st_size < 300_000:
                      break
              if destination.stat().st_size >= 300_000:
                  raise RuntimeError(f"{destination} exceeds 300,000 bytes after lossless palette optimization")

          def save_webp(image, destination, max_edge, quality=90):
              image = image.copy()
              image.thumbnail((max_edge, max_edge), Image.Resampling.LANCZOS)
              destination.parent.mkdir(parents=True, exist_ok=True)
              image.save(destination, format="WEBP", quality=quality, method=6)
              if destination.stat().st_size >= 300_000:
                  raise RuntimeError(f"{destination} exceeds 300,000 bytes")

          def save_favicon_set(image, folder, prefix, legacy_64=None):
              folder.mkdir(parents=True, exist_ok=True)
              crop_path = folder / f"{prefix}-crop.webp"
              image.save(crop_path, format="WEBP", quality=92, method=6)
              for size in (16, 32, 48, 64):
                  icon = image.resize((size, size), Image.Resampling.LANCZOS)
                  if size in (16, 32, 64):
                      icon.save(folder / f"{prefix}-{size}.png", format="PNG", optimize=True, compress_level=9)
                  if legacy_64 and size == 64:
                      icon.save(legacy_64, format="PNG", optimize=True, compress_level=9)
              image.save(folder / f"{prefix}.ico", format="ICO",
                         sizes=[(16, 16), (32, 32), (48, 48), (64, 64)])

          with zipfile.ZipFile(archive) as zf:
              expected = [
                  "SMV PWA/SMV ASTRO.jpg",
                  "SMV PWA/SMV HOROSCOPE.jpg",
                  "SMV PWA/SMV CALENDAR.jpg",
                  "SMV WEBSITE/SMV ASTRO.jpg",
                  "SMV WEBSITE/SMV HOROSCOPE.jpg",
                  "SMV WEBSITE/SMV CALENDAR.jpg",
                  "SMV ASTRO HOROSCOPE CALENDAR FAVICON/FAVICON ASTRO HOROSCOPE CALENDAR.jpg",
              ]
              missing = [name for name in expected if name not in zf.namelist()]
              if missing:
                  raise RuntimeError("Missing expected ZIP members: " + ", ".join(missing))

              # PWA app icons: preserve each source image in full; do not crop it.
              products = [
                  ("ASTRO", "public/assets", "icon"),
                  ("HOROSCOPE", "public/horoscope/assets", "icon"),
                  ("CALENDAR", "public/horoscope/assets", "calendar"),
              ]
              for product, folder, prefix in products:
                  source = open_member(zf, f"SMV PWA/SMV {product}.jpg")
                  if source.width != 2048 or source.height != 2048:
                      raise RuntimeError(f"Unexpected {product} PWA source size: {source.size}")
                  folder = Path(folder)
                  save_png(source, folder / f"{prefix}-192.png", 192)
                  save_png(source, folder / f"{prefix}-512.png", 512)
                  save_png(source, folder / f"{prefix}-512-maskable.png", 512, maskable=True)

              # Website artwork: optimized WebP, original aspect ratio retained, no cropping.
              website_sources = [
                  ("SMV ASTRO", "public/assets/smv-home-logo.webp", 900),
                  ("SMV HOROSCOPE", "public/horoscope/assets/smv-horoscope-website.webp", 1100),
                  ("SMV CALENDAR", "public/horoscope/assets/smv-calendar-website.webp", 1100),
              ]
              for label, destination, max_edge in website_sources:
                  source = open_member(zf, f"SMV WEBSITE/{label}.jpg")
                  save_webp(source, Path(destination), max_edge=max_edge, quality=90)

              # The only crop in this task: three equal 724x724 pieces from the 2172x724 strip.
              strip = open_member(zf, expected[-1])
              if strip.size != (2172, 724):
                  raise RuntimeError(f"Unexpected favicon strip size: {strip.size}")
              favicon_specs = [
                  ("ASTRO", 0, Path("public/assets"), "favicon-astro", Path("public/assets/favicon-64.png")),
                  ("HOROSCOPE", 1, Path("public/horoscope/assets"), "favicon-horoscope", None),
                  ("CALENDAR", 2, Path("public/horoscope/assets"), "favicon-calendar", None),
              ]
              for label, index, folder, prefix, legacy64 in favicon_specs:
                  left = index * 724
                  crop = strip.crop((left, 0, left + 724, 724))
                  if crop.size != (724, 724):
                      raise RuntimeError(f"{label} favicon crop is not 724x724")
                  save_favicon_set(crop, folder, prefix, legacy_64=legacy64)

          # Also provide the conventional root-level favicon name used by browsers.
          astro_ico = Path("public/assets/favicon-astro.ico")
          (Path("public/assets/favicon.ico")).write_bytes(astro_ico.read_bytes())

          report = []
          for path in sorted(output_root.rglob("*")):
              if path.is_file() and (
                  path.name in {
                      "icon-192.png", "icon-512.png", "icon-512-maskable.png",
                      "calendar-192.png", "calendar-512.png", "calendar-maskable.png",
                      "favicon-64.png", "favicon.ico",
                      "favicon-astro-crop.webp", "favicon-horoscope-crop.webp", "favicon-calendar-crop.webp",
                      "smv-home-logo.webp", "smv-horoscope-website.webp", "smv-calendar-website.webp"
                  } or "favicon-horoscope-" in path.name or "favicon-calendar-" in path.name
              ):
                  record = {"path": str(path), "bytes": path.stat().st_size,
                            "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
                  try:
                      with Image.open(path) as img:
                          record["dimensions"] = f"{img.width}x{img.height}"
                          record["format"] = img.format
                  except Exception:
                      pass
                  report.append(record)
          print(json.dumps({"release": release, "generated_files": report}, indent=2))
          PY
      - name: Commit generated assets to this feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets public/horoscope/assets
          if git diff --cached --quiet; then
            echo "Generated SMV artwork is already current."
            exit 0
          fi
          git commit -m "feat: prepare SMV ZIP assets for PWA website and favicons"
          git push origin "HEAD:${GITHUB_REF_NAME}"
