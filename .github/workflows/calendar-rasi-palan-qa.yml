name: SMV CALENDAR Rasi Palan Scoped QA
on:
  push:
    branches: [main]
    paths:
      - 'public/horoscope/calendar/**'
      - 'public/_headers'
      - 'public/horoscope/calendar-rasi-palan.*'
      - 'public/horoscope/horoscope-language.js'
      - 'tests/calendar-rasi-palan-regression.mjs'
      - 'public/horoscope/calendar-rasi-palan-admin.mjs'
      - 'public/horoscope/prediction-admin-workbench.mjs'
      - 'public/horoscope/daily-calendar.mjs'
      - 'public/horoscope/daily-calendar.css'
      - 'public/horoscope/calendar-worker.mjs'
      - 'public/horoscope/offline/swiss_vedic.browser.mjs'
      - 'public/horoscope/offline/transit_panchang.browser.mjs'
      - 'tests/calendar-rasi-palan-regression.mjs'
      - 'tests/calendar-rasi-palan-browser-smoke.mjs'
      - 'tests/offline-first-app-browser-smoke.mjs'
      - 'tests/serve-public.mjs'
      - '.github/workflows/calendar-rasi-palan-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/horoscope/calendar/**'
      - 'public/_headers'
      - 'public/horoscope/calendar-rasi-palan.*'
      - 'public/horoscope/horoscope-language.js'
      - 'tests/calendar-rasi-palan-regression.mjs'
      - 'public/horoscope/calendar-rasi-palan-admin.mjs'
      - 'public/horoscope/prediction-admin-workbench.mjs'
      - 'public/horoscope/daily-calendar.mjs'
      - 'public/horoscope/daily-calendar.css'
      - 'public/horoscope/calendar-worker.mjs'
      - 'public/horoscope/offline/swiss_vedic.browser.mjs'
      - 'public/horoscope/offline/transit_panchang.browser.mjs'
      - 'tests/calendar-rasi-palan-regression.mjs'
      - 'tests/calendar-rasi-palan-browser-smoke.mjs'
      - 'tests/offline-first-app-browser-smoke.mjs'
      - 'tests/serve-public.mjs'
      - '.github/workflows/calendar-rasi-palan-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: calendar-rasi-palan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check only Calendar Rasi Palan source and tests
        run: |
          set -euo pipefail
          node --check public/horoscope/calendar-rasi-palan.mjs
          node --check public/horoscope/calendar-worker.mjs
          node --check public/horoscope/offline/swiss_vedic.browser.mjs
          node --check public/horoscope/offline/transit_panchang.browser.mjs
          node --check public/horoscope/calendar-rasi-palan-admin.mjs
          node --check public/horoscope/prediction-admin-workbench.mjs
          node --check public/horoscope/calendar/sw.js
          node --check public/horoscope/calendar/calendar-admin.mjs
          node --check tests/calendar-rasi-palan-regression.mjs
          node --check tests/calendar-rasi-palan-browser-smoke.mjs
          node --check tests/offline-first-app-browser-smoke.mjs
          node --check tests/serve-public.mjs
      - name: Run scoped Calendar Rasi Palan regression
        run: node tests/calendar-rasi-palan-regression.mjs
  browser-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing Chromium and Puppeteer dependencies
        run: npm install --no-save --package-lock=false --no-audit --no-fund
      - name: Resolve and verify the pull-request Cloudflare Pages preview origin
        id: preview-origin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Read Cloudflare's own deployment comment. Do not derive an alias
            # from the branch name: Pages may shorten or otherwise normalize it.
            origin="$(node --input-type=module <<'NODE'
            import { setTimeout as sleep } from 'node:timers/promises';

            const token = process.env.GH_TOKEN;
            const expectedSha = String(process.env.PR_HEAD_SHA || '').toLowerCase();
            const repo = process.env.GITHUB_REPOSITORY;
            const api = process.env.GITHUB_API_URL || 'https://api.github.com';
            const prNumber = process.env.PR_NUMBER;
            const botLogin = 'cloudflare-workers-and-pages[bot]';

            if (!token || !expectedSha || !repo || !prNumber) {
              throw new Error('Missing GitHub token, PR head SHA, repository, or PR number.');
            }

            const headers = {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${token}`,
              'X-GitHub-Api-Version': '2022-11-28'
            };
            const shortShaPattern = /Latest commit:\\s*<\\/strong>\\s*<\\/td>\\s*<td>\\s*<code>([a-f0-9]{7,40})<\\/code>/i;
            const branchUrlPattern = /Branch Preview URL:\\s*<\\/strong>\\s*<\\/td>\\s*<td>\\s*<a\\s+href=['"]([^'"]+)['"]/i;
            let resolvedOrigin = '';

            for (let attempt = 1; attempt <= 60; attempt++) {
              const response = await fetch(
                `${api}/repos/${repo}/issues/${prNumber}/comments?per_page=100`,
                { headers, cache: 'no-store' }
              );
              if (!response.ok) {
                const detail = await response.text();
                if (response.status === 401 || response.status === 403 || response.status === 404) {
                  throw new Error(`Cannot read PR deployment comments (HTTP ${response.status}): ${detail.slice(0, 500)}`);
                }
                console.error(`GitHub comments API returned HTTP ${response.status}; retry ${attempt}/60.`);
              } else {
                const comments = await response.json();
                const matches = comments
                  .filter(comment => comment.user?.login === botLogin && typeof comment.body === 'string')
                  .map(comment => ({ comment, sha: comment.body.match(shortShaPattern)?.[1]?.toLowerCase() || '' }))
                  .filter(item => item.sha && expectedSha.startsWith(item.sha))
                  .sort((a, b) => String(b.comment.updated_at || b.comment.created_at).localeCompare(String(a.comment.updated_at || a.comment.created_at)));

                for (const item of matches) {
                  const match = item.comment.body.match(branchUrlPattern);
                  if (!match) continue;
                  const candidate = new URL(match[1]);
                  if (candidate.protocol !== 'https:' || !candidate.hostname.endsWith('.smvastroservices.pages.dev')) {
                    throw new Error(`Cloudflare returned an unexpected preview host: ${candidate.origin}`);
                  }
                  resolvedOrigin = candidate.origin;
                  console.error(`Cloudflare deployment comment matches PR head ${item.sha}: ${resolvedOrigin}`);
                  break;
                }
              }

              if (resolvedOrigin) break;
              console.error(`Waiting for Cloudflare's deployment comment for commit ${expectedSha.slice(0, 7)} (${attempt}/60)...`);
              await sleep(10000);
            }

            if (!resolvedOrigin) {
              throw new Error('No Cloudflare Branch Preview URL was found for the current PR head commit after 10 minutes.');
            }

            console.log(resolvedOrigin);
            NODE
            )"
            echo "Using Cloudflare-reported PR Preview origin: $origin"
            ready=0
            for attempt in $(seq 1 120); do
              curl --fail --silent --connect-timeout 5 --max-time 15 -H 'Cache-Control: no-cache' "$origin/" -o /dev/null 2>/dev/null &
              root_pid=$!
              curl --fail --silent --connect-timeout 5 --max-time 15 -H 'Cache-Control: no-cache' "$origin/sw.js?smv_preview_verify=$GITHUB_SHA" -o "$RUNNER_TEMP/smv-astro-preview-sw.js" 2>/dev/null &
              astro_pid=$!
              curl --fail --silent --connect-timeout 5 --max-time 15 -H 'Cache-Control: no-cache' "$origin/horoscope/sw.js?smv_preview_verify=$GITHUB_SHA" -o "$RUNNER_TEMP/smv-horoscope-preview-sw.js" 2>/dev/null &
              horoscope_pid=$!
              curl --fail --silent --connect-timeout 5 --max-time 15 -H 'Cache-Control: no-cache' "$origin/horoscope/calendar/sw.js?smv_preview_verify=$GITHUB_SHA" -o "$RUNNER_TEMP/smv-calendar-preview-sw.js" 2>/dev/null &
              calendar_pid=$!
              if wait "$root_pid" && wait "$astro_pid" && wait "$horoscope_pid" && wait "$calendar_pid"; then
                release="20261106-active-only-auto-busy-icons-v2"
                if grep -Fq "const SMV_CACHE_RELEASE='$release'" "$RUNNER_TEMP/smv-astro-preview-sw.js" &&
                   grep -Fq "const SMV_CACHE_RELEASE='$release'" "$RUNNER_TEMP/smv-horoscope-preview-sw.js" &&
                   grep -Fq "const SMV_CACHE_RELEASE='$release'" "$RUNNER_TEMP/smv-calendar-preview-sw.js"; then
                  ready=1
                  break
                fi
              fi
              echo "Waiting for Cloudflare's current three-app preview and cache release ($attempt/120)..."
              sleep 5
            done
            if [ "$ready" -ne 1 ]; then
              echo "::error::Cloudflare Preview exists, but its homepage or all three current Service Worker releases are not ready: $origin"
              exit 1
            fi
          else
            # Loopback is runner-local only for push/manual checks. It is never
            # emitted as a shareable Preview origin and is not used for PR runs.
            node tests/serve-public.mjs > /tmp/smv-calendar-preview-server.log 2>&1 &
            echo $! > /tmp/smv-calendar-preview-server.pid
            ready=0
            for attempt in $(seq 1 40); do
              if curl --fail --silent http://127.0.0.1:4173/horoscope/calendar/ > /dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              cat /tmp/smv-calendar-preview-server.log
              echo "::error::Local source server failed to start for a non-PR run" >&2
              exit 1
            fi
            origin="http://127.0.0.1:4173"
          fi
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "Verified browser preview origin: $origin"
      - name: Run Chromium browser smoke against the current preview source
        env:
          SMV_CALENDAR_PREVIEW_URL: ${{ steps.preview-origin.outputs.origin }}/horoscope/calendar/
        run: node tests/calendar-rasi-palan-browser-smoke.mjs
      - name: Run three-app first-load and offline browser smoke
        env:
          SMV_OFFLINE_PREVIEW_ORIGIN: ${{ steps.preview-origin.outputs.origin }}
        run: node tests/offline-first-app-browser-smoke.mjs
      - name: Preserve Calendar preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMV-CALENDAR-RASI-PALAN-PREVIEW
          path: calendar-rasi-palan-smoke-output/
          if-no-files-found: warn
          retention-days: 14
