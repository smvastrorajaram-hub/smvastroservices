name: Wallet core tests

on:
  pull_request:
    paths:
      - 'wallet-service.js'
      - 'admin-auth.js'
      - 'test/admin-auth.test.js'
      - 'live-session-service.js'
      - 'test/live-session-service.test.js'
      - 'test/live-push-notifications.test.js'
      - 'test/cream-theme-audit.test.mjs'
      - 'public/sw.js'
      - 'test/wallet-service.test.js'
      - 'multi-project-firestore.js'
      - 'test/multi-project-firestore.test.js'
      - 'firestore-quota-routing.js'
      - 'test/firestore-quota-routing.test.js'
      - 'docs/project-wide-quota-routing.md'
      - 'scripts/backfill-wallet-domain.js'
      - 'scripts/validate-wallet-domain.js'
      - 'docs/project5-wallet-domain-cutover.md'
      - 'server.js'
      - 'dashboard-events.js'
      - 'firestore.indexes.json'
      - 'public/index.html'
      - 'public/smvastro.mjs'
      - 'public/razorpay-checkout-loader.mjs'
      - 'test/razorpay-checkout-loader.test.mjs'
      - 'public/public-content.mjs'
      - 'public/main-location-search.js'
      - 'public/question-place-search.mjs'
      - 'public/public-navigation.js'
      - 'package.json'
      - '.github/workflows/wallet-core-tests.yml'
  push:
    branches: [main]
    paths:
      - 'wallet-service.js'
      - 'test/wallet-service.test.js'
      - 'multi-project-firestore.js'
      - 'test/multi-project-firestore.test.js'
      - 'firestore-quota-routing.js'
      - 'test/firestore-quota-routing.test.js'
      - 'docs/project-wide-quota-routing.md'
      - 'scripts/backfill-wallet-domain.js'
      - 'scripts/validate-wallet-domain.js'
      - 'docs/project5-wallet-domain-cutover.md'
      - 'server.js'
      - 'dashboard-events.js'
      - 'firestore.indexes.json'
      - 'public/index.html'
      - 'public/smvastro.mjs'
      - 'public/razorpay-checkout-loader.mjs'
      - 'test/razorpay-checkout-loader.test.mjs'
      - 'public/public-content.mjs'
      - 'public/main-location-search.js'
      - 'public/question-place-search.mjs'
      - 'public/public-navigation.js'
      - 'package.json'
      - '.github/workflows/wallet-core-tests.yml'

permissions:
  contents: read

jobs:
  wallet-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check dashboard-events.js
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8'))"
          node --check admin-auth.js
          node --check test/admin-auth.test.js
          node --check multi-project-firestore.js
          node --check firestore-quota-routing.js
          node --check test/firestore-quota-routing.test.js
          node --check scripts/backfill-wallet-domain.js
          node --check scripts/validate-wallet-domain.js
          node --check test/multi-project-firestore.test.js
          node --check wallet-service.js
          node --check live-session-service.js
          node --check test/live-session-service.test.js
          node --check test/live-push-notifications.test.js
          node --check test/cream-theme-audit.test.mjs
          node --check public/sw.js
          node --check test/wallet-service.test.js
          node --check public/smvastro.mjs
          node --check public/razorpay-checkout-loader.mjs
          node --check test/razorpay-checkout-loader.test.mjs
          node --check public/public-content.mjs
          node --check public/main-location-search.js
          node --check public/question-place-search.mjs
          node --check public/public-navigation.js
      - name: Run trusted Admin authorization tests
        run: node --test test/admin-auth.test.js
      - name: Run Razorpay Checkout reliability tests
        run: node --test test/razorpay-checkout-loader.test.mjs
      - name: Run multi-project Firestore configuration tests
        run: node --test test/multi-project-firestore.test.js
      - name: Run Wallet unit tests
        run: npm run test:wallet
      - name: Run Live Session billing tests
        run: npm run test:live-session
      - name: Run cream theme regression tests
        run: node --test test/cream-theme-audit.test.mjs
