name: Oracle GeoNames Live Status
on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'geonames-location-service.js'
      - 'oracle.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/geonames-oracle-production-status.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geonames-oracle-production-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check Oracle GeoNames configuration and live timezoneId
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://api.smvastroservices.in'
          temp="$(mktemp)"
          status="$(curl --silent --show-error --location --connect-timeout 15 --max-time 95 --output "$temp" --write-out '%{http_code}' "$ROOT/api/locations/status" || echo 000)"
          if [ "$status" != 200 ]; then
            echo "::warning::Oracle GeoNames backend not deployed/ready (HTTP $status); set GEONAMES_USERNAME and redeploy Oracle."
            exit 0
          fi
          if [ "$(jq -r '.configured // false' "$temp")" != true ]; then
            echo "::warning::GeoNames source is deployed but GEONAMES_USERNAME is not configured. Worldwide online search remains disabled."
            exit 0
          fi
          city="$(curl --silent --show-error --location --max-time 40 "$ROOT/api/locations/search?q=London&limit=10")"
          zone="$(curl --silent --show-error --location --max-time 40 "$ROOT/api/locations/timezone?lat=51.5074&lng=-0.1278")"
          if [ "$(jq -r '.ok // false' <<< "$city")" != true ] || [ "$(jq -r '.ok // false' <<< "$zone")" != true ]; then
            echo "::error::Live GeoNames credentials or quota failed upstream test."
            exit 1
          fi
          found="$(jq -r '.timezoneId // ""' <<< "$zone")"
          echo "Live GeoNames London timezoneId=$found"
          [ "$found" = 'Europe/London' ] || { echo "::error::Unexpected live London timezoneId"; exit 1; }
