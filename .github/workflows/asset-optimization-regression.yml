name: Asset Optimization Regression
on:
  push:
    branches: [main]
    paths:
      - 'public/horoscope/index.html'
      - 'public/horoscope/calendar/sw.js'
      - 'tests/asset-optimization-horoscope-lazy-load-regression.mjs'
      - 'tests/asset-optimization-calendar-cache-regression.mjs'
      - '.github/workflows/asset-optimization-regression.yml'
      - 'audits/SMV_ASTRO_ASSET_OPTIMIZATION_2026-10-20.md'
  pull_request:
    branches: [main]
    paths:
      - 'public/horoscope/index.html'
      - 'public/horoscope/calendar/sw.js'
      - 'tests/asset-optimization-horoscope-lazy-load-regression.mjs'
      - 'tests/asset-optimization-calendar-cache-regression.mjs'
      - '.github/workflows/asset-optimization-regression.yml'
      - 'audits/SMV_ASTRO_ASSET_OPTIMIZATION_2026-10-20.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asset-optimization-regression
  cancel-in-progress: true
jobs:
  asset-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check optimization regression gates
        run: |
          set -euo pipefail
          node --check tests/asset-optimization-horoscope-lazy-load-regression.mjs
          node --check tests/asset-optimization-calendar-cache-regression.mjs
      - name: Horoscope deferred-load, matching dependency and protected-flow gate
        run: node tests/asset-optimization-horoscope-lazy-load-regression.mjs
      - name: Calendar PWA no-bulk-place-shard install and on-demand cache gate
        run: node tests/asset-optimization-calendar-cache-regression.mjs
