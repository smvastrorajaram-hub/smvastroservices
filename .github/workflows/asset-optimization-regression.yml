name: Asset Optimization Regression
on:
  push:
    branches: [main]
    paths:
      - 'public/horoscope/index.html'
      - 'public/horoscope/calendar/sw.js'
      - 'public/horoscope/offline/places/place-search.mjs'
      - 'public/horoscope/offline/places/place-search-worker.mjs'
      - 'public/horoscope/offline/places/india-manifest.json'
      - 'public/horoscope/offline/places/india/*.json'
      - 'tests/asset-optimization-horoscope-lazy-load-regression.mjs'
      - 'tests/asset-optimization-calendar-cache-regression.mjs'
      - 'tests/place-search-regression.mjs'
      - 'tests/asset-optimization-css-pwa-regression.mjs'
      - 'tests/dormant-public-assets-regression.mjs'
      - 'public/horoscope/location-search-online-offline.js'
      - 'public/horoscope/offline/places/place-search.mjs'
      - 'public/horoscope/offline/places/place-search-worker.mjs'
      - 'public/horoscope/offline/places/india-manifest.json'
      - 'public/horoscope/offline/places/india/*.json'
      - 'public/horoscope/horoscope-predictions.js'
      - 'public/horoscope/server.js'
      - 'public/horoscope/assets/icon-512-maskable.png'
      - 'public/assets/icon-512-maskable.png'
      - 'public/horoscope/v359-symmetric-gutters.css'
      - 'public/horoscope/v358-result-layout.css'
      - 'public/manifest.webmanifest'
      - 'public/horoscope/manifest-en.webmanifest'
      - 'public/horoscope/manifest-ta.webmanifest'
      - 'tests/cg-rajan-ayurdaya-advanced-part-i-placement-qa.mjs'
      - 'tests/cg-rajan-ayurdaya-save-pdf-integration-guard.mjs'
      - '.github/workflows/cg-rajan-ayurdaya-research-qa.yml'
      - '.github/workflows/asset-optimization-regression.yml'
      - 'audits/SMV_ASTRO_ASSET_OPTIMIZATION_2026-10-20.md'
  pull_request:
    branches: [main]
    paths:
      - 'public/horoscope/index.html'
      - 'public/horoscope/calendar/sw.js'
      - 'tests/asset-optimization-horoscope-lazy-load-regression.mjs'
      - 'tests/asset-optimization-calendar-cache-regression.mjs'
      - 'tests/dormant-public-assets-regression.mjs'
      - 'tests/asset-optimization-css-pwa-regression.mjs'
      - 'tests/place-search-regression.mjs'
      - 'public/horoscope/location-search-online-offline.js'
      - 'public/horoscope/offline/places/place-search.mjs'
      - 'public/horoscope/offline/places/place-search-worker.mjs'
      - 'public/horoscope/offline/places/india-manifest.json'
      - 'public/horoscope/offline/places/india/*.json'
      - 'public/horoscope/horoscope-predictions.js'
      - 'public/horoscope/server.js'
      - 'public/horoscope/assets/icon-512-maskable.png'
      - 'public/assets/icon-512-maskable.png'
      - 'public/horoscope/v359-symmetric-gutters.css'
      - 'public/horoscope/v358-result-layout.css'
      - 'public/manifest.webmanifest'
      - 'public/horoscope/manifest-en.webmanifest'
      - 'public/horoscope/manifest-ta.webmanifest'
      - 'tests/cg-rajan-ayurdaya-advanced-part-i-placement-qa.mjs'
      - 'tests/cg-rajan-ayurdaya-save-pdf-integration-guard.mjs'
      - '.github/workflows/cg-rajan-ayurdaya-research-qa.yml'
      - '.github/workflows/asset-optimization-regression.yml'
      - 'audits/SMV_ASTRO_ASSET_OPTIMIZATION_2026-10-20.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asset-optimization-regression
  cancel-in-progress: true
jobs:
  asset-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check optimization regression gates
        run: |
          set -euo pipefail
          node --check tests/asset-optimization-horoscope-lazy-load-regression.mjs
          node --check tests/asset-optimization-calendar-cache-regression.mjs
          node --check tests/place-search-regression.mjs
          node --check tests/dormant-public-assets-regression.mjs
          node --check tests/asset-optimization-css-pwa-regression.mjs
      - name: Horoscope deferred-load, matching dependency and protected-flow gate
        run: node tests/asset-optimization-horoscope-lazy-load-regression.mjs
      - name: Calendar PWA no-bulk-place-shard install and on-demand cache gate
        run: node tests/asset-optimization-calendar-cache-regression.mjs
      - name: GeoNames place-search ranking and split-manifest integrity regression
        run: node tests/place-search-regression.mjs
      - name: Retired public assets and root backend preservation gate
        run: node tests/dormant-public-assets-regression.mjs
      - name: CSS owner consolidation, native print and PWA icon dedup gate
        run: node tests/asset-optimization-css-pwa-regression.mjs
