name: NAELOS DE440 True Longitude Validation (Research Only)

on:
  push:
    branches:
      - research/naelos-de440-true-longitude-20261120
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-naelos-true-longitude:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned NAELOS reader (no project manifest changes)
        run: npm install --no-save --no-package-lock --ignore-scripts naelos-ephemeris@0.1.3
      - name: Syntax-check the Node and Browser B.V. Raman paths
        run: |
          node --check bv-raman-shadbala.cjs
          node --check public/horoscope/offline/bv-raman-shadbala.browser.mjs
          node --check tests/naelos-de440-five-natal-true-longitude.mjs
          node --check tests/bv-raman-yuddha-regression.mjs
          node --check tests/bv-raman-seven-graha-numerical-certification.mjs
          node --check research/natal-classical-certification/evidence-gates.mjs
          node --check research/natal-classical-certification/annual-random-natal-charts.mjs
          node --check tests/natal-classical-certification-pipeline.mjs
          node --check tests/natal-classical-remaining-evidence-audit.mjs
          node --check tests/bv-raman-source-precision-diagnostic.mjs
          node --check tests/naelos-de440-600-random-natal-true-longitude.mjs
          node --check tests/saura-bija-coherent-mean-true-sheeghroccheya-600-epochs.mjs
          node --check tests/burgess-1860-historical-source-oracle-600-epochs.mjs
      - name: Inspect checked-in NAELOS binary headers
        run: node research/naelos-de440/naelos-binary-forensics.mjs
      - name: Preserve existing B.V. Raman Strength6 regression
        run: node tests/bv-raman-strength6-regression.mjs
      - name: Verify all six Bala components, final Standard Horoscope totals, Rupa and ranking
        run: node tests/bv-raman-seven-graha-numerical-certification.mjs
      - name: Verify B.V. Raman source-based Yuddha and final Kala adjustments
        run: node tests/bv-raman-yuddha-regression.mjs
      - name: Preserve existing B.V. Raman Ishta/Kashta regression
        run: node tests/bv-raman-ishta-kashta-regression.mjs
      - name: Verify NAELOS DE440 true longitude and certified Chesta path at five natal epochs
        run: node tests/naelos-de440-five-natal-true-longitude.mjs
      - name: Verify 42-row six-Bala evidence matrix and final natal gate
        run: node tests/natal-classical-certification-pipeline.mjs
      - name: Audit historical longitude and 42-row Bala source ledgers without certifying arbitrary natal charts
        run: node tests/natal-classical-remaining-evidence-audit.mjs
      - name: Calculate 600 seeded-random full natal charts (one random DOB, time and Indian place per year)
        run: node research/natal-classical-certification/annual-random-natal-charts.mjs
      - name: Verify same-epoch same-frame classical Bīja Mean, Mandocca, Sheeghroccheya, True and BPHS Chesta for 600 natal epochs (3,000 rows)
        run: node tests/saura-bija-coherent-mean-true-sheeghroccheya-600-epochs.mjs
      - name: Cross-check DE440 true longitudes at the exact 600 random natal epochs (3,000 rows)
        run: node tests/naelos-de440-600-random-natal-true-longitude.mjs
      - name: Reproduce Burgess 1860 printed True values and derive Mean, Sheeghroccheya and True for the exact 600 natal epochs
        run: node tests/burgess-1860-historical-source-oracle-600-epochs.mjs
      - name: Upload 600-chart DOB/place, DE440 true-longitude and six-Bala evidence ledger
        uses: actions/upload-artifact@v4
        with:
          name: natal-classical-random-600-charts-1800-2399
          path: artifacts/natal-classical-random-600-charts-1800-2399.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Burgess 1860 source-derived longitude evidence numbers
        uses: actions/upload-artifact@v4
        with
          name: burgess-1860-source-derived-longitudes-600-epochs
          path: artifacts/burgess-1860-source-derived-longitudes-600-epochs.json
          if-no-files-found: error
          retention-days: 30
