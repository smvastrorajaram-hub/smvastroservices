name: NAELOS DE440 True Longitude Validation (Research Only)

on:
  push:
    branches:
      - research/naelos-de440-true-longitude-20261120
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-naelos-true-longitude:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned NAELOS reader (no project manifest changes)
        run: npm install --no-save --no-package-lock --ignore-scripts naelos-ephemeris@0.1.3
      - name: Syntax-check the Node and Browser B.V. Raman paths
        run: |
          node --check bv-raman-shadbala.cjs
          node --check public/horoscope/offline/bv-raman-shadbala.browser.mjs
          node --check tests/naelos-de440-five-natal-true-longitude.mjs
      - name: Inspect checked-in NAELOS binary headers
        run: node research/naelos-de440/naelos-binary-forensics.mjs
      - name: Preserve existing B.V. Raman Strength6 regression
        run: node tests/bv-raman-strength6-regression.mjs
      - name: Preserve existing B.V. Raman Ishta/Kashta regression
        run: node tests/bv-raman-ishta-kashta-regression.mjs
      - name: Verify NAELOS DE440 true longitude and certified Chesta path at five natal epochs
        run: node tests/naelos-de440-five-natal-true-longitude.mjs
