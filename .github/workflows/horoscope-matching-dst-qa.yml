name: Horoscope Matching DST Source QA
on:
  push:
    branches: [main]
    paths:
      - 'public/horoscope/**'
      - 'tests/**'
      - '.github/workflows/horoscope-matching-dst-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript source syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            node --check "$path"
          done < <(find public/horoscope tests -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) | sort)
      - name: Horoscope and Marriage Matching calculation regression
        run: node tests/calculation-regression.mjs
      - name: Report, print, timezone input regression
        run: node tests/print-dst-location-regression.mjs
      - name: GeoNames search and authoritative timezoneId regression
        run: node tests/geonames-location-regression.cjs
      - name: DST seasonal and 30-minute region regression
        run: node tests/dst-seasonal-regression.mjs
      - name: Audit known coordinate-zone boundary precision issues
        run: |
          node tests/timezone-boundary-audit.mjs | tee timezone-precision-audit.json
          echo 'Note: source-level tests do not certify Cloudflare live deployments, browser print, or location provider policy compliance.'
      - name: Preserve timezone precision audit
        uses: actions/upload-artifact@v4
        with:
          name: SMV-TIMEZONE-PRECISION-AUDIT
          path: timezone-precision-audit.json
          retention-days: 14

  production-http-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare Pages and custom domain HTTP endpoints
        shell: bash
        run: |
          set -euo pipefail
          check() {
            url="$1"
            body="$(mktemp)"
            code="$(curl --location --retry 2 --connect-timeout 10 --max-time 35 --silent --show-error --output "$body" --write-out '%{http_code}' "$url")"
            echo "$url => HTTP $code ($(wc -c < "$body") bytes)"
            if [ "$code" != "200" ] || ! grep -iq '<html' "$body"; then
              echo "::error::Live HTTP acceptance failed for $url"
              rm -f "$body"
              return 1
            fi
            rm -f "$body"
          }
          check 'https://smvastroservices.pages.dev/'
          check 'https://smvastroservices.pages.dev/horoscope/'
          check 'https://smvastroservices.pages.dev/horoscope/calendar/'
          check 'https://smvastroservices.in/'
          check 'https://smvastroservices.in/horoscope/'
