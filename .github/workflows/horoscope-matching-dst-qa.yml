name: Horoscope Matching DST Source QA
on:
  push:
    branches: [main]
    paths:
      - 'public/horoscope/**/*.js'
      - 'public/horoscope/**/*.mjs'
      - 'public/horoscope/**/*.cjs'
      - 'tests/**'
      - '.github/workflows/horoscope-matching-dst-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/horoscope/**/*.js'
      - 'public/horoscope/**/*.mjs'
      - 'public/horoscope/**/*.cjs'
      - 'tests/**'
      - '.github/workflows/horoscope-matching-dst-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript source syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            node --check "$path"
          done < <(find public/horoscope tests -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) | sort)
      - name: Horoscope single-release and responsive full-report regression
        run: node tests/horoscope-generation-progress-regression.mjs
      - name: Horoscope and Marriage Matching calculation regression
        run: node tests/calculation-regression.mjs
      - name: V358 unified result layer source regression
        run: node tests/v358-unified-result-layout-regression.mjs
      - name: BPHS V357 independent varga-boundary oracle
        run: node tests/v357-bphs-varga-regression.mjs
      - name: V357 D60 deity name reverse order and sign-lord regression
        run: node tests/v357-d60-deity-designation-regression.mjs
      # V357 resumed by user request: test Chapter 68 literal prose and
      # separately ASSERT conflicting illustration stays recorded.
      - name: BPHS II Chapters 67–69 Shodhana numeric & editorial tests
        run: node tests/v357-bphs-shodhana-regression.mjs
      - name: V360 PVR textbook independent Shodhana numerical examples 40-43
        run: node tests/v360-pvr-shodhana-textbook-regression.mjs
      - name: V357 BPHS positional Shadbala independent calculation oracle
        run: node tests/v357-bphs-shadbala-positional-regression.mjs
      - name: V361 Uttara Kalamrita seven-planet Shadbala p45, Yuddha and Drig QA
        run: node tests/v361-uttara-kalamrita-shadbala-regression.mjs
      - name: B.V. Raman Ishta/Kashta formula and Chesta-for-Phala regression
        run: node tests/bv-raman-ishta-kashta-regression.mjs
      - name: CG Rajan Jathaka Kanitham printed seven-graha Shadbala example independent oracle
        run: node tests/cg-rajan-jathaka-kanitham-shadbala-print50-oracle.mjs
      - name: V362 BPHS Chapter 27 Drig Bala and planetary-war pre-war difference
        run: node tests/v362-bphs-primary-shadbala-regression.mjs
      - name: V363 BPHS Swiss solar rise/set independent numeric oracle and Cheshta arithmetic
        run: node tests/v363-bphs-swiss-solar-cheshta-regression.mjs
      - name: V364 Swiss WASM mean orbital longitude source and BPHS classical isolation QA
        run: node tests/v364-swiss-orbital-cheshta-evidence-regression.mjs
      - name: V365 independent IMD Surya Siddhanta mean-longitude and five Sheeghrocha oracle
        run: node tests/v365-saura-mean-motion-official-panchang-regression.mjs
      - name: Official IMD seven-day five-graha BPHS Cheshta numerical reconciliation
        run: node tests/v366-bphs-published-cheshta-numerical-regression.mjs
      - name: V367 true-longitude dual-source 5-natal Shadbala certification gate
        run: node tests/v367-saura-true-natal-certification-gate.mjs
      - name: V368 paper step forensic and 25 historical candidate versus Swiss, 35 Shadbala totals
        run: node tests/v368-published-stage-historical-shadbala-audit.mjs
      - name: Classical five-graha DOB to True Longitude to Cheshta numeric engine
        run: node tests/classical-five-graha-date-to-cheshta-engine.mjs
      - name: Surya Siddhanta 24 printed Jya versus geometric four-pass and five natal checks
        run: node tests/saura-24-jya-true-natal-precision-regression.mjs
      - name: Saturn Manda Karna sign conflict and academic Mars two-date source reconciliation
        run: node tests/saura-manda-karna-two-source-numerical-reconciliation.mjs
      - name: BPHS Ch26 independent Sputa Drig + 35 live seven-graha chart numeric QA
        run: node tests/bphs-ch26-sputa-drig-live-five-charts.mjs
      - name: Official 2026 IMD versus actual live five-planet Cheshta source gap
        run: node tests/bphs-2026-live-cheshta-official-oracle.mjs
      - name: BPHS exact Naisargika and seven-graha sixfold mathematical reconciliation
        run: node tests/bphs-seven-graha-sixfold-mathematical-reconciliation.mjs
      - name: V357 BPHS Abda Masa sunrise temporal Bala and Sun Moon Cheshta
        run: node tests/v357-bphs-temporal-bala-sunrise-ahargana.mjs
      - name: V357 Mercury conjunction Paksha Bala classical audit
        run: node tests/v357-bphs-mercury-paksha-regression.mjs
      - name: V357 independent BPHS II Sun Moon Mars BAV Prastara audit
        run: node tests/v357-bphs-bav-prastara-regression.mjs
      - name: V357 book independent remaining four BAV contributor audit
        run: node tests/v357-bphs-bav-remaining-four-regression.mjs
      - name: V357 Kakshya owner mapping and SAV independent aggregation
        run: node tests/v357-kakshya-sav-independent-regression.mjs
      - name: V357 12-Lagna independent D1 narrative variability regression
        run: node tests/v357-12-lagna-narrative-variability.mjs
      - name: V357 five actual birth charts next-fifteen-year MD AD timeline
        run: node tests/v357-five-chart-fifteen-year-dasha-window.mjs
      - name: Five-book structural calculation audit (five natal charts)
        run: node tests/five-book-structural-audit.mjs
      - name: Two-person factual matching report + UTC + print/save regression
        run: node tests/marriage-basic-report-regression.mjs
      - name: Report, print, timezone input regression
        run: node tests/print-dst-location-regression.mjs
      - name: GeoNames search and authoritative timezoneId regression
        run: node tests/geonames-location-regression.cjs
      - name: Live Horoscope birth UTC-offset UI regression
        run: node tests/horoscope-birth-offset-ui-regression.mjs
      - name: DST seasonal and 30-minute region regression
        run: node tests/dst-seasonal-regression.mjs
      - name: Audit known coordinate-zone boundary precision issues
        run: |
          node tests/timezone-boundary-audit.mjs | tee timezone-precision-audit.json
          echo 'Note: source-level tests do not certify Cloudflare live deployments, browser print, or location provider policy compliance.'
      - name: Preserve timezone precision audit
        uses: actions/upload-artifact@v4
        with:
          name: SMV-TIMEZONE-PRECISION-AUDIT
          path: timezone-precision-audit.json
          retention-days: 14

  geonames-render-production-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check Render GeoNames configuration and live timezoneId
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://smvastroservices.onrender.com'
          temp="$(mktemp)"
          status="$(curl --silent --show-error --location --connect-timeout 15 --max-time 95 --output "$temp" --write-out '%{http_code}' "$ROOT/api/locations/status" || echo 000)"
          if [ "$status" != 200 ]; then
            echo "::warning::Render GeoNames backend not deployed/ready (HTTP $status); set GEONAMES_USERNAME and redeploy Render."
            exit 0
          fi
          if [ "$(jq -r '.configured // false' "$temp")" != true ]; then
            echo "::warning::Render GeoNames source deployed but GEONAMES_USERNAME is not configured. Worldwide online search remains disabled."
            exit 0
          fi
          city="$(curl --silent --show-error --location --max-time 40 "$ROOT/api/locations/search?q=London&limit=10")"
          zone="$(curl --silent --show-error --location --max-time 40 "$ROOT/api/locations/timezone?lat=51.5074&lng=-0.1278")"
          if [ "$(jq -r '.ok // false' <<< "$city")" != true ] || [ "$(jq -r '.ok // false' <<< "$zone")" != true ]; then
            echo "::error::Live GeoNames credentials or quota failed upstream test."
            exit 1
          fi
          found="$(jq -r '.timezoneId // ""' <<< "$zone")"
          echo "Live GeoNames London timezoneId=$found"
          [ "$found" = 'Europe/London' ] || { echo "::error::Unexpected live London timezoneId";exit 1; }
  production-http-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare Pages and custom domain HTTP endpoints
        shell: bash
        run: |
          set -euo pipefail
          check() {
            url="$1"
            body="$(mktemp)"
            code="$(curl --location --retry 2 --connect-timeout 10 --max-time 35 --silent --show-error --output "$body" --write-out '%{http_code}' "$url")"
            echo "$url => HTTP $code ($(wc -c < "$body") bytes)"
            if [ "$code" != "200" ] || ! grep -iq '<html' "$body"; then
              echo "::error::Live HTTP acceptance failed for $url"
              rm -f "$body"
              return 1
            fi
            rm -f "$body"
          }
          check 'https://smvastroservices.pages.dev/'
          check 'https://smvastroservices.pages.dev/horoscope/'
          check 'https://smvastroservices.pages.dev/horoscope/calendar/'
          check 'https://smvastroservices.in/'
          check 'https://smvastroservices.in/horoscope/'
