name: Burgess 1860 Historical Longitude Source Oracle
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/burgess-1860-historical-source-oracle-600-epochs.mjs'
      - 'research/saura-bija/saura-bija-mean-motion.mjs'
      - 'public/horoscope/offline/places/timezone.mjs'
      - '.github/workflows/burgess-1860-historical-source-oracle.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: burgess-1860-historical-source-oracle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check source-derived historical oracle
        run: node --check tests/burgess-1860-historical-source-oracle-600-epochs.mjs
      - name: Reproduce Burgess 1860 True worked example and derive 600 arbitrary natal epochs
        run: node tests/burgess-1860-historical-source-oracle-600-epochs.mjs
      - name: Upload 600-epoch historical source-derived longitude report
        uses: actions/upload-artifact@v4
        with:
          name: burgess-1860-source-derived-longitudes-600-epochs
          path: artifacts/burgess-1860-source-derived-longitudes-600-epochs.json
          if-no-files-found: error
          retention-days: 30
