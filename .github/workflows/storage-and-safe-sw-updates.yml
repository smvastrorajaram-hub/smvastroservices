name: Storage and Safe Service Worker Update Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'smvastroproduction/src/main/java/in/smvastroservices/smvastro/MainActivity.java'
      - 'smvhoroscopeproduction/src/main/java/in/smvastroservices/horoscope/MainActivity.java'
      - 'smvcalendarproduction/src/main/java/in/smvastroservices/calendar/MainActivity.java'
      - 'test/storage-and-safe-sw-updates.test.js'
      - 'test/android-horoscope-calendar-production.test.mjs'
      - 'test/smv-zip-brand-assets.test.mjs'
      - '.github/scripts/generate-brand-favicons-from-archive.py'
      - '.github/workflows/storage-and-safe-sw-updates.yml'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'smvastroproduction/src/main/java/in/smvastroservices/smvastro/MainActivity.java'
      - 'smvhoroscopeproduction/src/main/java/in/smvastroservices/horoscope/MainActivity.java'
      - 'smvcalendarproduction/src/main/java/in/smvastroservices/calendar/MainActivity.java'
      - 'test/storage-and-safe-sw-updates.test.js'
      - 'test/android-horoscope-calendar-production.test.mjs'
      - 'test/smv-zip-brand-assets.test.mjs'
      - '.github/scripts/generate-brand-favicons-from-archive.py'
      - '.github/workflows/storage-and-safe-sw-updates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  storage-and-sw:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the updated service worker syntax
        run: |
          node --check public/sw.js
          node --check public/horoscope/sw.js
          node --check public/horoscope/calendar/sw.js
          node --check test/storage-and-safe-sw-updates.test.js
          node --check test/android-horoscope-calendar-production.test.mjs
          node --check test/smv-zip-brand-assets.test.mjs
          python3 -m py_compile .github/scripts/generate-brand-favicons-from-archive.py
      - name: Generate official app and website icon variants from original SMV.zip when archive is present
        # ICON/SMV.zip is intentionally absent; do not recreate or restore it.
        # Existing website/PWA artwork is validated from the checked-in files instead.
        if: github.event_name == 'pull_request' && hashFiles('ICON/SMV.zip') != ''
        run: |
          python3 -m venv "$RUNNER_TEMP/smv-icons"
          "$RUNNER_TEMP/smv-icons/bin/pip" install --disable-pip-version-check --no-input Pillow==11.3.0
          "$RUNNER_TEMP/smv-icons/bin/python" .github/scripts/generate-brand-favicons-from-archive.py ICON/SMV.zip
      - name: Preserve browser state and verify synchronized three-app cache bumps
        run: node --test test/storage-and-safe-sw-updates.test.js test/android-horoscope-calendar-production.test.mjs test/smv-zip-brand-assets.test.mjs
      - name: Commit only generated icon assets to this PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/active-only-auto-busy-brand-assets-20261105-v2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const branch = context.payload.pull_request.head.ref;
            const paths = [
              'public/assets/icon-192.png',
              'public/assets/icon-512.png',
              'public/assets/favicon-astro-16.png',
              'public/assets/favicon-astro-32.png',
              'public/assets/favicon-astro-64.png',
              'public/assets/favicon-astro.ico',
              'public/horoscope/assets/favicon-horoscope-16.png',
              'public/horoscope/assets/favicon-horoscope-32.png',
              'public/horoscope/assets/favicon-horoscope-64.png',
              'public/horoscope/assets/favicon-horoscope.ico',
              'public/horoscope/assets/favicon-calendar-16.png',
              'public/horoscope/assets/favicon-calendar-32.png',
              'public/horoscope/assets/favicon-calendar-64.png',
              'public/horoscope/assets/favicon-calendar.ico'
            ];
            const { owner, repo } = context.repo;
            const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            const parentSha = ref.data.object.sha;
            const parent = await github.rest.git.getCommit({ owner, repo, commit_sha: parentSha });
            const currentTree = await github.rest.git.getTree({
              owner, repo, tree_sha: parent.data.tree.sha, recursive: '1'
            });
            const current = new Map((currentTree.data.tree || []).map(item => [item.path, item.sha]));
            const tree = [];
            for (const path of paths) {
              const content = fs.readFileSync(path).toString('base64');
              const blob = await github.rest.git.createBlob({
                owner, repo, content, encoding: 'base64'
              });
              if (current.get(path) !== blob.data.sha) {
                tree.push({ path, mode: '100644', type: 'blob', sha: blob.data.sha });
              }
            }
            if (!tree.length) {
              core.notice('Generated source icons already match the PR branch; no icon commit needed.');
              return;
            }
            const nextTree = await github.rest.git.createTree({
              owner, repo, base_tree: parent.data.tree.sha, tree
            });
            const commit = await github.rest.git.createCommit({
              owner, repo,
              message: 'Add exact SMV source PWA and website favicon assets',
              tree: nextTree.data.sha,
              parents: [parentSha]
            });
            await github.rest.git.updateRef({
              owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false
            });
            core.notice(`Committed ${tree.length} generated source icon assets to ${branch}: ${commit.data.sha}`);
