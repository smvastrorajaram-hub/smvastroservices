name: B.V. Raman Integrated Strength6 QA
on:
  push:
    branches: [main]
    paths:
      - 'bv-raman-shadbala.cjs'
      - 'public/horoscope/offline/bv-raman-shadbala.browser.mjs'
      - 'public/horoscope/offline/swiss_vedic.browser.mjs'
      - 'swiss_vedic.js'
      - 'public/horoscope/horoscope.js'
      - 'public/horoscope/marriage-basic-report.mjs'
      - 'public/horoscope/offline/cg-rajan-ayurdaya-pinda.browser.mjs'
      - 'tests/bv-raman-strength6-regression.mjs'
      - 'tests/bv-raman-ishta-kashta-regression.mjs'
      - 'tests/cg-rajan-ayurdaya-pinda-horoscope-report-qa.mjs'
      - 'tests/marriage-basic-report-regression.mjs'
      - '.github/workflows/bv-raman-strength6-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bv-raman-shadbala.cjs'
      - 'public/horoscope/offline/bv-raman-shadbala.browser.mjs'
      - 'public/horoscope/offline/swiss_vedic.browser.mjs'
      - 'swiss_vedic.js'
      - 'public/horoscope/horoscope.js'
      - 'public/horoscope/marriage-basic-report.mjs'
      - 'public/horoscope/offline/cg-rajan-ayurdaya-pinda.browser.mjs'
      - 'tests/bv-raman-strength6-regression.mjs'
      - 'tests/bv-raman-ishta-kashta-regression.mjs'
      - 'tests/cg-rajan-ayurdaya-pinda-horoscope-report-qa.mjs'
      - 'tests/marriage-basic-report-regression.mjs'
      - '.github/workflows/bv-raman-strength6-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bv-raman-strength6-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  raman-strength6:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check browser and Node source
        run: |
          node --check public/horoscope/offline/bv-raman-shadbala.browser.mjs
          node --check bv-raman-shadbala.cjs
          node --check public/horoscope/offline/swiss_vedic.browser.mjs
          node --check swiss_vedic.js
          node --check public/horoscope/horoscope.js
          node --check public/horoscope/marriage-basic-report.mjs
          node --check public/horoscope/offline/cg-rajan-ayurdaya-pinda.browser.mjs
          node --check tests/bv-raman-strength6-regression.mjs
      - name: Verify B.V. Raman printed standard-horoscope component oracle and five natal charts
        run: node tests/bv-raman-strength6-regression.mjs
      - name: Verify B.V. Raman Ishta/Kashta remains separate from sixfold Shadbala
        run: node tests/bv-raman-ishta-kashta-regression.mjs
      - name: Verify Horoscope Ayurdaya report integration and B.V. Raman strength6 output
        run: node tests/cg-rajan-ayurdaya-pinda-horoscope-report-qa.mjs
      - name: Verify Marriage Matching and report rendering use strength6
        run: node tests/marriage-basic-report-regression.mjs
