name: B.V. Raman Integrated Strength6 QA
on:
  push:
    branches: [main]
    paths:
      - 'bv-raman-shadbala.cjs'
      - 'public/horoscope/offline/bv-raman-shadbala.browser.mjs'
      - 'public/horoscope/offline/swiss_vedic.browser.mjs'
      - 'swiss_vedic.js'
      - 'public/horoscope/horoscope.js'
      - 'public/horoscope/marriage-basic-report.mjs'
      - 'public/horoscope/offline/cg-rajan-ayurdaya-pinda.browser.mjs'
      - 'tests/bv-raman-strength6-regression.mjs'
      - 'tests/bv-raman-seven-graha-numerical-certification.mjs'
      - 'tests/pac-2026-five-graha-nirayana-regression.mjs'
      - 'tests/pac-2026-full-year-five-graha-regression.mjs'
      - 'tests/fixtures/pac-2026-official-daily-pdf-manifest.json'
      - 'tests/fixtures/pac-2026-five-graha-nirayana.json'
      - 'tests/bv-raman-ishta-kashta-regression.mjs'
      - 'tests/cg-rajan-ayurdaya-pinda-horoscope-report-qa.mjs'
      - 'tests/marriage-basic-report-regression.mjs'
      - '.github/workflows/bv-raman-strength6-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bv-raman-shadbala.cjs'
      - 'public/horoscope/offline/bv-raman-shadbala.browser.mjs'
      - 'public/horoscope/offline/swiss_vedic.browser.mjs'
      - 'swiss_vedic.js'
      - 'public/horoscope/horoscope.js'
      - 'public/horoscope/marriage-basic-report.mjs'
      - 'public/horoscope/offline/cg-rajan-ayurdaya-pinda.browser.mjs'
      - 'tests/bv-raman-strength6-regression.mjs'
      - 'tests/bv-raman-seven-graha-numerical-certification.mjs'
      - 'tests/pac-2026-five-graha-nirayana-regression.mjs'
      - 'tests/pac-2026-full-year-five-graha-regression.mjs'
      - 'tests/fixtures/pac-2026-official-daily-pdf-manifest.json'
      - 'tests/fixtures/pac-2026-five-graha-nirayana.json'
      - 'tests/bv-raman-ishta-kashta-regression.mjs'
      - 'tests/cg-rajan-ayurdaya-pinda-horoscope-report-qa.mjs'
      - 'tests/marriage-basic-report-regression.mjs'
      - '.github/workflows/bv-raman-strength6-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bv-raman-strength6-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  raman-strength6:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check browser and Node source
        run: |
          node --check public/horoscope/offline/bv-raman-shadbala.browser.mjs
          node --check bv-raman-shadbala.cjs
          node --check public/horoscope/offline/swiss_vedic.browser.mjs
          node --check swiss_vedic.js
          node --check public/horoscope/horoscope.js
          node --check public/horoscope/marriage-basic-report.mjs
          node --check public/horoscope/offline/cg-rajan-ayurdaya-pinda.browser.mjs
          node --check tests/bv-raman-strength6-regression.mjs
          node --check tests/bv-raman-seven-graha-numerical-certification.mjs
          node --check tests/pac-2026-five-graha-nirayana-regression.mjs
          node --check tests/pac-2026-full-year-five-graha-regression.mjs
      - name: Verify B.V. Raman printed standard-horoscope component oracle and five natal charts
        run: node tests/bv-raman-strength6-regression.mjs
      - name: Certify seven-graha B.V. Raman totals, Rupa, ratios and ranking for the printed Standard Horoscope
        run: node tests/bv-raman-seven-graha-numerical-certification.mjs
      - name: Cross-check 2026 official PAC Nirayana longitude tables for five grahas
        run: node tests/pac-2026-five-graha-nirayana-regression.mjs
      - name: Prepare official PAC 2026 full-year daily PDF tables
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p "$RUNNER_TEMP/pac2026"
          for planet in Mercury Venus Mars Jupiter Saturn; do
            curl --fail --location --retry 3 --retry-delay 2 \
              "https://packolkata.imd.gov.in/download/nirlon/$planet.pdf" \
              --output "$RUNNER_TEMP/pac2026/$planet.pdf"
          done
          echo "PAC_PDF_DIR=$RUNNER_TEMP/pac2026" >> "$GITHUB_ENV"
          sha256sum "$RUNNER_TEMP"/pac2026/*.pdf
      - name: Compare all 1,825 daily PAC 2026 Nirayana values against Swiss Ephemeris
        run: node tests/pac-2026-full-year-five-graha-regression.mjs
      - name: Verify B.V. Raman Ishta/Kashta remains separate from sixfold Shadbala
        run: node tests/bv-raman-ishta-kashta-regression.mjs
      - name: Verify Horoscope Ayurdaya report integration and B.V. Raman strength6 output
        run: node tests/cg-rajan-ayurdaya-pinda-horoscope-report-qa.mjs
      - name: Verify Marriage Matching and report rendering use strength6
        run: node tests/marriage-basic-report-regression.mjs
