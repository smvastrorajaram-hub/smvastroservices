name: Temporary root npm lockfile sync for Cloudflare preview

on:
  push:
    branches:
      - feat/homepage-apk-single-pwa-card-20261031
    paths:
      - ".github/workflows/tmp-cloudflare-lock-sync.yml"

permissions:
  contents: write

jobs:
  sync-root-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/homepage-apk-single-pwa-card-20261031

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate package-lock.json without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify npm clean-install contract
        run: npm ci --ignore-scripts --no-audit --no-fund --dry-run

      - name: Commit only the refreshed lockfile
        env:
          TARGET_BRANCH: feat/homepage-apk-single-pwa-card-20261031
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/tmp-cloudflare-lock-sync.yml
          git add package-lock.json .github/workflows/tmp-cloudflare-lock-sync.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No lockfile difference was generated; stopping without a commit."
            exit 1
          fi
          git commit -m "Sync root npm lockfile for Cloudflare builds"
          git push origin "HEAD:\${TARGET_BRANCH}"
