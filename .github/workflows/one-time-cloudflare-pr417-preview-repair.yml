name: One-time Cloudflare PR 417 Preview settings repair

on:
  push:
    branches:
      - fix/horoscope-paid-entry-shadow-fix-20261107

permissions:
  contents: read

concurrency:
  group: cloudflare-pr417-preview-settings-repair
  cancel-in-progress: false

jobs:
  repair-preview-only:
    if: github.ref == 'refs/heads/fix/horoscope-paid-entry-shadow-fix-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect and repair only the existing PR 417 Preview
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
          CF_ACCOUNT_ID: 9b2c576e0f7ed7cf87966926e86ae22a
          TARGET_WORKER: smvastroservices
          TARGET_REPOSITORY_OWNER: smvastrorajaram-hub
          TARGET_REPOSITORY_NAME: smvastroservices
          TARGET_BRANCH: fix/horoscope-paid-entry-shadow-fix-20261107
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CF_API_TOKEN;
          const account = process.env.CF_ACCOUNT_ID;
          const targetWorker = process.env.TARGET_WORKER;
          const targetBranch = process.env.TARGET_BRANCH;
          if (!token) throw new Error("Missing GitHub Actions secret CLOUDFLARE_BUILDS_API_TOKEN.");

          const base = "https://api.cloudflare.com/client/v4";
          async function cf(path, method = "GET", body) {
            const response = await fetch(base + path, {
              method,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json"
              },
              ...(body === undefined ? {} : { body: JSON.stringify(body) })
            });
            let data;
            try { data = await response.json(); }
            catch { throw new Error(`Cloudflare API returned non-JSON response (HTTP ${response.status}).`); }
            if (!response.ok || data.success !== true) {
              const details = Array.isArray(data.errors)
                ? data.errors.map(e => `${e.code ?? "?"}: ${e.message ?? "unknown error"}`).join("; ")
                : "No error details returned";
              throw new Error(`Cloudflare API ${method} ${path} failed (HTTP ${response.status}): ${details}`);
            }
            return data.result;
          }

          const scripts = await cf(`/accounts/${account}/workers/scripts?per_page=100`);
          const worker = (Array.isArray(scripts) ? scripts : []).find(s => s.id === targetWorker);
          if (!worker?.tag) throw new Error(`Worker ${targetWorker} was not found in this Cloudflare Account; no changes made.`);
          console.log(`Worker found: ${worker.id}; immutable Worker tag resolved.`);

          const workerPath = `/accounts/${account}/builds/workers/${encodeURIComponent(worker.tag)}`;
          const buildConfig = await cf(workerPath);
          const repo = buildConfig.git_repository ?? {};
          if (repo.repo_name && repo.repo_name !== process.env.TARGET_REPOSITORY_NAME) {
            throw new Error("Worker is connected to a different repository; no changes made.");
          }
          if (repo.provider_account_name && repo.provider_account_name !== process.env.TARGET_REPOSITORY_OWNER) {
            throw new Error("Worker is connected to a different repository owner; no changes made.");
          }
          if (repo.branch && repo.branch !== "main") {
            throw new Error("Worker production branch is not main; no changes made.");
          }
          if (buildConfig.previews_enabled === false) {
            throw new Error("Worker Previews are disabled in the API configuration; no changes made.");
          }
          console.log("Worker repository and main production branch verified. Production settings will not be modified.");

          const previews = await cf(workerPath + "/previews");
          if (!Array.isArray(previews)) throw new Error("Cloudflare did not return a Preview list; no changes made.");
          const preview = previews.find(p => p.branch === targetBranch);
          if (!preview?.preview_id) {
            throw new Error(`No existing Preview was found for exact PR branch ${targetBranch}; no Preview or Production settings changed.`);
          }
          console.log(`Exact PR branch Preview found: ${preview.branch}; Preview ID resolved.`);

          const previewPath = workerPath + "/previews/" + encodeURIComponent(preview.preview_id);
          const before = await cf(previewPath);
          if (before.branch !== targetBranch) {
            throw new Error("Preview ID does not belong to the target PR branch; no changes made.");
          }

          const desired = {
            root_directory: "/",
            build_command: "npm install --no-audit --no-fund",
            deploy_command: "npx --yes wrangler@4.158.0 preview --config wrangler.jsonc"
          };
          const current = before.settings ?? {};
          const needsUpdate = Object.entries(desired).some(([key, value]) => current[key] !== value);
          if (needsUpdate) {
            await cf(previewPath, "PATCH", { settings: desired });
            console.log("Patched settings on the exact PR 417 Preview only.");
          } else {
            console.log("The exact PR 417 Preview already has the required settings; no PATCH was needed.");
          }

          const after = await cf(previewPath);
          if (after.branch !== targetBranch) throw new Error("Post-update branch verification failed.");
          const finalSettings = after.settings ?? {};
          for (const [key, value] of Object.entries(desired)) {
            if (finalSettings[key] !== value) {
              throw new Error(`Post-update verification failed for ${key}; expected value was not returned.`);
            }
          }
          console.log("VERIFIED exact PR 417 Preview settings:");
          console.log(JSON.stringify({
            branch: after.branch,
            root_directory: finalSettings.root_directory,
            build_command: finalSettings.build_command,
            preview_command: finalSettings.deploy_command
          }, null, 2));

          // Start a build for this Preview only; this endpoint cannot deploy the Production branch.
          const build = await cf(previewPath + "/builds", "POST", { branch: targetBranch });
          const buildId = build?.build_uuid ?? build?.id ?? null;
          if (!buildId) {
            console.log("Preview settings verified and Preview build request accepted; API did not return a build UUID.");
          } else {
            console.log(`Preview-only build started. Build UUID: ${buildId}`);
          }
          console.log("Safety: no Production settings, Production trigger, Worker runtime, D1, or Worker secrets were changed.");
          NODE
