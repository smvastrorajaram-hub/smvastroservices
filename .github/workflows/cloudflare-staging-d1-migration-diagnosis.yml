name: Cloudflare staging D1 migration diagnosis (read-only)

on:
  push:
    branches:
      - diagnose/cloudflare-staging-d1-migration-20261031
    paths:
      - '.github/workflows/cloudflare-staging-d1-migration-diagnosis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-staging-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify read-only staging access is configured
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare staging read-only diagnosis cannot run because credentials are unavailable."
            exit 1
          fi

      - name: List applied and pending D1 migrations (read-only)
        working-directory: cloudflare/backend-api
        run: npx --yes wrangler@4.156.0 d1 migrations list smvastro-wallet-staging --remote --config wrangler.jsonc

      - name: Inspect existing table definitions and migration metadata (read-only)
        working-directory: cloudflare/backend-api
        shell: bash
        run: |
          npx --yes wrangler@4.156.0 d1 execute smvastro-wallet-staging --remote --config wrangler.jsonc --command "SELECT type, name, sql FROM sqlite_schema WHERE name IN ('d1_migrations','smv_domain_schema_meta','smv_domain_wallets','smv_domain_wallet_recharges','smv_domain_wallet_offers','smv_domain_live_bookings','smv_domain_live_sessions','smv_domain_live_messages','smv_domain_live_signals','smv_domain_earnings','smv_domain_withdrawals') ORDER BY type, name"

      - name: Inspect status and booking-related columns (read-only)
        working-directory: cloudflare/backend-api
        shell: bash
        run: |
          npx --yes wrangler@4.156.0 d1 execute smvastro-wallet-staging --remote --config wrangler.jsonc --command "SELECT 'smv_domain_live_bookings' AS table_name, cid, name, type FROM pragma_table_info('smv_domain_live_bookings') UNION ALL SELECT 'smv_domain_wallet_recharges', cid, name, type FROM pragma_table_info('smv_domain_wallet_recharges') UNION ALL SELECT 'smv_domain_wallet_offers', cid, name, type FROM pragma_table_info('smv_domain_wallet_offers') ORDER BY table_name, cid"
