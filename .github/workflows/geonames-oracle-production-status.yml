name: GeoNames Oracle live status

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'geonames-location-service.js'
      - 'ops/oracle/**'
      - 'package.json'
      - '.github/workflows/geonames-oracle-production-status.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geonames-oracle-production-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check Oracle GeoNames configuration and live timezoneId
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://api.smvastroservices.in'
          temp="$(mktemp)"
          trap 'rm -f "$temp"' EXIT
          status="$(curl --silent --show-error --location --connect-timeout 15 --max-time 30 --output "$temp" --write-out '%{http_code}' "$ROOT/api/locations/status" || echo 000)"
          if [ "$status" != 200 ]; then
            echo "::warning::Oracle GeoNames backend not yet deployed/ready (HTTP $status); configure the OCI VM and GEONAMES_USERNAME before cutover."
            exit 0
          fi
          if [ "$(jq -r '.configured // false' "$temp")" != true ]; then
            echo "::warning::Oracle API responds, but GEONAMES_USERNAME is not configured. Worldwide online location search remains unavailable."
            exit 0
          fi
          city="$(curl --silent --show-error --location --fail --max-time 40 "$ROOT/api/locations/search?q=London&limit=10")"
          zone="$(curl --silent --show-error --location --fail --max-time 40 "$ROOT/api/locations/timezone?lat=51.5074&lng=-0.1278")"
          if [ "$(jq -r '.ok // false' <<< "$city")" != true ] || [ "$(jq -r '.ok // false' <<< "$zone")" != true ]; then
            echo "::error::Live GeoNames credentials or quota failed the upstream test."
            exit 1
          fi
          found="$(jq -r '.timezoneId // ""' <<< "$zone")"
          echo "Live Oracle GeoNames London timezoneId=$found"
          [ "$found" = 'Europe/London' ] || { echo "::error::Unexpected live London timezoneId"; exit 1; }
