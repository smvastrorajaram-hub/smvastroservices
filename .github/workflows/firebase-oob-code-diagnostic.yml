name: Firebase OOB Code Diagnostic Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/auth/oob-code-diagnostic.mjs'
      - 'public/auth/oob-diagnostic.html'
      - 'test/firebase-oob-code-diagnostic.test.mjs'
      - '.github/workflows/firebase-oob-code-diagnostic.yml'
  push:
    branches: [main]
    paths:
      - 'public/auth/oob-code-diagnostic.mjs'
      - 'public/auth/oob-diagnostic.html'
      - 'test/firebase-oob-code-diagnostic.test.mjs'
      - '.github/workflows/firebase-oob-code-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check diagnostic module syntax
        run: node --check public/auth/oob-code-diagnostic.mjs
      - name: Test non-mutating OOB validation
        run: node --test test/firebase-oob-code-diagnostic.test.mjs
