name: TEMPORARY - Generate SMV ASTRO Release Keystore

on:
  workflow_dispatch:
    inputs:
      confirm_generation:
        description: "Confirm that this creates the one-time permanent SMV ASTRO signing key"
        required: true
        type: choice
        options:
          - "I_UNDERSTAND_CREATE_THE_PERMANENT_KEY"

permissions:
  contents: none

concurrency:
  group: smv-astro-release-keystore-bootstrap
  cancel-in-progress: false

jobs:
  generate_release_keystore:
    if: ${{ inputs.confirm_generation == 'I_UNDERSTAND_CREATE_THE_PERMANENT_KEY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Java keytool
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate owner-provided secrets and prevent key rotation
        shell: bash
        env:
          SMV_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SMV_ANDROID_KEYSTORE_PASSWORD }}
          SMV_ANDROID_KEY_PASSWORD: ${{ secrets.SMV_ANDROID_KEY_PASSWORD }}
          SMV_ANDROID_KEY_ALIAS: ${{ secrets.SMV_ANDROID_KEY_ALIAS }}
          SMV_ANDROID_KEYSTORE_BASE64: ${{ secrets.SMV_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          set +x
          missing=""
          for secret_name in \
            SMV_ANDROID_KEYSTORE_PASSWORD \
            SMV_ANDROID_KEY_PASSWORD \
            SMV_ANDROID_KEY_ALIAS; do
            if [[ -z "$(printenv "$secret_name" || true)" ]]; then
              missing="$missing $secret_name"
            fi
          done
          if [[ -n "$missing" ]]; then
            echo "::error::Create these repository Actions secrets before generating the key:$missing"
            exit 1
          fi
          if [[ "$SMV_ANDROID_KEY_ALIAS" != "smvastro-release" ]]; then
            echo "::error::SMV_ANDROID_KEY_ALIAS must be exactly smvastro-release."
            exit 1
          fi
          if [[ -n "$SMV_ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::SMV_ANDROID_KEYSTORE_BASE64 already exists. Refusing to generate or rotate the permanent key."
            exit 1
          fi
          if (( ${#SMV_ANDROID_KEYSTORE_PASSWORD} < 32 )); then
            echo "::error::Use a randomly generated password of at least 32 characters."
            exit 1
          fi
          if [[ "$SMV_ANDROID_KEYSTORE_PASSWORD" != "$SMV_ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::PKCS12 requires the keystore password and key password to match. Set both Secrets to the same strong random value."
            exit 1
          fi
          echo "Required secrets are present; no keystore secret exists yet."

      - name: Generate and validate password-protected PKCS12 keystore
        shell: bash
        env:
          SMV_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SMV_ANDROID_KEYSTORE_PASSWORD }}
          SMV_ANDROID_KEY_ALIAS: ${{ secrets.SMV_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          output_dir="$RUNNER_TEMP/smv-astro-release-keystore"
          mkdir -p "$output_dir"
          keystore_path="$output_dir/smv-astro-release.p12"

          keytool -genkeypair -noprompt \
            -keystore "$keystore_path" \
            -storetype PKCS12 \
            -storepass "$SMV_ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$SMV_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$SMV_ANDROID_KEY_ALIAS" \
            -keyalg RSA -keysize 4096 -sigalg SHA256withRSA \
            -validity 10000 \
            -dname "CN=SMV ASTRO Release, OU=Android, O=SMV ASTRO SERVICES, C=IN"

          keytool -list -keystore "$keystore_path" -storetype PKCS12 \
            -storepass "$SMV_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$SMV_ANDROID_KEY_ALIAS" >/dev/null

          base64 -w 0 "$keystore_path" > "$output_dir/SMV_ANDROID_KEYSTORE_BASE64.txt"
          printf '\n' >> "$output_dir/SMV_ANDROID_KEYSTORE_BASE64.txt"

          keytool -exportcert -rfc \
            -keystore "$keystore_path" -storetype PKCS12 \
            -storepass "$SMV_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$SMV_ANDROID_KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 \
              > "$output_dir/certificate-sha256-fingerprint.txt"

          echo "PKCS12 keystore created and validated. Password was not written to artifact or logs."

      - name: Upload one-time keystore package (public repository warning applies)
        uses: actions/upload-artifact@v4
        with:
          name: SMV-ASTRO-RELEASE-KEYSTORE-ONE-TIME
          path: |
            ${{ runner.temp }}/smv-astro-release-keystore/smv-astro-release.p12
            ${{ runner.temp }}/smv-astro-release-keystore/SMV_ANDROID_KEYSTORE_BASE64.txt
            ${{ runner.temp }}/smv-astro-release-keystore/certificate-sha256-fingerprint.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove temporary runner copy
        if: ${{ always() }}
        shell: bash
        run: rm -rf "$RUNNER_TEMP/smv-astro-release-keystore"
