name: Cloudflare Backend API staging deployment

on:
  push:
    branches: [integration/cloudflare-backend-staging-stack-20261031]
    paths:
      - 'cloudflare/backend-api/**'
      - 'shared/backend-platform/**'
      - 'server.js'
      - '.github/workflows/cloudflare-backend-staging-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/integration/cloudflare-backend-staging-stack-20261031') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/integration/cloudflare-backend-staging-stack-20261031')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install isolated Express dependency
        working-directory: cloudflare/backend-api
        run: npm install --no-package-lock --ignore-scripts

      - name: Check Worker source syntax
        working-directory: cloudflare/backend-api
        run: npm run check && node --check scripts/identity-profile-readonly-preview.mjs && node --check scripts/identity-profile-import-staging.mjs

      - name: Run Firebase ID-token verifier security tests
        working-directory: cloudflare/backend-api
        run: npm run test:auth

      - name: Validate Cloudflare Worker bundle without deploying
        working-directory: cloudflare/backend-api
        run: npx --yes wrangler@4.156.0 deploy --dry-run --config wrangler.jsonc

      - name: Verify deployment credentials are present
        id: preflight
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CF_API_TOKEN" || -z "$CF_ACCOUNT_ID" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Cloudflare staging credentials are not configured."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Preflight read-only access to all seven staging source collections
        working-directory: cloudflare/backend-api
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_STAGING_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SMV_IDENTITY_PAYOUT_ENCRYPTION_KEY: ${{ secrets.SMV_IDENTITY_PAYOUT_ENCRYPTION_KEY }}
          SMV_IDENTITY_PAYOUT_KEY_VERSION: ${{ secrets.SMV_IDENTITY_PAYOUT_KEY_VERSION || 'v1' }}
        shell: bash
        run: node scripts/identity-profile-readonly-preview.mjs --preflight

      - name: Provision a staging-scoped service account from an existing Actions secret when available
        working-directory: cloudflare/backend-api
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_STAGING_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "::error::Set FIREBASE_STAGING_SERVICE_ACCOUNT_JSON in GitHub Actions Secrets to a read-only service account from smv-astro-staging. No remote migration or deploy will run."
            exit 1
          fi
          export FIREBASE_SERVICE_ACCOUNT_JSON
          node --input-type=module <<'NODE'
          const credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
          if (!credentials || credentials.project_id !== 'smv-astro-staging' ||
              !credentials.client_email || !credentials.private_key) {
            console.error('Refusing to upload credentials: service account must be complete and belong only to smv-astro-staging.');
            process.exit(1);
          }
          console.log('PASS: candidate credential is scoped to smv-astro-staging; values are not printed.');
          NODE
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | npx --yes wrangler@4.156.0 secret put FIREBASE_SERVICE_ACCOUNT_JSON --config wrangler.jsonc

      - name: Provision staging payout encryption key when configured
        working-directory: cloudflare/backend-api
        env:
          SMV_IDENTITY_PAYOUT_ENCRYPTION_KEY: ${{ secrets.SMV_IDENTITY_PAYOUT_ENCRYPTION_KEY }}
          SMV_IDENTITY_PAYOUT_KEY_VERSION: ${{ secrets.SMV_IDENTITY_PAYOUT_KEY_VERSION || 'v1' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SMV_IDENTITY_PAYOUT_ENCRYPTION_KEY:-}" ]]; then
            echo "::warning::SMV_IDENTITY_PAYOUT_ENCRYPTION_KEY is not configured. Payout records remain unmappable in preview; import and D1 authorization must stay disabled."
            exit 0
          fi
          node --input-type=module <<'NODE'
          const key = String(process.env.SMV_IDENTITY_PAYOUT_ENCRYPTION_KEY || '').trim();
          const version = String(process.env.SMV_IDENTITY_PAYOUT_KEY_VERSION || 'v1').trim();
          const normalized = key.replace(/-/g, '+').replace(/_/g, '/');
          if (!/^[A-Za-z0-9+/]+={0,2}$/.test(normalized)) {
            console.error('Refusing payout key: expected base64-encoded 32-byte staging key material.');
            process.exit(1);
          }
          const bytes = Buffer.from(normalized, 'base64');
          if (bytes.length !== 32 || bytes.toString('base64').replace(/=+$/g, '') !== normalized.replace(/=+$/g, '')) {
            console.error('Refusing payout key: expected exactly 32 decoded bytes.');
            process.exit(1);
          }
          if (!/^[A-Za-z0-9._-]{1,32}$/.test(version)) {
            console.error('Refusing payout key: key version must be 1–32 safe identifier characters.');
            process.exit(1);
          }
          console.log('PASS: staging payout key format and version are valid; values are not printed.');
          NODE
          printf '%s' "$SMV_IDENTITY_PAYOUT_ENCRYPTION_KEY" | npx --yes wrangler@4.156.0 secret put SMV_IDENTITY_PAYOUT_ENCRYPTION_KEY --config wrangler.jsonc
          printf '%s' "$SMV_IDENTITY_PAYOUT_KEY_VERSION" | npx --yes wrangler@4.156.0 secret put SMV_IDENTITY_PAYOUT_KEY_VERSION --config wrangler.jsonc

      - name: Generate a fresh Wallet payout key once and store it on the staging Worker
        working-directory: cloudflare/backend-api
        env:
          SMV_WALLET_PAYOUT_ENCRYPTION_KEY: ${{ secrets.SMV_WALLET_PAYOUT_ENCRYPTION_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.156.0 secret list --format json --config wrangler.jsonc > /tmp/wallet-worker-secrets.json
          if node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const entries = JSON.parse(readFileSync('/tmp/wallet-worker-secrets.json','utf8'));
          process.exit((Array.isArray(entries) ? entries : []).some(item => item?.name === 'SMV_WALLET_PAYOUT_ENCRYPTION_KEY') ? 0 : 1);
          NODE
          then
            echo "PASS: dedicated Wallet payout key already exists on staging Worker; no rotation was attempted."
          else
            if [[ -n "${SMV_WALLET_PAYOUT_ENCRYPTION_KEY:-}" ]]; then
              KEY="$SMV_WALLET_PAYOUT_ENCRYPTION_KEY"
            else
              KEY="$(node --input-type=module -e "import { randomBytes } from 'node:crypto'; process.stdout.write(randomBytes(32).toString('base64'))")"
            fi
            export KEY
            node --input-type=module <<'NODE'
          const value = String(process.env.KEY || '').trim();
          const decoded = Buffer.from(value, 'base64');
          if (decoded.length !== 32 || decoded.toString('base64') !== value) {
            console.error('Refusing Wallet payout key: it must be base64 for exactly 32 random bytes.');
            process.exit(1);
          }
          console.log('::add-mask::' + value);
          NODE
            printf '%s' "$KEY" | npx --yes wrangler@4.156.0 secret put SMV_WALLET_PAYOUT_ENCRYPTION_KEY --config wrangler.jsonc
            printf 'SMV_WALLET_PAYOUT_ENCRYPTION_KEY=%s\n' "$KEY" >> "$GITHUB_ENV"
            unset KEY
            echo "PASS: new AES-256-GCM key is stored as a private Cloudflare staging Worker secret; key bytes were masked."
          fi

      - name: Verify the staging Firebase service-account secret exists
        working-directory: cloudflare/backend-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.156.0 secret list --format json --config wrangler.jsonc > /tmp/staging-worker-secrets.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const secrets = JSON.parse(readFileSync('/tmp/staging-worker-secrets.json', 'utf8'));
          const names = new Set((Array.isArray(secrets) ? secrets : []).map(item => String(item?.name || '')));
          if (!names.has('FIREBASE_SERVICE_ACCOUNT_JSON')) {
            console.error('Required secret FIREBASE_SERVICE_ACCOUNT_JSON is missing from the staging Worker; deployment stopped before remote migrations.');
            process.exit(1);
          }
          console.log('PASS: staging Firebase service-account secret name is present; its value was not read.');
          NODE

      - name: Apply additive migrations to the isolated staging D1 database
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          workingDirectory: cloudflare/backend-api
          command: d1 migrations apply smvastro-wallet-staging --remote --config wrangler.jsonc

      - name: Deploy only the Cloudflare backend staging Worker
        id: deploy-worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          workingDirectory: cloudflare/backend-api
          command: deploy --config wrangler.jsonc

      - name: Verify Cloudflare Express runtime and shared D1 readiness
        env:
          WORKER_URL: https://smvastro-backend-api-staging.astroservices.workers.dev
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = String(process.env.WORKER_URL || '').replace(/\/$/, '');
          async function get(path) {
            let last = 'no response';
            for (let attempt = 1; attempt <= 16; attempt += 1) {
              try {
                const response = await fetch(base + path, { headers: { Accept: 'application/json' }, signal: AbortSignal.timeout(8000) });
                const raw = await response.text();
                let body = {};
                try { body = raw ? JSON.parse(raw) : {}; } catch { body = {}; }
                if (response.ok) return body;
                last = 'HTTP ' + response.status;
              } catch (error) {
                last = error instanceof Error ? error.message : String(error);
              }
              if (attempt < 16) await new Promise(resolve => setTimeout(resolve, 2000));
            }
            throw new Error(path + ' did not become ready: ' + last);
          }

          const health = await get('/healthz');
          if (health.ok !== true || health.runtime !== 'cloudflare-workers-express-http-bridge' || health.productionTrafficEnabled !== false) {
            throw new Error('Cloudflare Express runtime health verification failed.');
          }
          if (health.identityProfileBackfillRoutesRegistered !== true ||
              health.identityProfileBackfillToolsEnabled !== true ||
              health.identityProfileBackfillPreviewOnly !== true ||
              health.identityProfileD1AuthorizationEnabled !== false) {
            throw new Error('Identity/Profile backfill must be enabled for read-only preview only; D1 authorization must remain disabled.');
          }

          const authorizationGate = await fetch(base + '/api/auth/authorization');
          const authorizationGateBody = await authorizationGate.json().catch(() => ({}));
          if (authorizationGate.status !== 401 || authorizationGateBody.code !== 'AUTH_REQUIRED') {
            throw new Error('Firebase Firestore authorization route must reject unauthenticated requests.');
          }

          const authGate = await fetch(base + '/api/auth/session');
          const authGateBody = await authGate.json().catch(() => ({}));
          if (authGate.status !== 401 || authGateBody.code !== 'AUTH_REQUIRED') {
            throw new Error('Firebase ID-token route must reject unauthenticated requests.');
          }

          const readiness = await get('/api/backend/readiness');
          if (readiness.ready !== true || readiness.schemaVersion !== '0001_wallet_live_domain' ||
              readiness.sharedDomainSchemaVersion !== '0002_shared_domain_repository' ||
              readiness.firebaseConnected !== false || readiness.razorpayConnected !== false ||
              readiness.walletBusinessRoutesEnabled !== false ||
              readiness.walletBackfillRoutesRegistered !== true ||
              readiness.walletBackfillToolsEnabled !== true ||
              readiness.liveCallChatRoutesEnabled !== false) {
            throw new Error('Shared staging D1 readiness, additive migration or safety checks failed.');
          }

          const disabled = await fetch(base + '/api/wallet/v1/wallet/balance');
          const disabledBody = await disabled.json().catch(() => ({}));
          if (disabled.status !== 503 || disabledBody.code !== 'BACKEND_MIGRATION_NOT_CUT_OVER') {
            throw new Error('Unmigrated backend business route is not safely disabled.');
          }

          console.log('PASS Express HTTP bridge /healthz');
          console.log('PASS staging D1 base schema and shared-domain migration readiness');
          console.log('PASS unfinished business route fail-closed guard');
          console.log('Staging Worker URL: ' + base);
          NODE

      - name: Run full paginated seven-collection read-only preview
        working-directory: cloudflare/backend-api
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_STAGING_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SMV_IDENTITY_PAYOUT_ENCRYPTION_KEY: ${{ secrets.SMV_IDENTITY_PAYOUT_ENCRYPTION_KEY }}
          SMV_IDENTITY_PAYOUT_KEY_VERSION: ${{ secrets.SMV_IDENTITY_PAYOUT_KEY_VERSION || 'v1' }}
        shell: bash
        run: node scripts/identity-profile-readonly-preview.mjs

      - name: Run full paginated Wallet + Live historical read-only audit
        working-directory: cloudflare/backend-api
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_STAGING_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SMV_WALLET_PAYOUT_ENCRYPTION_KEY: ${{ env.SMV_WALLET_PAYOUT_ENCRYPTION_KEY || secrets.SMV_WALLET_PAYOUT_ENCRYPTION_KEY }}
          SMV_WALLET_PAYOUT_KEY_VERSION: 'v1'
        shell: bash
        run: node scripts/wallet-live-readonly-preview.mjs


      - name: Import and reconcile Identity/Profile into staging D1 only
        working-directory: cloudflare/backend-api
        env:
          SMV_ENVIRONMENT: staging
          SMV_IDENTITY_PROFILE_STAGING_IMPORT_ENABLED: 'true'
          SMV_IDENTITY_PROFILE_PRODUCTION_IMPORT_ENABLED: 'false'
          SMV_IDENTITY_PROFILE_D1_DATABASE_ID: 0ddb87a9-8a16-4e39-a806-c9137c64959a
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: \${{ secrets.FIREBASE_STAGING_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SMV_IDENTITY_PAYOUT_ENCRYPTION_KEY: \${{ secrets.SMV_IDENTITY_PAYOUT_ENCRYPTION_KEY }}
          SMV_IDENTITY_PAYOUT_KEY_VERSION: \${{ secrets.SMV_IDENTITY_PAYOUT_KEY_VERSION || 'v1' }}
        shell: bash
        run: node scripts/identity-profile-import-staging.mjs
