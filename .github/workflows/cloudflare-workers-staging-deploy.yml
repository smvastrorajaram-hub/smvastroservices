name: Cloudflare Workers staging deployment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'cloudflare/workers-api/**'
      - '.github/workflows/cloudflare-workers-staging-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/cloudflare-workers-api-phase1-20261030')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check deployment secrets without exposing values
        id: preflight
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEONAMES_USERNAME: ${{ secrets.GEONAMES_USERNAME }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
        shell: bash
        run: |
          missing=()
          for name in CF_API_TOKEN CF_ACCOUNT_ID GEONAMES_USERNAME ALLOWED_ORIGINS; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging deploy skipped. Add the required GitHub Actions repository secrets documented in cloudflare/workers-api/README.md, then rerun this workflow."
            printf 'Missing secret(s): %s\n' "${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All required deployment secrets are present."
          fi

      - name: Deploy staging Worker and upload encrypted secrets
        if: steps.preflight.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          workingDirectory: cloudflare/workers-api
          secrets: |
            GEONAMES_USERNAME
            ALLOWED_ORIGINS
          command: deploy
        env:
          GEONAMES_USERNAME: ${{ secrets.GEONAMES_USERNAME }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}

      - name: Verify live staging health, GeoNames search, and timezone
        if: steps.preflight.outputs.ready == 'true'
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = String(process.env.WORKER_URL || '').replace(/\/$/, '');
          if (!base) throw new Error('Cloudflare did not return a staging deployment URL.');

          async function get(path) {
            const response = await fetch(base + path, { headers: { Accept: 'application/json' } });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}: ${body.error || 'unknown error'}`);
            return body;
          }

          const health = await get('/healthz');
          if (health.ok !== true || health.runtime !== 'cloudflare-workers') throw new Error('Health check response mismatch.');

          const status = await get('/api/locations/status');
          if (status.configured !== true || status.provider !== 'GeoNames') throw new Error('GeoNames secret is not configured on the staging Worker.');

          const search = await get('/api/locations/search?q=Madurai&limit=10&lang=en');
          if (!Array.isArray(search.rows) || !search.rows.some(row => String(row.place || '').toLowerCase().includes('madurai'))) {
            throw new Error('Live GeoNames Madurai search did not return the expected city.');
          }

          const timezone = await get('/api/locations/timezone?lat=9.9252&lng=78.1198');
          if (timezone.timezoneId !== 'Asia/Kolkata' || timezone.timezoneSource !== 'geonames-timezoneJSON') {
            throw new Error('Live GeoNames timezone result did not match Asia/Kolkata.');
          }

          console.log('PASS /healthz');
          console.log('PASS /api/locations/status (configured)');
          console.log('PASS /api/locations/search (Madurai)');
          console.log('PASS /api/locations/timezone (Asia/Kolkata)');
          console.log('Staging Worker URL: ' + base);
          NODE
