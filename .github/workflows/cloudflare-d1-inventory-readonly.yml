name: Cloudflare D1 account inventory (read-only)

on:
  push:
    branches:
      - integration/cloudflare-backend-staging-stack-20261031
    paths:
      - '.github/workflows/cloudflare-d1-inventory-readonly.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read all D1 database names and IDs, then inspect schema names only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = String(process.env.CLOUDFLARE_API_TOKEN || '').trim();
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '').trim();
          if (!token || !accountId) {
            console.error('Cloudflare D1 inventory cannot run: account API token or account ID is not configured.');
            process.exit(1);
          }

          const base = 'https://api.cloudflare.com/client/v4/accounts/' +
            encodeURIComponent(accountId) + '/d1/database';
          const headers = {
            Authorization: 'Bearer ' + token,
            'Content-Type': 'application/json',
            Accept: 'application/json'
          };

          async function request(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) },
              signal: AbortSignal.timeout(20000)
            });
            const body = await response.json().catch(() => null);
            if (!response.ok || body?.success !== true) {
              const message = Array.isArray(body?.errors)
                ? body.errors.map(item => String(item?.code || '')).filter(Boolean).join(',')
                : '';
              throw new Error('Cloudflare D1 inventory API request failed (HTTP ' +
                response.status + (message ? ', API codes ' + message : '') + ').');
            }
            return body;
          }

          const databases = [];
          for (let page = 1; page <= 100; page += 1) {
            const result = await request(base + '?page=' + page + '&per_page=10000');
            for (const item of Array.isArray(result.result) ? result.result : []) {
              const uuid = String(item?.uuid || '').trim();
              const name = String(item?.name || '').trim();
              if (uuid && name) databases.push({
                uuid, name,
                created_at: String(item.created_at || ''),
                jurisdiction: String(item.jurisdiction || ''),
                version: String(item.version || '')
              });
            }
            const info = result.result_info || {};
            const totalPages = Number(info.total_pages || 0);
            if (totalPages > 0 ? page >= totalPages : databases.length >= Number(info.total_count || databases.length)) break;
            if (!result.result?.length) break;
          }

          if (databases.length > 1000) {
            throw new Error('D1 inventory exceeded the safety bound of 1,000 databases; inspect account pagination separately.');
          }

          const knownStagingId = '0ddb87a9-8a16-4e39-a806-c9137c64959a';
          const knownApkId = '5105ebb3-435c-47b7-9983-2e171fa911cd';
          const schemaCandidates = databases.filter(item =>
            item.uuid !== knownApkId &&
            (/(smv|astro|horoscope|calendar)/i.test(item.name) ||
             /prod|production/i.test(item.name))
          );

          const summaries = [];
          for (const database of schemaCandidates) {
            const payload = await request(base + '/' + encodeURIComponent(database.uuid) + '/query', {
              method: 'POST',
              body: JSON.stringify({
                sql: "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name"
              })
            });
            const rows = Array.isArray(payload.result?.[0]?.results)
              ? payload.result[0].results : [];
            const tables = rows.map(row => String(row?.name || '')).filter(Boolean);
            const markers = [
              'smv_wallet_schema_meta',
              'smv_domain_schema_meta',
              'smv_domain_wallets',
              'smv_domain_legacy_wallet_transactions',
              'smv_domain_live_sessions'
            ];
            const markerCount = markers.filter(marker => tables.includes(marker)).length;
            summaries.push({
              name: database.name,
              uuid: database.uuid,
              created_at: database.created_at,
              version: database.version,
              markerCount,
              matchingSchema: markerCount >= 2,
              tables: tables.filter(name =>
                /^smv_|^wallet|^live_|^razorpay|^identity/i.test(name)
              )
            });
          }

          const inventory = databases.map(database => ({
            name: database.name,
            uuid: database.uuid,
            created_at: database.created_at,
            jurisdiction: database.jurisdiction,
            classification: database.uuid === knownStagingId ? 'KNOWN_STAGING_DATABASE'
              : database.uuid === knownApkId ? 'APK_RELEASE_DATABASE_DO_NOT_REUSE'
              : summaries.some(item => item.uuid === database.uuid && item.matchingSchema)
                ? 'SMV_DOMAIN_SCHEMA_MATCH_REQUIRES_OPERATOR_CONFIRMATION'
                : 'UNCLASSIFIED_DO_NOT_BIND'
          }));

          console.log('CLOUDFLARE_D1_READ_ONLY_INVENTORY');
          console.log(JSON.stringify({
            inventoryMode: 'read_only',
            databaseCount: databases.length,
            inventory,
            schemaInspection: summaries,
            inspectedData: 'sqlite_master table names only; no application rows',
            writesPerformed: 0,
            migrationsApplied: 0,
            databasesCreated: 0,
            sourceDataRead: false,
            productionTargetSelected: false
          }));
          NODE
