name: Cloudflare Production D1 readiness audit

on:
  workflow_run:
    workflows:
      - Cloudflare Production Backend Worker deploy
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-production-d1-readiness-audit.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-production-d1-readiness-audit
  cancel-in-progress: false

jobs:
  audit-production-d1:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      # Keep Wrangler's standard env name, but source it from the dedicated Production D1 token.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout the exact Production Worker deployment revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve Cloudflare account from exact Production D1 database
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_D1_API_TOKEN secret in the GitHub production environment.'; exit 1; }
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            account_id="$(node .github/scripts/resolve-cloudflare-account-from-production-d1.mjs)"
            test -n "$account_id" || { echo 'Unable to resolve Production D1 account.'; exit 1; }
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          fi

      - name: Install Wrangler
        run: npm install --prefix cloudflare/backend-api --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Read Production D1 migration history (no writes)
        working-directory: cloudflare/backend-api
        run: npx --yes wrangler@4.156.0 d1 migrations list smvastro-wallet-production --remote --config wrangler.production.jsonc

      - name: Read Production D1 schema markers only (SELECT queries)
        working-directory: cloudflare/backend-api
        run: |
          set -euo pipefail
          npx --yes wrangler@4.156.0 d1 execute smvastro-wallet-production --remote --config wrangler.production.jsonc --json --command "SELECT name, type FROM sqlite_master WHERE name IN ('smv_wallet_schema_meta','smv_domain_schema_meta','smv_domain_wallets','smv_domain_live_sessions','smv_domain_live_bookings','smv_domain_withdrawal_payouts_encrypted','smv_domain_razorpay_webhook_events','smv_domain_notification_inbox','smv_domain_offer_redemptions','smv_domain_identity_users','idx_smv_domain_sessions_customer_recent','idx_smv_domain_sessions_astrologer_recent','idx_smv_domain_sessions_customer_status_updated','idx_smv_domain_sessions_astrologer_status_updated','idx_smv_domain_sessions_customer_appointment','idx_smv_domain_sessions_astrologer_appointment','smv_domain_promotional_fund','smv_domain_promotional_fund_ledger','smv_domain_promotional_fund_ledger_validate','smv_domain_promotional_fund_ledger_apply') ORDER BY type, name; SELECT schema_key, schema_version FROM smv_domain_schema_meta ORDER BY schema_key; SELECT name FROM pragma_table_info('smv_domain_razorpay_webhook_events') WHERE name IN ('claim_token','lease_until_ms') ORDER BY name; SELECT name, type FROM sqlite_master WHERE type='trigger' AND name IN ('smv_domain_offer_redemption_validate','smv_domain_offer_redemption_apply','smv_domain_live_booking_release_pending_validate') ORDER BY name;"



      - name: Assert Admin Promotional Fund objects are absent from Production D1 (SELECT only)
        working-directory: cloudflare/backend-api
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx --yes wrangler@4.156.0 d1 execute smvastro-wallet-production --remote --config wrangler.production.jsonc --json --command "SELECT 'ADMIN_PROMOTIONAL_FUND_REMOVED' AS audit_status WHERE NOT EXISTS (SELECT 1 FROM sqlite_master WHERE type='table' AND name IN ('smv_domain_promotional_fund','smv_domain_promotional_fund_ledger')) AND NOT EXISTS (SELECT 1 FROM sqlite_master WHERE type='trigger' AND name IN ('smv_domain_promotional_fund_ledger_validate','smv_domain_promotional_fund_ledger_apply'))")"
          printf '%s\n' "$result"
          printf '%s' "$result" | grep -q 'ADMIN_PROMOTIONAL_FUND_REMOVED' || { echo 'Admin Promotional Fund D1 objects still exist.'; exit 1; }

      - name: Count Production Wallet and Live domain rows only (no record values)
        working-directory: cloudflare/backend-api
        run: |
          set -euo pipefail
          npx --yes wrangler@4.156.0 d1 execute smvastro-wallet-production --remote --config wrangler.production.jsonc --json --command "SELECT 'wallets' AS domain, COUNT(*) AS row_count FROM smv_domain_wallets; SELECT 'wallet_ledger' AS domain, COUNT(*) AS row_count FROM smv_domain_wallet_ledger; SELECT 'wallet_recharges' AS domain, COUNT(*) AS row_count FROM smv_domain_wallet_recharges; SELECT 'legacy_wallet_documents' AS domain, COUNT(*) AS row_count FROM smv_domain_legacy_documents; SELECT 'legacy_wallet_transactions' AS domain, COUNT(*) AS row_count FROM smv_domain_legacy_wallet_transactions; SELECT 'legacy_wallet_recharges' AS domain, COUNT(*) AS row_count FROM smv_domain_legacy_wallet_recharges; SELECT 'live_sessions' AS domain, COUNT(*) AS row_count FROM smv_domain_live_sessions; SELECT 'live_bookings' AS domain, COUNT(*) AS row_count FROM smv_domain_live_bookings; SELECT 'live_messages' AS domain, COUNT(*) AS row_count FROM smv_domain_live_messages; SELECT 'live_signals' AS domain, COUNT(*) AS row_count FROM smv_domain_live_signals; SELECT 'earnings' AS domain, COUNT(*) AS row_count FROM smv_domain_earnings; SELECT 'withdrawals' AS domain, COUNT(*) AS row_count FROM smv_domain_withdrawals; SELECT 'withdrawal_payouts_encrypted' AS domain, COUNT(*) AS row_count FROM smv_domain_withdrawal_payouts_encrypted; SELECT 'withdrawal_payouts_legacy_plaintext' AS domain, COUNT(*) AS row_count FROM smv_domain_withdrawal_payouts;"

      - name: Audit legacy Free Minutes exposure using aggregate counts only (SELECT queries)
        working-directory: cloudflare/backend-api
        run: |
          set -euo pipefail
          npx --yes wrangler@4.156.0 d1 execute smvastro-wallet-production --remote --config wrangler.production.jsonc --json --command "SELECT 'active_legacy_minute_offers' AS audit_item, COUNT(*) AS row_count FROM smv_domain_wallet_offers WHERE enabled=1 AND bonus_minutes>0; SELECT 'customer_wallets_with_legacy_minutes' AS audit_item, COUNT(*) AS wallet_count, COALESCE(SUM(bonus_minutes_balance),0) AS total_minutes FROM smv_domain_wallets WHERE owner_role='customer' AND bonus_minutes_balance>0; SELECT 'customer_wallets_with_reserved_legacy_minutes' AS audit_item, COUNT(*) AS wallet_count, COALESCE(SUM(reserved_bonus_minutes),0) AS total_reserved_minutes FROM smv_domain_wallets WHERE owner_role='customer' AND reserved_bonus_minutes>0; SELECT 'bonus_credit_wallet_columns' AS audit_item, name FROM pragma_table_info('smv_domain_wallets') WHERE name IN ('bonus_credit_balance_paise','reserved_bonus_credit_paise') ORDER BY name; SELECT 'bonus_credit_offer_column' AS audit_item, name FROM pragma_table_info('smv_domain_wallet_offers') WHERE name='bonus_credit_paise' ORDER BY name;"


      - name: Verify live Production Worker health and selected financial routing gates
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://smvastroservices.astroservices.workers.dev'
          for path in /healthz /api/backend/readiness /api/backend/migration-status; do
            safe_name="$(printf '%s' "$path" | tr '/-' '__')"
            code="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "/tmp/smv-prod-$safe_name.json" --write-out '%{http_code}' "$ROOT$path" || true)"
            echo "GET $path => HTTP $code"
            cat "/tmp/smv-prod-$safe_name.json" || true
            echo
            test "$code" = '200' || { echo "Production endpoint $path did not return HTTP 200."; exit 1; }
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = name => JSON.parse(fs.readFileSync('/tmp/smv-prod-' + name + '.json', 'utf8'));
          const health = read('_healthz');
          const readiness = read('_api_backend_readiness');
          const migration = read('_api_backend_migration_status');
          const required = [
            '0002_shared_domain_repository',
            '0003_notification_inbox',
            '0004_wallet_offer_redemptions',
            '0005_legacy_wallet_backfill',
            '0006_d1_live_wallet_settlement',
            '0007_identity_profile_domain',
            '0008_identity_profile_backfill_audit',
            '0009_wallet_razorpay_payout_encryption',
            '0010_razorpay_webhook_claim_leases',
            '0011_live_booking_release_claim',
            '0012_numeric_public_reference_ids',
            '0013_bonus_credit_wallet',
            '0014_live_session_query_indexes'
          ];
          const failed = [];
          if (health.ok !== true || health.environment !== 'production') failed.push('Production Worker health/environment');
          if (health.walletPayoutEncryptionConfigured !== true) failed.push('Wallet payout AES-256-GCM encryption key is not configured');
          for (const [name, value] of Object.entries({
            backendActive: health.backendActive,
            walletReadRoutesRegistered: health.walletReadRoutesRegistered,
            walletReadRoutesEnabled: health.walletReadRoutesEnabled,
            walletRechargeRoutesRegistered: health.walletRechargeRoutesRegistered,
            walletRechargeRoutesEnabled: health.walletRechargeRoutesEnabled,
            walletOfferRoutesRegistered: health.walletOfferRoutesRegistered,
            walletOfferRoutesEnabled: health.walletOfferRoutesEnabled,
            liveSessionRoutesRegistered: health.liveSessionRoutesRegistered,
            liveCallChatRoutesEnabled: health.liveCallChatRoutesEnabled,
            identityProfileD1AuthorizationEnabled: health.identityProfileD1AuthorizationEnabled,
            identityProfileD1AuthorizationReady: health.identityProfileD1AuthorizationReady,
            productionFinancialTrafficRoutingEnabled: health.productionFinancialTrafficRoutingEnabled
          })) if (value !== true) failed.push('selected Production financial gate: ' + name);
          if (health.walletRechargeMode !== 'live') failed.push('walletRechargeMode must be live');
          if (health.razorpayMode !== 'live' || health.razorpayCredentialsConfigured !== true ||
              health.razorpayProviderConnectionVerified !== true) failed.push('Razorpay Live provider verification');
          if (health.productionTrafficEnabled !== false) failed.push('whole-backend productionTrafficEnabled must remain false');

          if (readiness.ok !== true || readiness.ready !== true) failed.push('/api/backend/readiness must PASS');
          if (readiness.checks?.d1Binding !== true || readiness.checks?.allRequiredMigrations !== true) failed.push('D1 binding/migration checks');
          for (const name of required) {
            if (readiness.migrationStatus?.[name] !== true) failed.push('readiness migration: ' + name);
            if (migration.migrationStatus?.[name] !== true) failed.push('migration-status migration: ' + name);
          }
          for (const [name, value] of Object.entries({
            firebaseConnected: readiness.firebaseConnected,
            walletPayoutEncryptionConfigured: readiness.walletPayoutEncryptionConfigured,
            walletPayoutEncryptionReady: readiness.walletPayoutEncryptionReady,
            walletReadRoutesEnabled: readiness.walletReadRoutesEnabled,
            walletRechargeRoutesEnabled: readiness.walletRechargeRoutesEnabled,
            walletOfferRoutesEnabled: readiness.walletOfferRoutesEnabled,
            liveCallChatRoutesEnabled: readiness.liveCallChatRoutesEnabled,
            identityProfileD1AuthorizationEnabled: readiness.identityProfileD1AuthorizationEnabled,
            identityProfileD1AuthorizationReady: readiness.identityProfileD1AuthorizationReady,
            razorpayCredentialsConfigured: readiness.razorpayCredentialsConfigured,
            razorpayProviderConnectionVerified: readiness.razorpayProviderConnectionVerified,
            productionFinancialTrafficRoutingEnabled: readiness.productionFinancialTrafficRoutingEnabled
          })) if (value !== true) failed.push('readiness gate: ' + name);
          if (readiness.walletRechargeMode !== 'live' || readiness.razorpayMode !== 'live') {
            failed.push('readiness must report Wallet Recharge and Razorpay Live');
          }

          if (migration.ok !== true || migration.schemaReady !== true) failed.push('/api/backend/migration-status schemaReady');
          for (const [name, value] of Object.entries({
            walletReadRoutesEnabled: migration.walletReadRoutesEnabled,
            walletRechargeRoutesEnabled: migration.walletRechargeRoutesEnabled,
            walletOfferRoutesEnabled: migration.walletOfferRoutesEnabled,
            liveSessionRoutesEnabled: migration.liveSessionRoutesEnabled,
            productionFinancialTrafficRoutingEnabled: migration.productionFinancialTrafficRoutingEnabled
          })) if (value !== true) failed.push('selected financial migration-status gate: ' + name);
          if (migration.walletPayoutEncryptionConfigured !== true) failed.push('migration-status payout encryption key is not configured');
          if (migration.productionTrafficEnabled !== false) failed.push('whole-backend productionTrafficEnabled must remain false');
          if (migration.walletBusinessRoutesEnabled !== false) failed.push('walletBusinessRoutesEnabled must remain false');
          if (migration.identityProfileD1AuthorizationReady !== true) failed.push('identity profile D1 authorization must be ready');
          if (migration.razorpayMode !== 'live') failed.push('migration-status Razorpay mode must remain live');

          if (failed.length) {
            console.error('Production readiness audit FAILED:', failed.join('; '));
            process.exit(1);
          }
          console.log('PASS: all 13 Production D1 migration contracts are present.');
          console.log('PASS: Worker, D1, Firebase Project 1 identity and Razorpay Live readiness checks passed.');
          console.log('PASS: selected Cloudflare Wallet, Recharge, Offers and Live/Booking financial routes are enabled.');
          console.log('PASS: productionFinancialTrafficRoutingEnabled=true; whole-backend productionTrafficEnabled=false.');
          NODE
