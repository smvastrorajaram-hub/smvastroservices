name: Staging v2 Cloudflare website fallback

on:
  push:
    branches:
      - feat/staging-v2-cloudflare-api-gateway-20261101
    paths:
      - 'public/**'
      - 'cloudflare/website-gateway/**'
      - 'test/cloudflare-website-gateway.test.mjs'
      - '.github/workflows/staging-v2-cloudflare-website-fallback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated Staging source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker and run website fallback tests
        run: |
          node --check cloudflare/website-gateway/src/index.mjs
          node --test test/cloudflare-website-gateway.test.mjs
      - name: Deploy independent Cloudflare Staging website gateway
        working-directory: cloudflare/website-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy --config wrangler.jsonc
