name: Production PWA Network + Firebase Profile

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/production-pwa-network-firebase-audit.mjs'
      - 'tests/production-main-thread-diagnostic.mjs'
      - '.github/workflows/production-pwa-network-firebase-audit.yml'
      - 'audits/SMV_PRODUCTION_PWA_NETWORK_FIREBASE_PROFILE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-pwa-network-firebase-profile-${{ github.event.pull_request.head.sha || github.sha }}-diagnostic-v2
  cancel-in-progress: true

jobs:
  production-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install repository browser dependencies
        run: npm install --no-save --package-lock=false --no-audit --no-fund
      - name: Syntax check production profiler
        run: node --check tests/production-pwa-network-firebase-audit.mjs
      - name: Diagnose production JavaScript responsiveness with CDP Debugger
        env:
          SMV_PRODUCTION_BASE_URL: https://smvastroservices.pages.dev
        run: |
          set -o pipefail
          node tests/production-main-thread-diagnostic.mjs 2>&1 | tee main-thread-diagnostic.log
      - name: Measure live PWA cold install, resource transfer, and Firebase traffic
        env:
          SMV_PRODUCTION_BASE_URL: https://smvastroservices.pages.dev
        run: |
          set -o pipefail
          node tests/production-pwa-network-firebase-audit.mjs 2>&1 | tee production-profile.log
      - name: Upload redacted measurement report and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMV-PRODUCTION-PWA-FIREBASE-PROFILE
          path: |
            artifacts/production-pwa-network-firebase-profile.json
            artifacts/production-main-thread-diagnostic.json
            production-profile.log
            main-thread-diagnostic.log
          if-no-files-found: warn
          retention-days: 14
