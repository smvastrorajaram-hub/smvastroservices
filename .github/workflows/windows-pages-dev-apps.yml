name: Permanent Windows Releases — Pages.dev Apps

on:
  pull_request:
    paths:
      - 'desktop/pages-astro-windows/**'
      - 'desktop/pages-horoscope-windows/**'
      - 'desktop/pages-calendar-windows/**'
      - 'public/sw.js'
      - 'public/horoscope/index.html'
      - 'public/horoscope/horoscope.css'
      - 'public/horoscope/sw.js'
      - 'public/horoscope/calendar/index.html'
      - 'public/horoscope/calendar/sw.js'
      - 'test/pages-dev-windows.test.cjs'
      - '.github/scripts/windows-pages-desktop-smoke.cjs'
      - '.github/workflows/windows-pages-dev-apps.yml'
  workflow_dispatch:
    inputs:
      astro_version:
        description: 'SMV ASTRO Pages.dev version (x.y.z; creates a permanent GitHub Release)'
        required: true
        type: string
        default: '0.1.0'
      horoscope_version:
        description: 'SMV HOROSCOPE Pages.dev version (x.y.z; creates a permanent GitHub Release)'
        required: true
        type: string
        default: '0.1.0'
      calendar_version:
        description: 'SMV CALENDAR Pages.dev version (x.y.z; creates a permanent GitHub Release)'
        required: true
        type: string
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build-install-desktop-and-offline-test:
    name: Build, install and test Pages.dev ${{ matrix.app }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - app: ASTRO
            key: astro
            name: SMV ASTRO
            directory: desktop/pages-astro-windows
            executable: SMV ASTRO.exe
            path: /
            cache: smv-astro-shell-
            version: ${{ github.event_name == 'workflow_dispatch' && inputs.astro_version || '0.1.0' }}
            installer_prefix: SMV-ASTRO-Pages-Setup
            release_name: SMV ASTRO Pages.dev Windows
            tag_prefix: smv-pages-astro-windows
          - app: HOROSCOPE
            key: horoscope
            name: SMV HOROSCOPE
            directory: desktop/pages-horoscope-windows
            executable: SMV HOROSCOPE.exe
            path: /horoscope/
            cache: smv-horoscope-shell-
            version: ${{ github.event_name == 'workflow_dispatch' && inputs.horoscope_version || '0.1.0' }}
            installer_prefix: SMV-HOROSCOPE-Pages-Setup
            release_name: SMV HOROSCOPE Pages.dev Windows
            tag_prefix: smv-pages-horoscope-windows
          - app: CALENDAR
            key: calendar
            name: SMV CALENDAR
            directory: desktop/pages-calendar-windows
            executable: SMV CALENDAR.exe
            path: /horoscope/calendar/
            cache: smv-calendar-forecast-assets-
            version: ${{ github.event_name == 'workflow_dispatch' && inputs.calendar_version || '0.1.0' }}
            installer_prefix: SMV-CALENDAR-Pages-Setup
            release_name: SMV CALENDAR Pages.dev Windows
            tag_prefix: smv-pages-calendar-windows

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate and set manually selected Windows release version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        working-directory: ${{ matrix.directory }}
        env:
          APP_VERSION: ${{ matrix.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:APP_VERSION -notmatch '^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$') {
            throw "Version must use semantic version format x.y.z, optionally with prerelease/build metadata."
          }
          npm pkg set "version=$env:APP_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Could not set the requested app version.' }

      - name: Install desktop build dependencies
        working-directory: ${{ matrix.directory }}
        run: npm install --no-audit --no-fund

      - name: Run Pages.dev, PWA and offline source regression tests
        working-directory: ${{ matrix.directory }}
        run: npm test

      - name: Build Pages.dev Windows installer
        working-directory: ${{ matrix.directory }}
        run: npm run dist:win

      - name: Resolve versioned Windows installer
        id: installer
        shell: pwsh
        env:
          APP_DIRECTORY: ${{ matrix.directory }}
          INSTALLER_PREFIX: ${{ matrix.installer_prefix }}
          APP_VERSION: ${{ matrix.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE (Join-Path $env:APP_DIRECTORY ("release/" + $env:INSTALLER_PREFIX + "-" + $env:APP_VERSION + "-x64.exe"))
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw "Versioned Windows installer was not produced: $path"
          }
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Install and launch packaged Windows application
        shell: pwsh
        env:
          APP_LABEL: ${{ matrix.app }}
          APP_KEY: ${{ matrix.key }}
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
          APP_EXE: ${{ matrix.executable }}
          EXPECTED_NAME: ${{ matrix.name }}
          EXPECTED_PATH: ${{ matrix.path }}
          CACHE_PREFIX: ${{ matrix.cache }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = $env:INSTALLER_PATH
          $installDir = Join-Path $env:RUNNER_TEMP ("smv-pages-" + $env:APP_KEY)
          if (Test-Path -LiteralPath $installDir) {
            Remove-Item -LiteralPath $installDir -Recurse -Force
          }

          $setup = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($setup.ExitCode -ne 0) {
            throw "$env:APP_LABEL installer exited with code $($setup.ExitCode)"
          }

          $appPath = Join-Path $installDir $env:APP_EXE
          if (-not (Test-Path -LiteralPath $appPath -PathType Leaf)) {
            $found = Get-ChildItem -LiteralPath $installDir -Filter '*.exe' -File -Recurse |
              Where-Object { $_.Name -eq $env:APP_EXE } |
              Select-Object -First 1
            if ($null -eq $found) { throw "$env:APP_LABEL executable was not found after installation." }
            $appPath = $found.FullName
          }

          $env:SMV_DEBUG_PORT = '9222'
          $env:SMV_EXPECTED_NAME = $env:EXPECTED_NAME
          $env:SMV_EXPECTED_PATH = $env:EXPECTED_PATH
          $env:SMV_CACHE_PREFIX = $env:CACHE_PREFIX
          $proofDir = Join-Path $env:GITHUB_WORKSPACE 'pages-dev-desktop-proof'
          New-Item -ItemType Directory -Force -Path $proofDir | Out-Null
          $env:SMV_SCREENSHOT_DIR = $proofDir

          $logPath = Join-Path $env:RUNNER_TEMP ("smv-pages-" + $env:APP_KEY + "-electron.log")
          $appProcess = Start-Process -FilePath $appPath -ArgumentList @(
            '--remote-debugging-port=9222',
            '--remote-allow-origins=*',
            '--enable-logging',
            "--log-file=$logPath"
          ) -PassThru

          try {
            node (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/windows-pages-desktop-smoke.cjs')
            $proofImages = @(Get-ChildItem -LiteralPath $env:SMV_SCREENSHOT_DIR -Filter '*.png' -File)
            if ($proofImages.Count -lt 2) { throw 'Desktop and offline proof screenshots were not created.' }
            $appProcess.Refresh()
            if ($appProcess.HasExited) {
              throw "$env:APP_LABEL closed before desktop/offline validation finished."
            }
          } finally {
            & taskkill.exe /PID $appProcess.Id /T /F | Out-Null
            if ($LASTEXITCODE -ne 0) {
              Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Publish permanent Pages.dev Windows Release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ matrix.tag_prefix }}-v${{ matrix.version }}
          name: ${{ matrix.release_name }} v${{ matrix.version }}
          body: |
            Permanent Windows installer for ${{ matrix.release_name }}.
            Built from commit ${{ github.sha }}.
          files: ${{ steps.installer.outputs.path }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - name: Upload desktop and offline screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smv-pages-${{ matrix.key }}-desktop-offline-proof
          path: |
            pages-dev-desktop-proof/*.png
            ${{ runner.temp }}/smv-pages-${{ matrix.key }}-electron.log
          if-no-files-found: ignore
          retention-days: 14
