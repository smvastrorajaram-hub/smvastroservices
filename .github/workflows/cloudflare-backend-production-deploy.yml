name: Deploy SMV ASTRO Production Backend Worker

on:
  push:
    branches:
      - integration/cloudflare-backend-staging-stack-20261031
    paths:
      - ".github/config/wrangler.production.jsonc"
      - ".github/workflows/cloudflare-backend-production-deploy.yml"
  pull_request:
    branches:
      - integration/cloudflare-backend-staging-stack-20261031
    paths:
      - ".github/config/wrangler.production.jsonc"
      - ".github/scripts/verify-cloudflare-production-worker-preflight.mjs"
      - ".github/workflows/cloudflare-backend-production-deploy.yml"
  workflow_dispatch:
    inputs:
      confirm_production_binding:
        description: "Confirm deployment to smvastroservices.astroservices.workers.dev with smvastro-wallet-production"
        required: true
        type: choice
        options:
          - "yes"

permissions:
  contents: read

concurrency:
  group: smvastroservices-production-worker
  cancel-in-progress: false

jobs:
  validate-production-worker:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout the exact proposed integration revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install isolated Worker dependencies
        working-directory: cloudflare/backend-api
        run: npm install --no-package-lock --ignore-scripts

      - name: Check Worker and production preflight syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/backend-api/src/index.mjs
          node --check .github/scripts/verify-cloudflare-production-worker-preflight.mjs

      - name: Run the complete Cloudflare backend contract test suite
        working-directory: cloudflare/backend-api
        run: node --test test/*.test.mjs

      - name: Validate the production Worker bundle without deploying
        working-directory: cloudflare/backend-api
        run: npx --yes wrangler@4.156.0 deploy --dry-run --config ../../.github/config/wrangler.production.jsonc

  deploy-production-worker:
    needs: validate-production-worker
    if: >-
      github.ref == 'refs/heads/integration/cloudflare-backend-staging-stack-20261031' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.confirm_production_binding == 'yes')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the approved integration revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install isolated Worker dependencies
        working-directory: cloudflare/backend-api
        run: npm install --no-package-lock --ignore-scripts

      - name: Revalidate the exact production bundle
        working-directory: cloudflare/backend-api
        run: npx --yes wrangler@4.156.0 deploy --dry-run --config ../../.github/config/wrangler.production.jsonc

      - name: Verify the existing Production D1 and Worker target (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/verify-cloudflare-production-worker-preflight.mjs

      - name: Deploy only the Production Backend Worker with the Production D1 binding
        working-directory: cloudflare/backend-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.0 deploy --config ../../.github/config/wrangler.production.jsonc

      - name: Verify the deployed Worker has the exact Production D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/verify-cloudflare-production-worker-preflight.mjs --verify-binding

      - name: Smoke-test the production endpoint and fail-closed business routes
        env:
          WORKER_URL: https://smvastroservices.astroservices.workers.dev
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const base = String(process.env.WORKER_URL || '').replace(/\/$/, '');
          async function request(path) {
            const url = base + path;
            const response = await fetch(url, {
              headers: { Accept: 'application/json' },
              signal: AbortSignal.timeout(10000)
            });
            const raw = await response.text();
            let body = {};
            try { body = raw ? JSON.parse(raw) : {}; } catch {}
            return {
              url,
              status: response.status,
              contentType: response.headers.get('content-type') || '',
              body
            };
          }

          let health = null;
          let lastHealth = null;
          let lastError = 'no response';
          for (let attempt = 1; attempt <= 16; attempt += 1) {
            try {
              lastHealth = await request('/healthz');
              if (lastHealth.status === 200 &&
                  lastHealth.body?.ok === true &&
                  lastHealth.body?.runtime === 'cloudflare-workers-express-http-bridge') {
                health = lastHealth;
                break;
              }
              lastError = 'HTTP ' + lastHealth.status + ' body=' + JSON.stringify(lastHealth.body).slice(0, 300);
            } catch (error) {
              lastError = error instanceof Error ? error.message : String(error);
            }
            if (attempt < 16) await new Promise(resolve => setTimeout(resolve, 2000));
          }

          assert.ok(health, 'Production Worker health response did not become valid JSON: ' + lastError);
          assert.equal(health.body.environment, 'production');
          assert.equal(health.body.backendActive, false);
          assert.equal(health.body.walletReadRoutesRegistered, false);
          assert.equal(health.body.walletRechargeRoutesRegistered, false);
          assert.equal(health.body.walletOfferRoutesRegistered, false);
          assert.equal(health.body.liveSessionRoutesRegistered, false);
          assert.equal(health.body.identityProfileBackfillRoutesRegistered, false);
          assert.equal(health.body.identityProfileBackfillToolsEnabled, false);
          assert.equal(health.body.identityProfileD1AuthorizationEnabled, false);
          assert.equal(health.body.productionTrafficEnabled, false);

          const readiness = await request('/api/backend/readiness');
          assert.ok([200, 503].includes(readiness.status),
            'Unexpected readiness HTTP status: ' + readiness.status + ' body=' + JSON.stringify(readiness.body));
          assert.equal(readiness.body.ok, false);
          assert.equal(readiness.body.ready, false);
          assert.equal(readiness.body.checks?.expressRuntime, true);
          assert.equal(readiness.body.checks?.d1Binding, true);
          assert.equal(readiness.body.checks?.walletSchema, false);

          const migration = await request('/api/backend/migration-status');
          assert.equal(migration.status, 200,
            'Migration-status endpoint failed: ' + JSON.stringify(migration.body));
          assert.equal(migration.body.phase, 'cloudflare-runtime-foundation');
          assert.equal(migration.body.legacyServerLoaded, false);
          assert.equal(migration.body.productionTrafficEnabled, false);
          assert.equal(migration.body.walletReadRoutesEnabled, false);
          assert.equal(migration.body.walletRechargeRoutesEnabled, false);
          assert.equal(migration.body.callChatRoutesEnabled, false);

          for (const path of ['/api/auth/session', '/api/auth/authorization']) {
            const result = await request(path);
            assert.equal(result.status, 401,
              path + ' must reject unauthenticated requests; got HTTP ' + result.status);
            assert.equal(result.body.code, 'AUTH_REQUIRED',
              path + ' returned an unexpected body: ' + JSON.stringify(result.body));
          }

          const wallet = await request('/api/wallet/v1/wallet/balance');
          assert.ok([404, 503].includes(wallet.status),
            'Unmigrated Wallet route must fail closed; got HTTP ' + wallet.status);
          assert.equal(wallet.body.code, 'BACKEND_MIGRATION_NOT_CUT_OVER',
            'Unmigrated Wallet route returned an unexpected body: ' + JSON.stringify(wallet.body));

          console.log('PASS: ' + base + ' serves the production Cloudflare Worker runtime.');
          console.log('PASS: Production D1 is bound; readiness correctly reports the legacy Wallet schema is not cut over.');
          console.log('PASS: unauthenticated auth endpoints reject requests with AUTH_REQUIRED.');
          console.log('PASS: Wallet, Razorpay and Live Call/Chat business routes remain disabled.');
          console.log('PASS: frontend traffic, Render and DNS remain unchanged.');
          console.log(JSON.stringify({
            healthStatus: health.status,
            readinessStatus: readiness.status,
            d1BindingReady: readiness.body.checks.d1Binding,
            legacyWalletSchemaReady: readiness.body.checks.walletSchema,
            migrationStatus: migration.status,
            authStatuses: [401, 401],
            walletStatus: wallet.status
          }));
          NODE

      - name: Publish production Worker deployment summary
        if: always()
        run: |
          {
            echo "## SMV ASTRO Production Backend Worker"
            echo ""
            echo "- Endpoint: https://smvastroservices.astroservices.workers.dev"
            echo "- D1 binding: DB → smvastro-wallet-production"
            echo "- Environment: production"
            echo "- Wallet / Razorpay / Live Call-Chat routes: disabled"
            echo "- Frontend API URL / DNS / Render / Firebase data: unchanged"
            echo "- No D1 migrations or data imports were run by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
