name: Cloudflare Production Identity Read-only Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-production-identity-readonly-audit.yml'
      - 'cloudflare/backend-api/scripts/production-identity-readonly-audit.mjs'
      - 'cloudflare/backend-api/test/production-identity-readonly-audit.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-identity-readonly-audit
  cancel-in-progress: false

jobs:
  audit-production-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_PRODUCTION_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_PRODUCTION_SERVICE_ACCOUNT_JSON }}
      FIREBASE_PROJECT_1_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_PROJECT_1_SERVICE_ACCOUNT_JSON }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
      FIREBASE_PRODUCTION_CLIENT_EMAIL: ${{ secrets.FIREBASE_PRODUCTION_CLIENT_EMAIL }}
      FIREBASE_PRODUCTION_PRIVATE_KEY: ${{ secrets.FIREBASE_PRODUCTION_PRIVATE_KEY }}
    steps:
      - name: Checkout audit source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve Cloudflare account from the exact Production D1 ID
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare API token.'; exit 1; }
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            account_id="$(node .github/scripts/resolve-cloudflare-account-from-production-d1.mjs)"
            test -n "$account_id" || { echo 'Unable to resolve the Production D1 account.'; exit 1; }
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          fi

      - name: Read Production Identity/Profile table counts and migration attestations (SELECT only)
        working-directory: cloudflare/backend-api
        shell: bash
        run: |
          set -euo pipefail
          query="$(cat <<'SQL'
          SELECT 'd1:identity_users' AS metric, CAST(COUNT(*) AS TEXT) AS value FROM smv_domain_identity_users WHERE firebase_project_id='smv-astro'
          UNION ALL SELECT 'd1:identity_astrologers', CAST(COUNT(*) AS TEXT) FROM smv_domain_identity_astrologers WHERE firebase_project_id='smv-astro'
          UNION ALL SELECT 'd1:identity_admins', CAST(COUNT(*) AS TEXT) FROM smv_domain_identity_admins WHERE firebase_project_id='smv-astro'
          UNION ALL SELECT 'd1:identity_phones', CAST(COUNT(*) AS TEXT) FROM smv_domain_identity_phones WHERE firebase_project_id='smv-astro'
          UNION ALL SELECT 'd1:identity_public_ids', CAST(COUNT(*) AS TEXT) FROM smv_domain_identity_public_ids WHERE firebase_project_id='smv-astro'
          UNION ALL SELECT 'd1:identity_payout_profiles', CAST(COUNT(*) AS TEXT) FROM smv_domain_identity_payout_profiles WHERE firebase_project_id='smv-astro'
          UNION ALL SELECT 'd1:identity_import_audit', CAST(COUNT(*) AS TEXT) FROM smv_domain_identity_import_audit WHERE source_project_id='smv-astro'
          UNION ALL SELECT 'd1:identity_migration_meta', CAST(COUNT(*) AS TEXT) FROM smv_domain_identity_migration_meta WHERE source_project_id='smv-astro'
          UNION ALL SELECT 'meta:inventory_complete', CAST(COALESCE(MAX(inventory_complete),0) AS TEXT) FROM smv_domain_identity_migration_meta WHERE source_project_id='smv-astro'
          UNION ALL SELECT 'meta:reconciliation_complete', CAST(COALESCE(MAX(reconciliation_complete),0) AS TEXT) FROM smv_domain_identity_migration_meta WHERE source_project_id='smv-astro'
          UNION ALL SELECT 'meta:source_quiesced', CAST(COALESCE(MAX(source_quiesced),0) AS TEXT) FROM smv_domain_identity_migration_meta WHERE source_project_id='smv-astro'
          UNION ALL SELECT 'audit:smv_users:total', CAST(COUNT(*) AS TEXT) FROM smv_domain_identity_import_audit WHERE source_project_id='smv-astro' AND source_collection='smv_users'
          UNION ALL SELECT 'audit:smv_users:warning', CAST(COUNT(*) AS TEXT) FROM smv_domain_identity_import_audit WHERE source_project_id='smv-astro' AND source_collection='smv_users' AND mapping_status='warning'
          UNION ALL SELECT 'audit:smv_astrologers:total', CAST(COUNT(*) AS TEXT) FROM smv_domain_identity_import_audit WHERE source_project_id='smv-astro' AND source_collection='smv_astrologers'
          UNION ALL SELECT 'audit:smv_astrologers:warning', CAST(COUNT(*) AS TEXT) FROM smv_domain_identity_import_audit WHERE source_project_id='smv-astro' AND source_collection='smv_astrologers' AND mapping_status='warning'
          UNION ALL SELECT 'audit:smv_astrologer:total', CAST(COUNT(*) AS TEXT) FROM smv_domain_identity_import_audit WHERE source_project_id='smv-astro' AND source_collection='smv_astrologer'
          UNION ALL SELECT 'audit:smv_astrologer:warning', CAST(COUNT(*) AS TEXT) FROM smv_domain_identity_import_audit WHERE source_project_id='smv-astro' AND source_collection='smv_astrologer' AND mapping_status='warning'
          UNION ALL SELECT 'audit:smv_admins:total', CAST(COUNT(*) AS TEXT) FROM smv_domain_identity_import_audit WHERE source_project_id='smv-astro' AND source_collection='smv_admins'
          UNION ALL SELECT 'audit:smv_admins:warning', CAST(COUNT(*) AS TEXT) FROM smv_domain_identity_import_audit WHERE source_project_id='smv-astro' AND source_collection='smv_admins' AND mapping_status='warning'
          UNION ALL SELECT 'audit:smv_phone_registry:total', CAST(COUNT(*) AS TEXT) FROM smv_domain_identity_import_audit WHERE source_project_id='smv-astro' AND source_collection='smv_phone_registry'
          UNION ALL SELECT 'audit:smv_phone_registry:warning', CAST(COUNT(*) AS TEXT) FROM smv_domain_identity_import_audit WHERE source_project_id='smv-astro' AND source_collection='smv_phone_registry' AND mapping_status='warning'
          UNION ALL SELECT 'audit:smv_public_ids:total', CAST(COUNT(*) AS TEXT) FROM smv_domain_identity_import_audit WHERE source_project_id='smv-astro' AND source_collection='smv_public_ids'
          UNION ALL SELECT 'audit:smv_public_ids:warning', CAST(COUNT(*) AS TEXT) FROM smv_domain_identity_import_audit WHERE source_project_id='smv-astro' AND source_collection='smv_public_ids' AND mapping_status='warning'
          UNION ALL SELECT 'audit:smv_payouts:total', CAST(COUNT(*) AS TEXT) FROM smv_domain_identity_import_audit WHERE source_project_id='smv-astro' AND source_collection='smv_payouts'
          UNION ALL SELECT 'audit:smv_payouts:warning', CAST(COUNT(*) AS TEXT) FROM smv_domain_identity_import_audit WHERE source_project_id='smv-astro' AND source_collection='smv_payouts' AND mapping_status='warning'
          SQL
          )"
          npx --yes wrangler@4.156.0 d1 execute smvastro-wallet-production --remote --config wrangler.production.jsonc --json --command "$query" > /tmp/smv-prod-identity-d1.json
          node --input-type=module -e "import fs from 'node:fs'; const s=fs.readFileSync('/tmp/smv-prod-identity-d1.json','utf8'); const start=Math.min(...[s.indexOf('['),s.indexOf('{')].filter(i=>i>=0)); if(!Number.isFinite(start)) process.exit(1); JSON.parse(s.slice(start)); console.log('PASS: Production D1 Identity/Profile audit SQL executed in read-only SELECT mode.');"

      - name: Count Firebase Project 1 source collections using read-only Firestore aggregation
        shell: bash
        run: |
          set -euo pipefail
          json="${FIREBASE_SERVICE_ACCOUNT_JSON:-${FIREBASE_PRODUCTION_SERVICE_ACCOUNT_JSON:-${FIREBASE_PROJECT_1_SERVICE_ACCOUNT_JSON:-}}}"
          email="${FIREBASE_CLIENT_EMAIL:-${FIREBASE_PRODUCTION_CLIENT_EMAIL:-}}"
          private_key="${FIREBASE_PRIVATE_KEY:-${FIREBASE_PRODUCTION_PRIVATE_KEY:-}}"
          if [ -z "$json" ] && [ -n "$email" ] && [ -n "$private_key" ]; then
            FIREBASE_CREDENTIAL_EMAIL="$email" FIREBASE_CREDENTIAL_PRIVATE_KEY="$private_key" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const email = String(process.env.FIREBASE_CREDENTIAL_EMAIL || '');
          const key = String(process.env.FIREBASE_CREDENTIAL_PRIVATE_KEY || '').replace(/\\n/g, '\n');
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ||
              !/-----BEGIN PRIVATE KEY-----[\s\S]+-----END PRIVATE KEY-----/.test(key)) {
            console.error('Firebase Project 1 service-account email/private-key pair is incomplete.');
            process.exit(1);
          }
          fs.writeFileSync('/tmp/smv-prod-identity-service-account.json',
            JSON.stringify({ project_id: 'smv-astro', client_email: email, private_key: key }));
          NODE
            json="$(cat /tmp/smv-prod-identity-service-account.json)"
          fi
          test -n "$json" || { echo 'Missing Firebase Project 1 service-account secret.'; exit 1; }
          SMV_IDENTITY_AUDIT_SERVICE_ACCOUNT_JSON="$json" node cloudflare/backend-api/scripts/production-identity-readonly-audit.mjs /tmp/smv-prod-identity-d1.json

