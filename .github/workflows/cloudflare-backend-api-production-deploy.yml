name: Cloudflare Production Backend Worker deploy

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/backend-api/**'
      - 'shared/backend-platform/**'
      - '.github/workflows/cloudflare-backend-api-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-backend-api-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare API token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret in GitHub production environment.'; exit 1; }

      - name: Resolve Cloudflare account from the exact Production D1 ID
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            account_id="$(node .github/scripts/resolve-cloudflare-account-from-production-d1.mjs)"
            test -n "$account_id" || { echo 'Unable to resolve the Cloudflare account for Production D1.'; exit 1; }
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
            echo 'Resolved the Cloudflare account containing smvastro-wallet-production.'
          else
            echo 'Using the configured CLOUDFLARE_ACCOUNT_ID secret.'
          fi

      - name: Audit Production Worker secret names (values stay hidden)
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.156.0 secret list --config cloudflare/backend-api/wrangler.production.jsonc --format json > /tmp/smv-production-worker-secrets.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const entries = JSON.parse(fs.readFileSync('/tmp/smv-production-worker-secrets.json','utf8'));
          const names = new Set((Array.isArray(entries) ? entries : []).map(item => String(item?.name || '')));
          console.log('Production Worker secret names:', [...names].filter(Boolean).sort().join(', ') || '(none)');
          const firebaseJson = names.has('FIREBASE_SERVICE_ACCOUNT_JSON');
          const firebaseParts = names.has('FIREBASE_CLIENT_EMAIL') && names.has('FIREBASE_PRIVATE_KEY');
          for (const [label, present] of [
            ['Firebase Project 1 service account', firebaseJson || firebaseParts],
            ['Razorpay Live key ID', names.has('RAZORPAY_KEY_ID')],
            ['Razorpay Live key secret', names.has('RAZORPAY_KEY_SECRET')],
            ['Razorpay webhook secret', names.has('RAZORPAY_WEBHOOK_SECRET')]
          ]) console.log((present ? 'PRESENT: ' : 'MISSING: ') + label);
          NODE

      - name: Install Worker dependencies
        run: npm install --prefix cloudflare/backend-api --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Deploy the configured Production Worker
        run: npx --yes wrangler@4.156.0 deploy --config cloudflare/backend-api/wrangler.production.jsonc

      - name: Verify Production Worker health endpoint
        id: production-health
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://smvastroservices.astroservices.workers.dev'
          status='000'
          for attempt in 1 2 3 4 5 6; do
            status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 --dump-header /tmp/smv-worker-health.headers --output /tmp/smv-worker-health.json --write-out '%{http_code}' "$ROOT/healthz" || true)"
            echo "Production Worker health attempt $attempt returned HTTP $status."
            if [ "$status" = "200" ]; then
              cat /tmp/smv-worker-health.json
              node --input-type=module -e "import fs from 'node:fs'; const d=JSON.parse(fs.readFileSync('/tmp/smv-worker-health.json','utf8')); if(d.environment!=='production'||d.backendActive!==true||d.liveSessionRoutesRegistered!==true) process.exit(1);"
              exit 0
            fi
            sleep 5
          done
          echo 'Production Worker health check did not return the expected active Production runtime.'
          test -f /tmp/smv-worker-health.headers && grep -iE '^(HTTP/|cf-error-type:|cf-error-origin:|cf-ray:)' /tmp/smv-worker-health.headers || true
          test -f /tmp/smv-worker-health.json && cat /tmp/smv-worker-health.json || true
          exit 1

      - name: Capture Production Worker runtime logs after health failure
        if: failure()
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          set +e
          echo 'Starting a short Workers tail capture for the deployed Production Worker.'
          timeout 25s npx --yes wrangler@4.156.0 tail smvastroservices --format json > /tmp/smvastro-production-worker-tail.jsonl 2>&1 &
          tail_pid=$!
          sleep 3
          for attempt in 1 2 3 4; do
            curl --silent --show-error --connect-timeout 10 --max-time 15 --dump-header "/tmp/smv-worker-tail-health-$attempt.headers" --output "/tmp/smv-worker-tail-health-$attempt.json" 'https://smvastroservices.astroservices.workers.dev/healthz' || true
            sleep 2
          done
          wait "$tail_pid"
          tail_status=$?
          echo "wrangler tail exit status: $tail_status"
          test -f /tmp/smvastro-production-worker-tail.jsonl && cat /tmp/smvastro-production-worker-tail.jsonl || true
          for f in /tmp/smv-worker-tail-health-*.headers /tmp/smv-worker-tail-health-*.json; do
            test -f "$f" && { echo "--- $f ---"; cat "$f"; }
          done
          exit 0
