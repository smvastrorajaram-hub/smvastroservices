name: API Security and Request Policy Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'api-security.js'
      - 'test/api-security.test.js'
      - 'server.js'
      - '.github/workflows/api-security-tests.yml'
  push:
    branches: [main]
    paths:
      - 'api-security.js'
      - 'test/api-security.test.js'
      - 'server.js'
      - '.github/workflows/api-security-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-security-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax
        run: |
          node --check api-security.js
          node --check server.js
          node --check test/api-security.test.js
      - name: Verify request-size, CORS and rate-limit policy
        run: node --test test/api-security.test.js
