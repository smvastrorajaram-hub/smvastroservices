name: SMV saved PDF report text audit
on:
  push:
    branches: [main]
    paths:
      - 'smv-output-result/*.pdf'
      - 'public/horoscope/**'
      - 'tests/smv-output-result-pdf-audit.mjs'
      - '.github/workflows/smv-output-pdf-report-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'smv-output-result/*.pdf'
      - 'public/horoscope/**'
      - 'tests/smv-output-result-pdf-audit.mjs'
      - '.github/workflows/smv-output-pdf-report-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract-and-summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF text extraction utility
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Extract searchable text from stored Horoscope and Matching PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smv-output-pdf-audit
          shopt -s nullglob
          pdfs=(smv-output-result/*.pdf)
          if (( ${#pdfs[@]} < 2 )); then
            echo "Expected saved Horoscope/Matching PDFs under smv-output-result/" >&2
            exit 1
          fi
          for pdf in "${pdfs[@]}"; do
            name="$(basename "${pdf%.pdf}")"
            pdftotext -layout "$pdf" "smv-output-pdf-audit/$name.txt"
          done
      - name: Summarize Horoscope, Ayurdaya, Shadbala, and Matching output
        run: node tests/smv-output-result-pdf-audit.mjs smv-output-pdf-audit
      - name: Keep extracted text and audit summary for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMV-OUTPUT-PDF-TEXT-AUDIT
          path: smv-output-pdf-audit/
          if-no-files-found: warn
          retention-days: 7
