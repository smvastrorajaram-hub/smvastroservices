name: SMV Production HTTP Smoke
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/smv-production-http-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-http-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare Pages and custom domain HTTP endpoints
        shell: bash
        run: |
          set -euo pipefail
          check() {
            url="$1"
            body="$(mktemp)"
            code="$(curl --location --retry 2 --connect-timeout 10 --max-time 35 --silent --show-error --output "$body" --write-out '%{http_code}' "$url")"
            echo "$url => HTTP $code ($(wc -c < "$body") bytes)"
            if [ "$code" != "200" ] || ! grep -iq '<html' "$body"; then
              echo "::error::Live HTTP acceptance failed for $url"
              rm -f "$body"
              return 1
            fi
            rm -f "$body"
          }
          check 'https://smvastroservices.pages.dev/'
          check 'https://smvastroservices.pages.dev/horoscope/'
          check 'https://smvastroservices.pages.dev/horoscope/calendar/'
          check 'https://calendar.smvastroservices.in/'
          check 'https://smvastroservices.in/'
          check 'https://smvastroservices.in/horoscope/'

          check_contains() {
            url="$1"
            expected="$2"
            for attempt in $(seq 1 12); do
              body="$(mktemp)"
              code="$(curl --location --retry 1 --connect-timeout 5 --max-time 15 --silent --show-error --output "$body" --write-out '%{http_code}' "$url" || true)"
              if [ "$code" = "200" ] && grep -Fq "$expected" "$body"; then
                echo "$url => HTTP $code (expected AdSense marker verified; attempt $attempt)"
                rm -f "$body"
                return 0
              fi
              echo "$url => HTTP ${code:-000} (AdSense marker not visible yet; attempt $attempt/12)"
              rm -f "$body"
              if [ "$attempt" -lt 12 ]; then sleep 5; fi
            done
            echo "::error::AdSense verification marker missing or unavailable after deployment wait: $url"
            return 1
          }

          check_contains 'https://smvastroservices.in/' 'google-adsense-account" content="ca-pub-8603281557754018"'
          check_contains 'https://smvastroservices.in/astrology-services/' 'adsbygoogle.js?client=ca-pub-8603281557754018'
          check_contains 'https://smvastroservices.in/astrologer-registration/' 'adsbygoogle.js?client=ca-pub-8603281557754018'
          check_contains 'https://smvastroservices.in/customer-registration/' 'adsbygoogle.js?client=ca-pub-8603281557754018'
          check_contains 'https://smvastroservices.in/tamil-horoscope/' 'adsbygoogle.js?client=ca-pub-8603281557754018'
          check_contains 'https://smvastroservices.in/marriage-matching/' 'adsbygoogle.js?client=ca-pub-8603281557754018'
          check_contains 'https://smvastroservices.in/ads.txt' 'google.com, pub-8603281557754018, DIRECT, f08c47fec0942fa0'

          # Verify the actual production-served workbench module, not just its HTML entry page.
          check_contains 'https://smvastroservices.pages.dev/horoscope/prediction-admin-workbench.mjs' 'id="wbPersonalSection" disabled'
          check_contains 'https://smvastroservices.pages.dev/horoscope/prediction-admin-workbench.mjs' 'function updatePersonalControls()'
          check_contains 'https://smvastroservices.pages.dev/horoscope/prediction-admin-workbench.mjs' 'pendingPersonalDraft={text,mode}'
          # Catch a stale independent deployment on the public Calendar hostname.
          check_contains 'https://calendar.smvastroservices.in/' 'smv-calendar-rasi-palan-loader'
          check_any_asset_contains() {
            expected="$1"
            shift
            for url in "$@"; do
              body="$(mktemp)"
              code="$(curl --location --retry 1 --connect-timeout 5 --max-time 15 --silent --show-error --output "$body" --write-out '%{http_code}' "$url" || true)"
              if [ "$code" = "200" ] && grep -Fq "$expected" "$body"; then
                echo "$url => HTTP $code (forecast asset verified)"
                rm -f "$body"
                return 0
              fi
              echo "$url => HTTP ${code:-000} (forecast asset marker missing)"
              rm -f "$body"
            done
            echo "::error::No deployed Calendar asset candidate contained the expected marker: $expected"
            return 1
          }
          # The custom host may expose the shared horoscope assets from its own root
          # or under /horoscope. Verify that at least one complete path really exists.
          check_any_asset_contains 'function renderControls' \
            'https://calendar.smvastroservices.in/calendar-rasi-palan.mjs' \
            'https://calendar.smvastroservices.in/horoscope/calendar-rasi-palan.mjs'
          check_any_asset_contains '#calRasiPalan' \
            'https://calendar.smvastroservices.in/calendar-rasi-palan.css' \
            'https://calendar.smvastroservices.in/horoscope/calendar-rasi-palan.css'
          check_any_asset_contains 'calculateSunMoonSync' \
            'https://calendar.smvastroservices.in/offline/swiss_vedic.browser.mjs' \
            'https://calendar.smvastroservices.in/horoscope/offline/swiss_vedic.browser.mjs'
          check_contains 'https://horoscope.smvastroservices.in/prediction-admin-workbench.mjs' 'id="wbPersonalSection" disabled'
          check_contains 'https://horoscope.smvastroservices.in/prediction-admin-workbench.mjs' 'function updatePersonalControls()'
