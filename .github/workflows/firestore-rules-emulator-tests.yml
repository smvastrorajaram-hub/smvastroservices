name: Firestore Rules emulator tests and Production deploy

on:
  pull_request:
    paths:
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.staging.rules'
      - 'firebase.staging.json'
      - 'server.js'
      - 'test/firestore-rules.test.js'
      - '.github/workflows/firestore-rules-emulator-tests.yml'
  push:
    branches: [main]
    paths:
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.staging.rules'
      - 'firebase.staging.json'
      - 'server.js'
      - 'test/firestore-rules.test.js'
      - '.github/workflows/firestore-rules-emulator-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firestore-rules:
    name: Firestore Rules emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install isolated Rules-test dependencies
        run: npm install --prefix .rules-test --no-save --package-lock=false @firebase/rules-unit-testing@6.0.0 firebase@13.1.0

      - name: Check server syntax
        run: node --check server.js

      - name: Test Security Rules against the local Firestore emulator
        env:
          RULES_TEST_NODE_PATH: ${{ github.workspace }}/.rules-test/node_modules
        run: |
          npx --yes firebase-tools@15.34.1 emulators:exec --only firestore --project demo-smvastro-rules \
            "NODE_PATH=$RULES_TEST_NODE_PATH FIRESTORE_RULES_PATH=firestore.rules node --test test/firestore-rules.test.js && NODE_PATH=$RULES_TEST_NODE_PATH FIRESTORE_RULES_PATH=firestore.staging.rules node --test test/firestore-rules.test.js"

  deploy-production-firestore-rules:
    name: Deploy Production Firestore Rules to Firebase Project 1
    needs: firestore-rules
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare dedicated Firestore Rules deployer credentials
        env:
          FIREBASE_RULES_DEPLOY_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_RULES_DEPLOY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_RULES_DEPLOY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo 'Missing FIREBASE_RULES_DEPLOY_SERVICE_ACCOUNT_JSON in the GitHub production environment.'
            echo 'Create a dedicated Firebase Project 1 Rules deployer service account and add its JSON key as this environment secret.'
            exit 1
          fi
          FIREBASE_CREDENTIAL_CANDIDATE="$FIREBASE_RULES_DEPLOY_SERVICE_ACCOUNT_JSON" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = process.env.FIREBASE_CREDENTIAL_CANDIDATE || '';
          let credentials;
          try { credentials = JSON.parse(raw); }
          catch { console.error('FIREBASE_RULES_DEPLOY_SERVICE_ACCOUNT_JSON is not valid JSON.'); process.exit(1); }
          const email = String(credentials?.client_email || '').trim();
          const privateKey = String(credentials?.private_key || '').replace(/\\n/g, '\n');
          if (credentials?.project_id !== 'smv-astro' ||
              !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ||
              !privateKey.includes('-----BEGIN PRIVATE KEY-----') ||
              !privateKey.includes('-----END PRIVATE KEY-----')) {
            console.error('The dedicated Rules deployer JSON must be complete and belong to Firebase Project 1 (smv-astro).');
            process.exit(1);
          }
          credentials.private_key = privateKey;
          const file = process.env.RUNNER_TEMP + '/firebase-project-1-rules-deployer.json';
          fs.writeFileSync(file, JSON.stringify(credentials), { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, 'GOOGLE_APPLICATION_CREDENTIALS=' + file + '\nGCLOUD_PROJECT=smv-astro\n');
          console.log('Validated dedicated Firebase Rules deployer identity: ' + email);
          NODE

      - name: Deploy only Production Firestore Rules to Project 1
        run: npx --yes firebase-tools@15.34.1 deploy --only firestore:rules --project smv-astro --config firebase.json --non-interactive
