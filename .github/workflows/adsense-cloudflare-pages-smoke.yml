name: AdSense Cloudflare Pages production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/ads.txt"
      - "public/horoscope/ads.txt"
      - "public/horoscope/calendar/ads.txt"
      - "public/horoscope/index.html"
      - "public/horoscope/calendar/index.html"
      - ".github/workflows/adsense-cloudflare-pages-smoke.yml"

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for production deployment and verify AdSense endpoints
        shell: bash
        run: |
          set -euo pipefail

          check_url() {
            local url="$1"
            local expected="$2"
            local body
            body="$(mktemp)"
            local ok=0
            for attempt in $(seq 1 18); do
              if curl --silent --show-error --location --fail --connect-timeout 10 --max-time 30 "$url" -o "$body"; then
                if grep -Fq "$expected" "$body"; then
                  echo "PASS: $url contains expected content"
                  ok=1
                  rm -f "$body"
                  break
                fi
              fi
              echo "Waiting for expected content at $url (attempt $attempt/18)"
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Production check failed for $url; expected: $expected"
              echo "Response preview:"
              head -c 2000 "$body" || true
              rm -f "$body"
              exit 1
            fi
          }

          check_url "https://smvastroservices.in/ads.txt" "google.com, pub-8603281557754018, DIRECT, f08c47fec0942fa0"
          check_url "https://smvastroservices.in/ads.txt" "subdomain=horoscope.smvastroservices.in"
          check_url "https://smvastroservices.in/ads.txt" "subdomain=calendar.smvastroservices.in"
          check_url "https://horoscope.smvastroservices.in/ads.txt" "google.com, pub-8603281557754018, DIRECT, f08c47fec0942fa0"
          check_url "https://calendar.smvastroservices.in/ads.txt" "google.com, pub-8603281557754018, DIRECT, f08c47fec0942fa0"
          check_url "https://horoscope.smvastroservices.in/" "ca-pub-8603281557754018"
          check_url "https://calendar.smvastroservices.in/" "ca-pub-8603281557754018"
