name: AdSense Site Ownership and Pages Production Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "public/ads.txt"
      - "public/index.html"
      - "public/astrology-guides/**"
      - "public/astrology-services/**"
      - "public/tamil-horoscope/**"
      - "public/marriage-matching/**"
      - "public/customer-registration/**"
      - "public/astrologer-registration/**"
      - "public/sitemap.html"
      - "public/sitemap.xml"
      - "test/adsense-site-readiness.test.mjs"
      - "public/smvastro.css"
      - "mobile/**"
      - "scripts/optimize_mobile_folder_assets.py"
      - "public/horoscope/index.html"
      - "public/horoscope/calendar/index.html"
      - ".github/workflows/adsense-cloudflare-pages-smoke.yml"
  push:
    branches: [main]
    paths:
      - "public/ads.txt"
      - "public/index.html"
      - "public/astrology-guides/**"
      - "public/astrology-services/**"
      - "public/tamil-horoscope/**"
      - "public/marriage-matching/**"
      - "public/customer-registration/**"
      - "public/astrologer-registration/**"
      - "public/sitemap.html"
      - "public/sitemap.xml"
      - "test/adsense-site-readiness.test.mjs"
      - "public/horoscope/ads.txt"
      - "public/horoscope/calendar/ads.txt"
      - "public/horoscope/index.html"
      - "public/horoscope/calendar/index.html"
      - ".github/workflows/adsense-cloudflare-pages-smoke.yml"

permissions:
  contents: read

jobs:
  source-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify registered .in AdSense configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<meta name="google-adsense-account" content="ca-pub-8603281557754018">' public/index.html
          grep -Fq 'smv-adsense-site-loader' public/index.html
          grep -Fq "host==='smvastroservices.in'||host==='www.smvastroservices.in'" public/index.html
          grep -Fq 'if(!isPrimarySite)return;' public/index.html
          grep -Fq 'id="smv-adsense-domain-loader"' public/astrology-services/index.html
          grep -Fq "host!=='smvastroservices.in'&&host!=='www.smvastroservices.in'" public/astrology-services/index.html
          grep -Fq 'id="smv-adsense-domain-loader"' public/tamil-horoscope/index.html
          grep -Fq "host!=='smvastroservices.in'&&host!=='www.smvastroservices.in'" public/tamil-horoscope/index.html
          grep -Fq 'id="smv-adsense-domain-loader"' public/marriage-matching/index.html
          grep -Fq "host!=='smvastroservices.in'&&host!=='www.smvastroservices.in'" public/marriage-matching/index.html
          grep -Fq 'id="smv-adsense-domain-loader"' public/customer-registration/index.html
          grep -Fq "host!=='smvastroservices.in'&&host!=='www.smvastroservices.in'" public/customer-registration/index.html
          grep -Fq 'id="smv-adsense-domain-loader"' public/astrologer-registration/index.html
          grep -Fq "host!=='smvastroservices.in'&&host!=='www.smvastroservices.in'" public/astrologer-registration/index.html
          grep -Fq 'id="smv-adsense-domain-loader"' public/astrology-guides/index.html
          grep -Fq "host!=='smvastroservices.in'&&host!=='www.smvastroservices.in'" public/astrology-guides/index.html
          grep -Fq 'id="smv-adsense-domain-loader"' public/astrology-guides/birth-chart-basics/index.html
          grep -Fq "host!=='smvastroservices.in'&&host!=='www.smvastroservices.in'" public/astrology-guides/birth-chart-basics/index.html
          grep -Fq 'id="smv-adsense-domain-loader"' public/astrology-guides/twelve-houses/index.html
          grep -Fq "host!=='smvastroservices.in'&&host!=='www.smvastroservices.in'" public/astrology-guides/twelve-houses/index.html
          grep -Fq 'id="smv-adsense-domain-loader"' public/astrology-guides/27-nakshatras/index.html
          grep -Fq "host!=='smvastroservices.in'&&host!=='www.smvastroservices.in'" public/astrology-guides/27-nakshatras/index.html
          grep -Fq 'id="smv-adsense-domain-loader"' public/astrology-guides/panchangam/index.html
          grep -Fq "host!=='smvastroservices.in'&&host!=='www.smvastroservices.in'" public/astrology-guides/panchangam/index.html
          grep -Fq 'id="smv-adsense-domain-loader"' public/astrology-guides/lahiri-thirukanitham/index.html
          grep -Fq "host!=='smvastroservices.in'&&host!=='www.smvastroservices.in'" public/astrology-guides/lahiri-thirukanitham/index.html
          grep -Fq 'id="smv-adsense-domain-loader"' public/astrology-guides/marriage-porutham/index.html
          grep -Fq "host!=='smvastroservices.in'&&host!=='www.smvastroservices.in'" public/astrology-guides/marriage-porutham/index.html
          grep -Fq 'id="smv-adsense-domain-loader"' public/astrology-guides/dasha-bhukti/index.html
          grep -Fq "host!=='smvastroservices.in'&&host!=='www.smvastroservices.in'" public/astrology-guides/dasha-bhukti/index.html
          grep -Fq 'id="smv-adsense-domain-loader"' public/astrology-guides/graha-drishti/index.html
          grep -Fq "host!=='smvastroservices.in'&&host!=='www.smvastroservices.in'" public/astrology-guides/graha-drishti/index.html
          grep -Fq "host!=='horoscope.smvastroservices.in'" public/horoscope/index.html
          grep -Fq "host!=='calendar.smvastroservices.in'" public/horoscope/calendar/index.html
          ! grep -R -E '<script[^>]+src="https://pagead2\.googlesyndication\.com/pagead/js/adsbygoogle\.js' public --include='*.html'
          grep -Fq 'google.com, pub-8603281557754018, DIRECT, f08c47fec0942fa0' public/ads.txt
          echo "PASS: AdSense requests are host-gated to the registered .in sites; no preview-host direct script tags remain"

  production-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for production deployment and verify AdSense endpoints
        shell: bash
        run: |
          set -euo pipefail

          check_url() {
            local url="$1"
            local expected="$2"
            local body
            body="$(mktemp)"
            local ok=0
            for attempt in $(seq 1 18); do
              if curl --silent --show-error --location --fail --connect-timeout 10 --max-time 30 "$url" -o "$body"; then
                if grep -Fq "$expected" "$body"; then
                  echo "PASS: $url contains expected content"
                  ok=1
                  rm -f "$body"
                  break
                fi
              fi
              echo "Waiting for expected content at $url (attempt $attempt/18)"
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Production check failed for $url; expected: $expected"
              echo "Response preview:"
              head -c 2000 "$body" || true
              rm -f "$body"
              exit 1
            fi
          }

          check_url "https://smvastroservices.pages.dev/ads.txt" "google.com, pub-8603281557754018, DIRECT, f08c47fec0942fa0"
          check_url "https://smvastroservices.pages.dev/" "google-adsense-account\" content=\"ca-pub-8603281557754018"
          check_url "https://smvastroservices.pages.dev/" "smv-adsense-site-loader"
          check_url "https://smvastroservices.in/" "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8603281557754018"
          check_url "https://smvastroservices.in/sitemap.xml" "astrology-guides/birth-chart-basics/"
          check_url "https://smvastroservices.in/ads.txt" "google.com, pub-8603281557754018, DIRECT, f08c47fec0942fa0"
          check_url "https://smvastroservices.in/ads.txt" "subdomain=horoscope.smvastroservices.in"
          check_url "https://smvastroservices.in/ads.txt" "subdomain=calendar.smvastroservices.in"
          check_url "https://horoscope.smvastroservices.in/ads.txt" "google.com, pub-8603281557754018, DIRECT, f08c47fec0942fa0"
          check_url "https://calendar.smvastroservices.in/ads.txt" "google.com, pub-8603281557754018, DIRECT, f08c47fec0942fa0"
          check_url "https://horoscope.smvastroservices.in/" "ca-pub-8603281557754018"
          check_url "https://calendar.smvastroservices.in/" "ca-pub-8603281557754018"

  optimize-user-mobile-assets:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'smv-home-visual-assets-') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check pillow
      - name: Optimize supplied images below 500 KB
        run: python scripts/optimize_mobile_folder_assets.py
      - name: Commit generated brand-logo asset to this PR branch
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/smv-home-logo.webp
          if git diff --cached --quiet; then
            echo "Optimized assets are already current."
            exit 0
          fi
          git commit -m "Optimize supplied mobile folder assets below 500 KB"
          git push origin "HEAD:${BRANCH_NAME}"
