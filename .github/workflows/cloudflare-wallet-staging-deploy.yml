name: Cloudflare Wallet API staging deployment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'cloudflare/wallet-api/**'
      - '.github/workflows/cloudflare-wallet-staging-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-wallet-staging:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/feature/cloudflare-wallet-d1-api-scaffold-20261031') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.number == 253 &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'feature/cloudflare-wallet-d1-api-scaffold-20261031')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify required secrets without displaying their values
        id: preflight
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          missing=()
          for name in CF_API_TOKEN CF_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging deployment skipped because required GitHub Actions secrets are missing."
            printf 'Missing secret name(s): %s\n' "${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Required deployment secrets are present."
          fi

      - name: Apply schema migration to the named staging D1 database
        if: steps.preflight.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          workingDirectory: cloudflare/wallet-api
          command: d1 migrations apply smvastro-wallet-staging --remote --config wrangler.jsonc

      - name: Deploy staging Worker
        if: steps.preflight.outputs.ready == 'true'
        id: deploy-worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          workingDirectory: cloudflare/wallet-api
          command: deploy --config wrangler.jsonc

      - name: Verify staging Worker and D1 schema
        if: steps.preflight.outputs.ready == 'true'
        env:
          WORKER_URL: ${{ steps.deploy-worker.outputs.deployment-url }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = String(process.env.WORKER_URL || '').replace(/\/$/, '');
          if (!base) throw new Error('Cloudflare did not return a staging deployment URL.');

          async function get(path) {
            let lastFailure = 'no response';
            // A newly deployed workers.dev hostname can take a short time to become
            // reachable on every edge. Poll instead of failing on the first 404.
            for (let attempt = 1; attempt <= 16; attempt += 1) {
              try {
                const response = await fetch(base + path, {
                  headers: { Accept: 'application/json' },
                  signal: AbortSignal.timeout(8000)
                });
                const raw = await response.text();
                let body = {};
                try { body = raw ? JSON.parse(raw) : {}; } catch { body = {}; }
                if (response.ok) return body;
                lastFailure = 'HTTP ' + response.status + (raw ? ': ' + raw.slice(0, 240) : '');
              } catch (error) {
                lastFailure = error instanceof Error ? error.message : String(error);
              }
              if (attempt < 16) await new Promise(resolve => setTimeout(resolve, 2000));
            }
            throw new Error(path + ' did not become healthy after 16 attempts: ' + lastFailure);
          }

          const health = await get('/healthz');
          if (health.ok !== true || health.walletDomainActive !== false || health.businessRoutesEnabled !== false) {
            throw new Error('Wallet Worker health response does not match the safe staging state.');
          }

          const readiness = await get('/api/wallet/v1/readiness');
          if (readiness.ready !== true || readiness.schemaVersion !== '0001_wallet_live_domain') {
            throw new Error('D1 schema readiness check did not pass.');
          }

          const disabled = await fetch(base + '/api/wallet/v1/wallet/balance');
          const disabledBody = await disabled.json().catch(() => ({}));
          if (disabled.status !== 503 || disabledBody.code !== 'WALLET_DOMAIN_NOT_CUT_OVER') {
            throw new Error('Wallet business endpoint is not safely disabled.');
          }

          console.log('PASS /healthz');
          console.log('PASS /api/wallet/v1/readiness (D1 schema)');
          console.log('PASS wallet business route fail-closed guard');
          console.log('Staging Worker URL: ' + base);
          NODE
