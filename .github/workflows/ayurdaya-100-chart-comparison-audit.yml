name: 100-chart Ayurdaya and Sodhya Pinda Source Audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/horoscope/offline/offline-engine.mjs'
      - 'public/horoscope/offline/astro_advanced.browser.mjs'
      - 'public/horoscope/offline/cg-rajan-ayurdaya-pinda.browser.mjs'
      - 'public/horoscope/offline/bv-raman-ashtakavarga-ayurdaya.browser.mjs'
      - 'public/horoscope/offline/bv-raman-hpa-ayurdaya-combined.browser.mjs'
      - 'public/horoscope/offline/bv-raman-ayurdaya-report.browser.mjs'
      - 'public/horoscope/marriage-basic-report.mjs'
      - 'tests/ayurdaya-100-chart-comparison-audit.mjs'
      - '.github/workflows/ayurdaya-100-chart-comparison-audit.yml'
  push:
    branches: [main]
    paths:
      - 'public/horoscope/offline/offline-engine.mjs'
      - 'public/horoscope/offline/astro_advanced.browser.mjs'
      - 'public/horoscope/offline/cg-rajan-ayurdaya-pinda.browser.mjs'
      - 'public/horoscope/offline/bv-raman-ashtakavarga-ayurdaya.browser.mjs'
      - 'public/horoscope/offline/bv-raman-hpa-ayurdaya-combined.browser.mjs'
      - 'public/horoscope/offline/bv-raman-ayurdaya-report.browser.mjs'
      - 'public/horoscope/marriage-basic-report.mjs'
      - 'tests/ayurdaya-100-chart-comparison-audit.mjs'
      - '.github/workflows/ayurdaya-100-chart-comparison-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ayurdaya-100-chart-comparison-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compare-100-charts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check audit and calculation modules
        run: |
          node --check tests/ayurdaya-100-chart-comparison-audit.mjs
          node --check public/horoscope/offline/offline-engine.mjs
          node --check public/horoscope/offline/astro_advanced.browser.mjs
      - name: Calculate 100 actual natal charts, compare seven-graha Pinda rows, and render 50 pair reports
        run: node tests/ayurdaya-100-chart-comparison-audit.mjs
      - name: Preserve per-chart / per-pair audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ayurdaya-100-chart-comparison-audit
          path: artifacts/ayurdaya-100-chart-comparison-audit.json
          if-no-files-found: warn
          retention-days: 14
