name: Classical Cheshta Reference-Frame Research and Production Guard
on:
  push:
    branches: [main]
    paths:
      - 'bv-raman-shadbala.cjs'
      - 'public/horoscope/offline/bv-raman-shadbala.browser.mjs'
      - 'public/horoscope/offline/saura-classical-mean-motion.browser.mjs'
      - 'public/horoscope/offline/saura-classical-true-longitude.browser.mjs'
      - 'public/horoscope/offline/saura-classical-tabular-jya.browser.mjs'
      - 'public/horoscope/offline/saura-natal-five-cheshta.browser.mjs'
      - 'tests/cheshta-reference-frame-production-guard.mjs'
      - 'tests/historical-saura-true-longitude-frame-research.mjs'
      - '.github/workflows/classical-cheshta-reference-frame-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bv-raman-shadbala.cjs'
      - 'public/horoscope/offline/bv-raman-shadbala.browser.mjs'
      - 'public/horoscope/offline/saura-classical-mean-motion.browser.mjs'
      - 'public/horoscope/offline/saura-classical-true-longitude.browser.mjs'
      - 'public/horoscope/offline/saura-classical-tabular-jya.browser.mjs'
      - 'public/horoscope/offline/saura-natal-five-cheshta.browser.mjs'
      - 'tests/cheshta-reference-frame-production-guard.mjs'
      - 'tests/historical-saura-true-longitude-frame-research.mjs'
      - '.github/workflows/classical-cheshta-reference-frame-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: classical-cheshta-frame-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  reference-frame-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check affected engines and tests
        run: |
          node --check bv-raman-shadbala.cjs
          node --check public/horoscope/offline/bv-raman-shadbala.browser.mjs
          node --check public/horoscope/offline/saura-classical-mean-motion.browser.mjs
          node --check public/horoscope/offline/saura-classical-true-longitude.browser.mjs
          node --check public/horoscope/offline/saura-classical-tabular-jya.browser.mjs
          node --check public/horoscope/offline/saura-natal-five-cheshta.browser.mjs
          node --check tests/cheshta-reference-frame-production-guard.mjs
          node --check tests/historical-saura-true-longitude-frame-research.mjs
      - name: Audit historical Saura True Longitude in one reference frame
        run: node tests/historical-saura-true-longitude-frame-research.mjs
      - name: Reject mixed-frame production Cheshta and dependent totals
        run: node tests/cheshta-reference-frame-production-guard.mjs
      - name: Preserve B.V. Raman printed standard horoscope oracle and Node/Browser parity
        run: node tests/bv-raman-strength6-regression.mjs
      - name: Run consolidated classical Cheshta and Uttara Kalamrita source oracles
        run: node tests/uttara-kalamrita-cheshta-ayurdaya-combined-regression.mjs
