name: Build SMV ASTRO Production Android APK

on:
  workflow_dispatch:
    inputs:
      generate_release_keystore:
        description: "Generate the one-time password-protected Release keystore artifact only; do not build an APK"
        required: true
        type: boolean
        default: false
      version_name:
        description: "App version in order: v1.0, v1.1, v1.2, ... v2.0"
        required: true
        type: string
        default: "v1.2"
      build_signed_release:
        description: "Build the permanent signed Release APK (requires all four repository Actions secrets)"
        required: true
        type: boolean
        default: true
  pull_request:
    paths:
      - "smvastroproduction/**"
      - "settings.gradle"
      - "prepare-smv-astro-production-icon.sh"
      - ".github/workflows/build-smv-astro-production-apk.yml"
      - "test/android-permanent-release.test.mjs"
      - "test/android-google-native-signin.test.mjs"
      - "public/smvastro.mjs"
      - "docs/android-native-call-ringtone.md"
  push:
    paths:
      - "smvastroproduction/**"
      - "settings.gradle"
      - "prepare-smv-astro-production-icon.sh"
      - ".github/workflows/build-smv-astro-production-apk.yml"
      - "test/android-permanent-release.test.mjs"
      - "public/smvastro.mjs"
      - "test/android-google-native-signin.test.mjs"
      - "docs/android-native-call-ringtone.md"

permissions:
  contents: read

jobs:
  generate_release_keystore:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_release_keystore }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: smv-astro-release-keystore-bootstrap
      cancel-in-progress: false
    steps:
      - name: Java 17 keytool
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate initial secrets and prevent accidental key rotation
        shell: bash
        env:
          SMV_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SMV_ANDROID_KEYSTORE_PASSWORD }}
          SMV_ANDROID_KEY_PASSWORD: ${{ secrets.SMV_ANDROID_KEY_PASSWORD }}
          SMV_ANDROID_KEY_ALIAS: ${{ secrets.SMV_ANDROID_KEY_ALIAS }}
          SMV_ANDROID_KEYSTORE_BASE64: ${{ secrets.SMV_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          set +x
          missing=""
          for secret_name in \
            SMV_ANDROID_KEYSTORE_PASSWORD \
            SMV_ANDROID_KEY_PASSWORD \
            SMV_ANDROID_KEY_ALIAS; do
            if [[ -z "$(printenv "$secret_name" || true)" ]]; then
              missing="$missing $secret_name"
            fi
          done
          if [[ -n "$missing" ]]; then
            echo "::error::Create these repository Actions secrets before generating the key:$missing"
            exit 1
          fi
          if [[ "$SMV_ANDROID_KEY_ALIAS" != "smvastro-release" ]]; then
            echo "::error::SMV_ANDROID_KEY_ALIAS must be exactly smvastro-release."
            exit 1
          fi
          if [[ -n "$SMV_ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::A keystore Base64 secret already exists. Refusing to generate or rotate the permanent key."
            exit 1
          fi
          if (( ${#SMV_ANDROID_KEYSTORE_PASSWORD} < 32 )); then
            echo "::error::Use a randomly generated password of at least 32 characters."
            exit 1
          fi
          if [[ "$SMV_ANDROID_KEYSTORE_PASSWORD" != "$SMV_ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::PKCS12 requires the same password for the keystore and private key. Set both GitHub secrets to the same strong random value."
            exit 1
          fi

      - name: Generate password-protected PKCS12 keystore and Base64 copy
        shell: bash
        env:
          SMV_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SMV_ANDROID_KEYSTORE_PASSWORD }}
          SMV_ANDROID_KEY_ALIAS: ${{ secrets.SMV_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          output_dir="$RUNNER_TEMP/smv-astro-release-keystore"
          mkdir -p "$output_dir"
          keystore_path="$output_dir/smv-astro-release.p12"
          keytool -genkeypair -noprompt -v \
            -keystore "$keystore_path" \
            -storetype PKCS12 \
            -storepass "$SMV_ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$SMV_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$SMV_ANDROID_KEY_ALIAS" \
            -keyalg RSA -keysize 4096 -sigalg SHA256withRSA \
            -validity 10000 \
            -dname "CN=SMV ASTRO Release, OU=Android, O=SMV ASTRO SERVICES, C=IN"
          keytool -list -keystore "$keystore_path" -storetype PKCS12 \
            -storepass "$SMV_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$SMV_ANDROID_KEY_ALIAS" >/dev/null
          base64 -w 0 "$keystore_path" > "$output_dir/SMV_ANDROID_KEYSTORE_BASE64.txt"
          printf '\n' >> "$output_dir/SMV_ANDROID_KEYSTORE_BASE64.txt"
          keytool -exportcert -rfc -keystore "$keystore_path" -storetype PKCS12 \
            -storepass "$SMV_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$SMV_ANDROID_KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 > "$output_dir/certificate-sha256-fingerprint.txt"

      - name: Upload one-time encrypted keystore package
        uses: actions/upload-artifact@v4
        with:
          name: SMV-ASTRO-RELEASE-KEYSTORE-ONE-TIME
          path: |
            ${{ runner.temp }}/smv-astro-release-keystore/smv-astro-release.p12
            ${{ runner.temp }}/smv-astro-release-keystore/SMV_ANDROID_KEYSTORE_BASE64.txt
            ${{ runner.temp }}/smv-astro-release-keystore/certificate-sha256-fingerprint.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove temporary runner copy
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/smv-astro-release-keystore"

  build:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.generate_release_keystore }}
    runs-on: ubuntu-latest
    env:
      SMV_FIREBASE_ANDROID_APP_ID: ${{ vars.SMV_FIREBASE_ANDROID_APP_ID || '1:299081899217:android:09e43164cfdd015ba539f0' }}
      SMV_ANDROID_VERSION_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.version_name || vars.SMV_ANDROID_VERSION_NAME || 'v1.2' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22 source regression tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify permanent Release and native Google sign-in configuration
        run: node --test test/android-permanent-release.test.mjs test/android-google-native-signin.test.mjs

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare official SMV ASTRO app icon
        run: bash prepare-smv-astro-production-icon.sh

      - name: Validate Firebase Android App ID and ordered version
        shell: bash
        run: |
          set -euo pipefail
          case "$SMV_FIREBASE_ANDROID_APP_ID" in
            "")
              echo "::warning::SMV_FIREBASE_ANDROID_APP_ID is not set. This APK will not register native FCM or ring for incoming requests."
              ;;
            1:299081899217:android:*)
              echo "Firebase Android App ID has the expected project/sender prefix."
              ;;
            *)
              echo "::error::SMV_FIREBASE_ANDROID_APP_ID must be the Android App ID registered in the existing smv-astro Firebase project (prefix 1:299081899217:android:)."
              exit 1
              ;;
          esac
          if [[ ! "$SMV_ANDROID_VERSION_NAME" =~ ^v([1-9][0-9]*)\.([0-9]{1,3})$ ]]; then
            echo "::error::SMV_ANDROID_VERSION_NAME must use vMAJOR.MINOR format, e.g. v1.0 or v1.1. Minor must be 0-999."
            exit 1
          fi
          major=$(printf '%s' "$SMV_ANDROID_VERSION_NAME" | cut -d. -f1 | cut -c2-)
          minor=$(printf '%s' "$SMV_ANDROID_VERSION_NAME" | cut -d. -f2)
          version_code=$((10#$major * 1000 + 10#$minor))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "::error::Calculated Android versionCode is outside the supported range."
            exit 1
          fi
          echo "SMV ASTRO app version: $SMV_ANDROID_VERSION_NAME; Android versionCode: $version_code"

      - name: Build SMV ASTRO Production Debug APK (test build only)
        run: gradle --no-daemon :smvastroproduction:assembleDebug

      - name: Upload test-only Debug APK
        if: ${{ env.SMV_FIREBASE_ANDROID_APP_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SMV-ASTRO-PRODUCTION-DEBUG-TEST-APK
          path: smvastroproduction/build/outputs/apk/debug/smvastroproduction-debug.apk
          retention-days: 7

      - name: Upload unconfigured Debug APK (FCM not configured)
        if: ${{ env.SMV_FIREBASE_ANDROID_APP_ID == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SMV-ASTRO-PRODUCTION-UNCONFIGURED-DEBUG-TEST-APK
          path: smvastroproduction/build/outputs/apk/debug/smvastroproduction-debug.apk
          retention-days: 7

      - name: Compile Release variant without signing (PR/push validation only)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          gradle --no-daemon \
            -PsmvVersionName="$SMV_ANDROID_VERSION_NAME" \
            :smvastroproduction:assembleRelease

      - name: Validate permanent Release signing secrets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        shell: bash
        env:
          SMV_ANDROID_KEYSTORE_BASE64: ${{ secrets.SMV_ANDROID_KEYSTORE_BASE64 }}
          SMV_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SMV_ANDROID_KEYSTORE_PASSWORD }}
          SMV_ANDROID_KEY_ALIAS: ${{ secrets.SMV_ANDROID_KEY_ALIAS }}
          SMV_ANDROID_KEY_PASSWORD: ${{ secrets.SMV_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for secret_name in \
            SMV_ANDROID_KEYSTORE_BASE64 \
            SMV_ANDROID_KEYSTORE_PASSWORD \
            SMV_ANDROID_KEY_ALIAS \
            SMV_ANDROID_KEY_PASSWORD; do
            if [[ -z "$(printenv "$secret_name" || true)" ]]; then
              missing="$missing $secret_name"
            fi
          done
          if [[ -n "$missing" ]]; then
            echo "::error::Add these repository Actions secrets before requesting a signed Release APK:$missing"
            exit 1
          fi

      - name: Restore permanent signing keystore securely
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        shell: bash
        env:
          SMV_ANDROID_KEYSTORE_BASE64: ${{ secrets.SMV_ANDROID_KEYSTORE_BASE64 }}
          SMV_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SMV_ANDROID_KEYSTORE_PASSWORD }}
          SMV_ANDROID_KEY_ALIAS: ${{ secrets.SMV_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          keystore_path="$RUNNER_TEMP/smv-astro-release.p12"
          printf '%s' "$SMV_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          keytool -list -keystore "$keystore_path" -storetype PKCS12 \
            -storepass "$SMV_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$SMV_ANDROID_KEY_ALIAS" >/dev/null
          echo "SMV_ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed SMV ASTRO Permanent Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        env:
          SMV_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/smv-astro-release.p12
          SMV_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SMV_ANDROID_KEYSTORE_PASSWORD }}
          SMV_ANDROID_KEY_ALIAS: ${{ secrets.SMV_ANDROID_KEY_ALIAS }}
          SMV_ANDROID_KEY_PASSWORD: ${{ secrets.SMV_ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon \
            -PsmvVersionName="$SMV_ANDROID_VERSION_NAME" \
            :smvastroproduction:assembleRelease

      - name: Verify signed Release APK certificate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        run: |
          apk="smvastroproduction/build/outputs/apk/release/smvastroproduction-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"

      - name: Upload permanent signed Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        uses: actions/upload-artifact@v4
        with:
          name: SMV-ASTRO-PERMANENT-RELEASE-APK
          path: smvastroproduction/build/outputs/apk/release/smvastroproduction-release.apk
          retention-days: 30

      - name: Remove signing keystore from the runner
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.build_signed_release }}
        run: rm -f "$RUNNER_TEMP/smv-astro-release.p12"
