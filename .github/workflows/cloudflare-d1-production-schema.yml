name: Provision Cloudflare Production D1 schema only

on:
  pull_request:
    branches:
      - integration/cloudflare-backend-staging-stack-20261031
    paths:
      - ".github/workflows/cloudflare-d1-production-schema.yml"
      - ".github/scripts/provision-cloudflare-production-d1-schema.mjs"
  push:
    branches:
      - integration/cloudflare-backend-staging-stack-20261031
    paths:
      - ".github/workflows/cloudflare-d1-production-schema.yml"
      - ".github/scripts/provision-cloudflare-production-d1-schema.mjs"

permissions:
  contents: read

jobs:
  validate-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the proposed integration changes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check provisioning script syntax
        run: node --check .github/scripts/provision-cloudflare-production-d1-schema.mjs

      - name: Validate migrations on a fresh local D1
        run: node .github/scripts/provision-cloudflare-production-d1-schema.mjs --local-check

  provision-schema-only:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout the integration branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Recheck provisioning script syntax
        run: node --check .github/scripts/provision-cloudflare-production-d1-schema.mjs

      - name: Validate production schema migrations on a fresh local D1
        run: node .github/scripts/provision-cloudflare-production-d1-schema.mjs --local-check

      - name: Create APAC-hinted Production D1 and apply schema-only migrations
        id: provision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/provision-cloudflare-production-d1-schema.mjs --provision-remote
