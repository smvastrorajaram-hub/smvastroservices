name: UK Section III Ayurdaya Research Arithmetic QA
on:
  push:
    branches: [main, audit/v365-saura-mean-motion-panchang-oracle]
    paths:
      - 'public/horoscope/offline/uttara-kalamrita-ayurdaya.browser.mjs'
      - 'tests/uttara-kalamrita-ayurdaya-source-only-numeric-oracle.mjs'
      - '.github/workflows/uttara-kalamrita-ayurdaya-research-qa.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-book-arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no syntax errors in standalone UK III research
        run: |
          node --check public/horoscope/offline/uttara-kalamrita-ayurdaya.browser.mjs
          node --check tests/uttara-kalamrita-ayurdaya-source-only-numeric-oracle.mjs
      - name: Source-only UK Ayurdaya III.1-5 published worked example and 35 natal research inputs
        run: node tests/uttara-kalamrita-ayurdaya-source-only-numeric-oracle.mjs
      - name: Enforce no customer lifespan report and no fake certificate
        run: |
          echo 'Section III UK research arithmetic ONLY.'
          echo 'DO NOT DISPLAY lifespan or death timing to customers.'
          echo 'Complete UK Shadbala prerequisite is NOT independently certified.'
          echo 'Ayurdaya NOT yet an independently calibrated final prediction.'
