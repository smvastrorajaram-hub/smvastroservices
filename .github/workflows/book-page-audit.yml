name: Book page source audit

on:
  push:
    branches:
      - codex/book-page-source-audit
    paths:
      - 'scripts/book-audit/**'
      - '.github/workflows/book-page-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    name: Pages - ${{ matrix.book.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        book:
          - id: bphs-1-santhanam
            path: books/BPHS - 1 RSanthanam.pdf
          - id: bphs-2-santhanam
            path: books/BPHS - 2 RSanthanam.pdf
          - id: bvr-judge-1
            path: books/BVR how-to-judge-horoscope-1.pdf
          - id: bvr-judge-2
            path: books/BVR how-to-judge-horoscope-2.pdf
          - id: remedies-2020
            path: books/Encyclopedia-of-Astrological-Remedies-2020.pdf
          - id: kudumpa-jothidam
            path: books/Kudumpa Jothidam.pdf
          - id: vedic-book-2
            path: books/The Vedic Book 2.pdf
          - id: vedic-book-1
            path: books/The Vedic Book.pdf
          - id: vedic-astro-textbook
            path: books/vedic_astro_textbook.pdf
          - id: jothida-lakshmi
            path: books/ஜோதிட லெக்ஷ்மி.pdf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF and Tamil / English OCR tools
        run: |
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.24.14'
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-tam
      - name: Extract every source page
        env:
          BOOK_PATH: ${{ matrix.book.path }}
          BOOK_ID: ${{ matrix.book.id }}
        run: python scripts/book-audit/extract_pages.py --book "$BOOK_PATH" --book-id "$BOOK_ID" --output "book-audit-output/$BOOK_ID.jsonl"
      - name: Retain page audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-${{ matrix.book.id }}
          path: book-audit-output/
          retention-days: 7
