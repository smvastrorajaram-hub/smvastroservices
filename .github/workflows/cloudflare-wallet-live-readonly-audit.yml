name: Cloudflare Wallet + Live staging Firestore read-only audit

on:
  push:
    branches:
      - feat/wallet-live-readonly-audit-20261101
    paths:
      - 'shared/backend-platform/wallet-domain-backfill.mjs'
      - 'shared/backend-platform/d1-wallet-domain-backfill.mjs'
      - 'shared/backend-platform/wallet-live-readonly-audit.mjs'
      - 'shared/backend-platform/firestore-admin-rest.mjs'
      - 'shared/backend-platform/google-service-account-token.mjs'
      - 'cloudflare/backend-api/scripts/wallet-live-readonly-preview.mjs'
      - 'cloudflare/backend-api/test/wallet-live-readonly-audit.test.mjs'
      - '.github/workflows/cloudflare-wallet-live-readonly-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smv-astro-wallet-live-staging-readonly-audit
  cancel-in-progress: false

jobs:
  staging-readonly-audit:
    if: github.ref == 'refs/heads/feat/wallet-live-readonly-audit-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: \${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install audit runtime dependencies
        working-directory: cloudflare/backend-api
        run: npm install --no-package-lock --ignore-scripts

      - name: Verify read-only audit source syntax
        run: |
          node --check shared/backend-platform/wallet-domain-backfill.mjs
          node --check shared/backend-platform/d1-wallet-domain-backfill.mjs
          node --check shared/backend-platform/wallet-live-readonly-audit.mjs
          node --check cloudflare/backend-api/scripts/wallet-live-readonly-preview.mjs

      - name: Re-run Wallet + Live read-only audit unit tests
        working-directory: cloudflare/backend-api
        run: npm run test:wallet-live-audit

      - name: Run full-paginated Firebase staging audit (read-only; no D1 binding)
        working-directory: cloudflare/backend-api
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: \${{ secrets.FIREBASE_STAGING_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: node scripts/wallet-live-readonly-preview.mjs
