name: Cloudflare backend API contract tests

on:
  pull_request:
    branches: [main]
    paths:
      - "cloudflare/backend-api/**"
      - "shared/backend-platform/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "scripts/fix-cloudflare-iconv-lite.mjs"
      - ".github/workflows/cloudflare-backend-api-contract-tests.yml"
      - ".github/scripts/resolve-cloudflare-account-from-production-d1.*"
  push:
    branches: [main]
    paths:
      - "cloudflare/backend-api/**"
      - "shared/backend-platform/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "scripts/fix-cloudflare-iconv-lite.mjs"
      - ".github/workflows/cloudflare-backend-api-contract-tests.yml"
      - ".github/scripts/resolve-cloudflare-account-from-production-d1.*"

permissions:
  contents: read

concurrency:
  group: cloudflare-backend-api-contract-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install isolated Worker package dependencies
        run: npm install --prefix cloudflare/backend-api --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm --prefix cloudflare/backend-api run check

      - name: Test Production Cloudflare account resolver
        run: node --test .github/scripts/resolve-cloudflare-account-from-production-d1.test.mjs

      - name: Test isolated Worker runtime probe contracts
        working-directory: cloudflare/backend-api
        run: node --test test/runtime-probes.test.mjs

      - name: Dry-run native Worker runtime probe bundle
        working-directory: cloudflare/backend-api
        run: npx --yes wrangler@4.156.0 deploy --dry-run --config wrangler.native-probe.jsonc --outdir /tmp/smv-native-probe-bundle

      - name: Dry-run Express Node HTTP bridge probe bundle
        working-directory: cloudflare/backend-api
        run: npx --yes wrangler@4.156.0 deploy --dry-run --config wrangler.express-probe.jsonc --outdir /tmp/smv-express-probe-bundle

      - name: Run backend contract tests
        working-directory: cloudflare/backend-api
        run: node --test test/*.test.mjs ../../shared/backend-platform/test/*.test.mjs

      - name: Apply D1 migrations to an ephemeral Staging-configured local database only
        working-directory: cloudflare/backend-api
        run: npx --yes wrangler@4.156.0 d1 migrations apply smvastro-wallet-staging --local --config wrangler.staging.jsonc

      - name: Validate Production Worker D1 binding with local migrations only
        working-directory: cloudflare/backend-api
        run: npx --yes wrangler@4.156.0 d1 migrations apply smvastro-wallet-production --local --config wrangler.production.jsonc

      - name: Audit the full financial schema on ephemeral local D1 only
        working-directory: cloudflare/backend-api
        run: node --test test/local-d1-financial-schema-audit.local.mjs

      - name: Run real local D1 Razorpay webhook claim and replay concurrency tests
        working-directory: cloudflare/backend-api
        run: node --test test/local-d1-razorpay-claim.local.mjs

      - name: Run real local D1 Wallet, Live settlement and booking concurrency invariants
        working-directory: cloudflare/backend-api
        run: node --test test/local-d1-live-payment-invariants.local.mjs

  repair-pr417-preview-only:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 417 && github.event.pull_request.head.ref == 'fix/horoscope-paid-entry-shadow-fix-20261107'
    needs: unit-and-contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Patch and verify only the existing PR 417 Preview through Cloudflare Builds API
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
          CF_ACCOUNT_ID: 9b2c576e0f7ed7cf87966926e86ae22a
          TARGET_WORKER: smvastroservices
          TARGET_REPOSITORY_OWNER: smvastrorajaram-hub
          TARGET_REPOSITORY_NAME: smvastroservices
          TARGET_BRANCH: fix/horoscope-paid-entry-shadow-fix-20261107
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CF_API_TOKEN;
          const account = process.env.CF_ACCOUNT_ID;
          const targetWorker = process.env.TARGET_WORKER;
          const targetBranch = process.env.TARGET_BRANCH;
          if (!token) throw new Error("Missing CLOUDFLARE_BUILDS_API_TOKEN GitHub Actions secret.");

          const base = "https://api.cloudflare.com/client/v4";
          async function cf(path, method = "GET", body) {
            const response = await fetch(base + path, {
              method,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json"
              },
              ...(body === undefined ? {} : { body: JSON.stringify(body) })
            });
            let data;
            try { data = await response.json(); }
            catch { throw new Error(`Cloudflare API returned non-JSON response (HTTP ${response.status}).`); }
            if (!response.ok || data.success !== true) {
              const details = Array.isArray(data.errors)
                ? data.errors.map(e => `${e.code ?? "?"}: ${e.message ?? "unknown error"}`).join("; ")
                : "No error details returned";
              throw new Error(`Cloudflare API ${method} ${path} failed (HTTP ${response.status}): ${details}`);
            }
            return data.result;
          }

          const scripts = await cf(`/accounts/${account}/workers/scripts?per_page=100`);
          const worker = (Array.isArray(scripts) ? scripts : []).find(s => s.id === targetWorker);
          if (!worker?.tag) throw new Error(`Worker ${targetWorker} was not found in the configured Account; no changes made.`);

          const workerPath = `/accounts/${account}/builds/workers/${encodeURIComponent(worker.tag)}`;
          const buildConfig = await cf(workerPath);
          const repo = buildConfig.git_repository ?? {};
          if (repo.repo_name !== process.env.TARGET_REPOSITORY_NAME ||
              repo.provider_account_name !== process.env.TARGET_REPOSITORY_OWNER ||
              repo.branch !== "main") {
            throw new Error("Worker repository/owner/production branch did not match expected SMV ASTRO values; no changes made.");
          }
          if (buildConfig.previews_enabled !== true) {
            throw new Error("Worker Previews are not enabled in Builds API; no changes made.");
          }
          console.log("Verified Worker smvastroservices, repository smvastrorajaram-hub/smvastroservices, and production branch main.");

          const previews = await cf(workerPath + "/previews");
          if (!Array.isArray(previews)) throw new Error("Cloudflare did not return a Preview list; no changes made.");
          const preview = previews.find(p => p.branch === targetBranch);
          if (!preview?.preview_id) {
            throw new Error(`No existing Preview for exact PR branch ${targetBranch}; no Preview Base or Production settings changed.`);
          }

          const previewPath = workerPath + "/previews/" + encodeURIComponent(preview.preview_id);
          const before = await cf(previewPath);
          if (before.branch !== targetBranch) {
            throw new Error("Preview ID does not belong to the exact PR 417 branch; no changes made.");
          }

          const desired = {
            root_directory: "/",
            build_command: "npm install --no-audit --no-fund",
            deploy_command: "npx --yes wrangler@4.158.0 preview --config wrangler.jsonc"
          };
          const current = before.settings ?? {};
          const needsUpdate = Object.entries(desired).some(([key, value]) => current[key] !== value);
          if (needsUpdate) {
            await cf(previewPath, "PATCH", { settings: desired });
            console.log("Updated settings on the exact PR 417 Preview only.");
          } else {
            console.log("The exact PR 417 Preview already has all required settings.");
          }

          const after = await cf(previewPath);
          if (after.branch !== targetBranch) throw new Error("Post-update Preview branch verification failed.");
          const finalSettings = after.settings ?? {};
          for (const [key, value] of Object.entries(desired)) {
            if (finalSettings[key] !== value) throw new Error(`Post-update verification failed for ${key}.`);
          }

          console.log("VERIFIED PR 417 Preview settings:");
          console.log(JSON.stringify({
            branch: after.branch,
            root_directory: finalSettings.root_directory,
            build_command: finalSettings.build_command,
            preview_command: finalSettings.deploy_command
          }, null, 2));

          // This endpoint builds the selected Preview only; it cannot deploy the main Production branch.
          const build = await cf(previewPath + "/builds", "POST", { branch: targetBranch });
          const buildId = build?.build_uuid ?? build?.id ?? null;
          console.log(buildId
            ? `PR 417 Preview-only build accepted. Build UUID: ${buildId}`
            : "PR 417 Preview-only build request accepted; no build UUID was returned.");
          console.log("Production settings, production trigger, Worker runtime, D1 bindings and Worker secrets were not changed.");
          NODE
