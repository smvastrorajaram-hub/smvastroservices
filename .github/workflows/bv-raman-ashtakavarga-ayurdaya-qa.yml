name: B.V. Raman Ashtakavarga Ayurdaya Research QA
on:
  push:
    branches: [main, research/bv-raman-ashtakavarga-ayurdaya]
    paths:
      - 'public/horoscope/offline/bv-raman-ashtakavarga-ayurdaya.browser.mjs'
      - 'public/horoscope/offline/astro_advanced.browser.mjs'
      - 'public/horoscope/offline/bv-raman-hpa-ayurdaya-combined.browser.mjs'
      - 'tests/bv-raman-hpa-ayurdaya-combined-regression.mjs'
      - 'tests/bv-raman-ashtakavarga-ayurdaya-regression.mjs'
      - 'tests/v357-bphs-shodhana-regression.mjs'
      - 'tests/v360-pvr-shodhana-textbook-regression.mjs'
      - '.github/workflows/bv-raman-ashtakavarga-ayurdaya-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/horoscope/offline/bv-raman-ashtakavarga-ayurdaya.browser.mjs'
      - 'public/horoscope/offline/astro_advanced.browser.mjs'
      - 'public/horoscope/offline/bv-raman-hpa-ayurdaya-combined.browser.mjs'
      - 'tests/bv-raman-hpa-ayurdaya-combined-regression.mjs'
      - 'tests/bv-raman-ashtakavarga-ayurdaya-regression.mjs'
      - 'tests/v357-bphs-shodhana-regression.mjs'
      - 'tests/v360-pvr-shodhana-textbook-regression.mjs'
      - '.github/workflows/bv-raman-ashtakavarga-ayurdaya-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bv-raman-ashtakavarga-ayurdaya-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  raman-ashtakavarga-ayurdaya:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check research engine and tests
        run: |
          node --check public/horoscope/offline/bv-raman-ashtakavarga-ayurdaya.browser.mjs
          node --check tests/bv-raman-ashtakavarga-ayurdaya-regression.mjs
          node --check public/horoscope/offline/bv-raman-hpa-ayurdaya-combined.browser.mjs
          node --check tests/bv-raman-hpa-ayurdaya-combined-regression.mjs
      - name: Run B.V. Raman Ayurdaya research regression
        run: node tests/bv-raman-ashtakavarga-ayurdaya-regression.mjs
      - name: Run Chapter XIV + XXVI integrated Ayurdaya research regression
        run: node tests/bv-raman-hpa-ayurdaya-combined-regression.mjs
      - name: Run BPHS Shodhana textbook regression
        run: node tests/v357-bphs-shodhana-regression.mjs
      - name: Run P.V.R. Narasimha Rao Shodhana textbook regression
        run: node tests/v360-pvr-shodhana-textbook-regression.mjs
