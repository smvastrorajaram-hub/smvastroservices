name: B.V. Raman Ashtakavarga Ayurdaya Research QA
on:
  push:
    branches: [main, research/bv-raman-ashtakavarga-ayurdaya]
    paths:
      - 'public/horoscope/offline/bv-raman-ashtakavarga-ayurdaya.browser.mjs'
      - 'public/horoscope/offline/astro_advanced.browser.mjs'
      - 'public/horoscope/offline/bv-raman-hpa-ayurdaya-combined.browser.mjs'
      - 'tests/bv-raman-hpa-ayurdaya-combined-regression.mjs'
      - 'tests/bv-raman-chapter-xiv-book-example-regression.mjs'
      - 'tests/bv-raman-ashtakavarga-ayurdaya-regression.mjs'
      - 'tests/v357-bphs-shodhana-regression.mjs'
      - 'tests/v360-pvr-shodhana-textbook-regression.mjs'
      - 'audits/SMV_ASTRO_BV_RAMAN_ASHTAKAVARGA_AYURDAYA_SOURCE_GAP_AUDIT.md'
      - '.github/workflows/bv-raman-ashtakavarga-ayurdaya-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/horoscope/offline/bv-raman-ashtakavarga-ayurdaya.browser.mjs'
      - 'public/horoscope/offline/astro_advanced.browser.mjs'
      - 'public/horoscope/offline/bv-raman-hpa-ayurdaya-combined.browser.mjs'
      - 'tests/bv-raman-hpa-ayurdaya-combined-regression.mjs'
      - 'tests/bv-raman-chapter-xiv-book-example-regression.mjs'
      - 'tests/bv-raman-ashtakavarga-ayurdaya-regression.mjs'
      - 'tests/v357-bphs-shodhana-regression.mjs'
      - 'tests/v360-pvr-shodhana-textbook-regression.mjs'
      - '.github/workflows/bv-raman-ashtakavarga-ayurdaya-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bv-raman-ashtakavarga-ayurdaya-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  raman-ashtakavarga-ayurdaya:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure primary-source PDF exists for every trigger
        shell: bash
        run: |
          set -euo pipefail
          source_pdf="certificates/hindu-predictive-astrology-bv-raman-1.pdf"
          if [ ! -s "$source_pdf" ]; then
            git fetch --no-tags --depth=1 origin main
            mkdir -p "$(dirname "$source_pdf")"
            git show "FETCH_HEAD:$source_pdf" > "$source_pdf"
          fi
          test -s "$source_pdf"
          echo "Primary source PDF is available: $source_pdf"
      - name: Render primary-source PDF pages for Chapter XIV and XXVI evidence
        run: |
          python -m pip install --disable-pip-version-check pymupdf pillow
          python - <<'PY'
          from pathlib import Path
          import pymupdf
          from PIL import Image, ImageDraw

          src = Path("certificates/hindu-predictive-astrology-bv-raman-1.pdf")
          out = Path("artifacts/bv-raman-primary-source-pages")
          out.mkdir(parents=True, exist_ok=True)
          if not src.is_file() or src.stat().st_size == 0:
              raise SystemExit(f"Missing source PDF: {src}")

          doc = pymupdf.open(src)
          # This source PDF contains scanned, image-only pages. Avoid OCR/text
          # anchor searches and render only the chapter pages actually needed.
          page_groups = [
              ("Chapter XIV — printed pages 63–72", 70, 79),
              # The HPA Standard Horoscope BAV reduction table used by the
              # 84-cell regression oracle is on printed page 190 (PDF page 197).
              ("Chapter XXVI — Standard Horoscope BAV table, printed page 190", 197, 197),
              ("Chapter XXVI — printed pages 199–203", 206, 210),
          ]
          selected = []
          for label, first_pdf_page, last_pdf_page in page_groups:
              if last_pdf_page > len(doc):
                  raise SystemExit(f"{label}: PDF has only {len(doc)} pages")
              selected.extend((label, n) for n in range(first_pdf_page, last_pdf_page + 1))

          manifest = [
              f"PDF: {src}",
              f"PDF page count: {len(doc)}",
              "Source pages are scanned images; no text layer is expected.",
              "Page mapping: printed page = PDF page - 7.",
              "Rendered groups:",
          ]
          tiles = []
          for label, pdf_page_number in selected:
              printed_page_number = pdf_page_number - 7
              page = doc[pdf_page_number - 1]
              pix = page.get_pixmap(matrix=pymupdf.Matrix(1.5, 1.5), alpha=False)
              image_path = out / f"pdf-page-{pdf_page_number:03d}-printed-{printed_page_number:03d}.png"
              pix.save(image_path)
              manifest.append(
                  f"  {label}; PDF page {pdf_page_number}; printed page {printed_page_number}; image {image_path.name}"
              )
              img = Image.open(image_path).convert("RGB")
              img.thumbnail((280, 360))
              tile = Image.new("RGB", (300, 400), "white")
              tile.paste(img, ((300 - img.width) // 2, 24))
              ImageDraw.Draw(tile).text(
                  (10, 5), f"Printed p. {printed_page_number} (PDF p. {pdf_page_number})", fill="black"
              )
              tiles.append(tile)

          (out / "page-manifest.txt").write_text("\n".join(manifest), encoding="utf-8")
          columns = 4
          rows = (len(tiles) + columns - 1) // columns
          sheet = Image.new("RGB", (columns * 300, rows * 400), "#dddddd")
          for index, tile in enumerate(tiles):
              sheet.paste(tile, ((index % columns) * 300, (index // columns) * 400))
          sheet.save(out / "contact-sheet.jpg", quality=88)
          print("\n".join(manifest))
          PY
      - name: Upload rendered primary-source page images
        uses: actions/upload-artifact@v4
        with:
          name: bv-raman-primary-source-page-images
          path: artifacts/bv-raman-primary-source-pages/
          if-no-files-found: error
          retention-days: 7
      - name: Syntax-check research engine and tests
        run: |
          node --check public/horoscope/offline/bv-raman-ashtakavarga-ayurdaya.browser.mjs
          node --check tests/bv-raman-ashtakavarga-ayurdaya-regression.mjs
          node --check public/horoscope/offline/bv-raman-hpa-ayurdaya-combined.browser.mjs
          node --check tests/bv-raman-hpa-ayurdaya-combined-regression.mjs
          node --check tests/bv-raman-chapter-xiv-book-example-regression.mjs
      - name: Run B.V. Raman Ayurdaya research regression
        run: node tests/bv-raman-ashtakavarga-ayurdaya-regression.mjs
      - name: Run Chapter XIV + XXVI integrated Ayurdaya research regression
        run: node tests/bv-raman-hpa-ayurdaya-combined-regression.mjs
      - name: Run Chapter XIV printed-rule and book-example regression
        run: node tests/bv-raman-chapter-xiv-book-example-regression.mjs
      - name: Upload Chapter XIV rule-by-rule evidence matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bv-raman-chapter-xiv-book-example-regression
          path: artifacts/chapter-xiv-book-example-regression.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run BPHS Shodhana textbook regression
        run: node tests/v357-bphs-shodhana-regression.mjs
      - name: Run P.V.R. Narasimha Rao Shodhana textbook regression
        run: node tests/v360-pvr-shodhana-textbook-regression.mjs
