name: B.V. Raman Ashtakavarga Ayurdaya Research QA
on:
  push:
    branches: [main]
    paths:
      - 'public/horoscope/offline/bv-raman-ashtakavarga-ayurdaya.browser.mjs'
      - 'tests/bv-raman-ashtakavarga-ayurdaya-regression.mjs'
      - '.github/workflows/bv-raman-ashtakavarga-ayurdaya-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/horoscope/offline/bv-raman-ashtakavarga-ayurdaya.browser.mjs'
      - 'tests/bv-raman-ashtakavarga-ayurdaya-regression.mjs'
      - '.github/workflows/bv-raman-ashtakavarga-ayurdaya-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bv-raman-ashtakavarga-ayurdaya-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  raman-ashtakavarga-ayurdaya:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check research engine and tests
        run: |
          node --check public/horoscope/offline/bv-raman-ashtakavarga-ayurdaya.browser.mjs
          node --check tests/bv-raman-ashtakavarga-ayurdaya-regression.mjs
      - name: Run source-boundary, Shodhana and arithmetic research regressions
        run: node tests/bv-raman-ashtakavarga-ayurdaya-regression.mjs
