name: Cloudflare Production D1 schema migrations

on:
  # The one-time fresh-start PR merge runs this workflow against the exact
  # Production D1 database. It applies only versioned additive migrations;
  # no user rows are deleted or reset by this workflow.
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-production-d1-migrations.yml"
  workflow_dispatch:
    inputs:
      confirm_database_name:
        description: 'Type smvastro-wallet-production to apply the additive Production schema migrations.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production-d1-schema-migrations
  cancel-in-progress: false

jobs:
  apply-production-d1-migrations:
    if: ${{ github.event_name == 'push' || inputs.confirm_database_name == 'smvastro-wallet-production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare API token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret in GitHub production environment.'; exit 1; }

      - name: Resolve Cloudflare account from the exact Production D1 ID
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            account_id="$(node .github/scripts/resolve-cloudflare-account-from-production-d1.mjs)"
            test -n "$account_id" || { echo 'Unable to resolve the Cloudflare account for Production D1.'; exit 1; }
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
            echo 'Resolved the Cloudflare account containing smvastro-wallet-production.'
          else
            echo 'Using the configured CLOUDFLARE_ACCOUNT_ID secret.'
          fi

      - name: Install Worker dependencies
        run: npm install --prefix cloudflare/backend-api --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Display Production D1 migration state
        run: npx --yes wrangler@4.156.0 d1 migrations list smvastro-wallet-production --remote --config cloudflare/backend-api/wrangler.production.jsonc

      - name: Apply pending additive Production D1 migrations
        run: npx --yes wrangler@4.156.0 d1 migrations apply smvastro-wallet-production --remote --config cloudflare/backend-api/wrangler.production.jsonc
