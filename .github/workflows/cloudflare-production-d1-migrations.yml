name: Cloudflare Production D1 schema migrations

on:
  workflow_dispatch:
    inputs:
      confirm_database_name:
        description: 'Type smvastro-wallet-production to apply the additive Production schema migrations.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production-d1-schema-migrations
  cancel-in-progress: false

jobs:
  apply-production-d1-migrations:
    if: ${{ inputs.confirm_database_name == 'smvastro-wallet-production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret in GitHub production environment.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret in GitHub production environment.'; exit 1; }

      - name: Install Worker dependencies
        run: npm install --prefix cloudflare/backend-api --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Display Production D1 migration state
        run: npx --yes wrangler@4.156.0 d1 migrations list smvastro-wallet-production --remote --config cloudflare/backend-api/wrangler.production.jsonc

      - name: Apply pending additive Production D1 migrations
        run: npx --yes wrangler@4.156.0 d1 migrations apply smvastro-wallet-production --remote --config cloudflare/backend-api/wrangler.production.jsonc
