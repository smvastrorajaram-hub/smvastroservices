name: Cloudflare Production D1 schema migrations

on:
  workflow_dispatch:
    inputs:
      confirm_database_name:
        description: 'Type smvastro-wallet-production to apply the additive Production schema migrations.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production-d1-schema-migrations
  cancel-in-progress: false

jobs:
  apply-production-d1-migrations:
    if: ${{ inputs.confirm_database_name == 'smvastro-wallet-production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify dedicated Production D1 API token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_D1_API_TOKEN secret in GitHub production environment.'; exit 1; }

      - name: Resolve Cloudflare account from the exact Production D1 ID
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            account_id="$(node .github/scripts/resolve-cloudflare-account-from-production-d1.mjs)"
            test -n "$account_id" || { echo 'Unable to resolve the Cloudflare account for Production D1.'; exit 1; }
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
            echo 'Resolved the Cloudflare account containing smvastro-wallet-production.'
          else
            echo 'Using the configured CLOUDFLARE_ACCOUNT_ID secret.'
          fi

      - name: Install Worker dependencies
        run: npm install --prefix cloudflare/backend-api --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Display Production D1 migration state
        run: npx --yes wrangler@4.156.0 d1 migrations list smvastro-wallet-production --remote --config cloudflare/backend-api/wrangler.production.jsonc

      - name: Apply pending reviewed Production D1 migrations
        run: npx --yes wrangler@4.156.0 d1 migrations apply smvastro-wallet-production --remote --config cloudflare/backend-api/wrangler.production.jsonc

      - name: Verify Admin Promotional Fund tables and triggers are removed from Production D1
        working-directory: cloudflare/backend-api
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx --yes wrangler@4.156.0 d1 execute smvastro-wallet-production --remote --config wrangler.production.jsonc --json --command "SELECT 'ADMIN_PROMOTIONAL_FUND_REMOVED' AS audit_status WHERE NOT EXISTS (SELECT 1 FROM sqlite_master WHERE type='table' AND name IN ('smv_domain_promotional_fund','smv_domain_promotional_fund_ledger')) AND NOT EXISTS (SELECT 1 FROM sqlite_master WHERE type='trigger' AND name IN ('smv_domain_promotional_fund_ledger_validate','smv_domain_promotional_fund_ledger_apply'))")"
          printf '%s\\n' "$result"
          printf '%s' "$result" | grep -q 'ADMIN_PROMOTIONAL_FUND_REMOVED' || { echo 'Admin Promotional Fund D1 objects still exist.'; exit 1; }
