# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Fail the deployment before publishing if the browser-side Horoscope
      # Swiss Ephemeris runtime is missing from the exact GitHub Pages artifact.
      - name: Verify Horoscope runtime assets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "public/horoscope/offline/offline-engine.mjs"
            "public/horoscope/offline/vendor/smv-swisseph-local.mjs"
            "public/horoscope/offline/vendor/wasm/swisseph.js"
            "public/horoscope/offline/vendor/wasm/swisseph.mjs"
            "public/horoscope/offline/vendor/wasm/swisseph.wasm"
            "public/horoscope/offline/vendor/wasm/swisseph.data"
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "MISSING/EMPTY: $file"; exit 1; }
            echo "PASS: $file ($(wc -c < "$file") bytes)"
          done
          echo "HOROSCOPE GITHUB-PAGES RUNTIME PREFLIGHT PASS"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: './public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
