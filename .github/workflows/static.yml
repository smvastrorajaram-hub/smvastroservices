# Simple workflow for deploying static content to Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Main SMV ASTRO GitHub Pages deployment
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire public site
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # After the main site is live, immediately tell the two independent
  # satellite PWA repositories to rebuild from the latest main source.
  sync-independent-pwas:
    name: Sync Horoscope + Calendar PWAs
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger satellite PWA deployments
        env:
          GH_TOKEN: ${{ secrets.SMV_PWA_SYNC_TOKEN }}
        shell: bash
        run: |
          set -u

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::SMV_PWA_SYNC_TOKEN is not configured. Main Pages deploy succeeded; satellite instant-sync was skipped."
            exit 0
          fi

          failed=0

          trigger() {
            repo="$1"
            workflow="$2"

            response_file="$(mktemp)"
            status="$(
              curl -sS \
                -o "$response_file" \
                -w "%{http_code}" \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/smvastrorajaram-hub/${repo}/actions/workflows/${workflow}/dispatches" \
                -d '{"ref":"main"}'
            )"

            if [ "$status" = "204" ]; then
              echo "Triggered ${repo} successfully."
            else
              echo "::error::Could not trigger ${repo}. GitHub HTTP ${status}."
              cat "$response_file" || true
              echo
              failed=1
            fi

            rm -f "$response_file"
          }

          trigger "smv-horoscope-pwa" "deploy-pages.yml"
          trigger "smv-calendar-pwa" "deploy-pages.yml"

          exit "$failed"
