plugins { id "com.android.application" }

def releaseKeystorePath = providers.environmentVariable("SMV_ANDROID_KEYSTORE_PATH").orNull
def releaseKeystorePassword = providers.environmentVariable("SMV_ANDROID_KEYSTORE_PASSWORD").orNull
def releaseKeyAlias = providers.environmentVariable("SMV_ANDROID_KEY_ALIAS").orNull
def releaseKeyPassword = providers.environmentVariable("SMV_ANDROID_KEY_PASSWORD").orNull
def releaseSigningConfigured = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { value -> value != null && !value.trim().isEmpty() }

def appVersionName = providers.gradleProperty("smvVersionName")
        .orElse(providers.environmentVariable("SMV_ANDROID_VERSION_NAME"))
        .orElse("v1.0")
        .get()
def versionMatcher = appVersionName =~ /^v([1-9][0-9]*)\.([0-9]{1,3})$/
if (!versionMatcher.matches()) {
    throw new GradleException("SMV Android version must use vMAJOR.MINOR format, for example v1.0 or v1.1 (minor must be 0-999).")
}
long versionMajor = versionMatcher.group(1).toLong()
long versionMinor = versionMatcher.group(2).toLong()
long calculatedVersionCode = versionMajor * 1000L + versionMinor
if (calculatedVersionCode < 1000L || calculatedVersionCode > 2100000000L) {
    throw new GradleException("The calculated Android versionCode must be in the supported range starting at 1000.")
}
int appVersionCode = (int) calculatedVersionCode

android {
    namespace "in.smvastroservices.calendar"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "in.smvastroservices.calendar"
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile = file(releaseKeystorePath)
                storeType = "PKCS12"
                storePassword = releaseKeystorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
}
