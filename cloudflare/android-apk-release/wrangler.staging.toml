name = "smv-astro-apk-release-api-staging"
main = "./worker.mjs"
compatibility_date = "2026-10-31"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
FIREBASE_ALLOWED_PROJECT_IDS = "smv-astro-staging"
SMV_ANDROID_RELEASE_ADMIN_UIDS = ""
SMV_ANDROID_RELEASE_ADMIN_EMAILS = ""
ALLOWED_ORIGINS = "https://smv-astro-phase1-browser-staging-v2.onrender.com"
ALLOW_APK_UPLOADS = "false"
MAX_APK_BYTES = "104857600"

[[r2_buckets]]
binding = "APK_RELEASES"
bucket_name = "smv-astro-apk-releases-staging"

[[d1_databases]]
binding = "DB"
database_name = "smv-astro-apk-releases-staging"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "./migrations"
