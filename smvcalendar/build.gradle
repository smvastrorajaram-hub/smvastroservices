plugins { id "com.android.application" }

android {
    namespace "in.smvastroservices.calendar.test"
    compileSdk 36

    defaultConfig {
        applicationId "in.smvastroservices.calendar.test"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.0.1-test-launchfix"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.browser:browser:1.10.0"
}
