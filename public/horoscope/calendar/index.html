<script id="smv-v352-pages-standalone-detection">
(()=>{
  if(location.hostname!=='smvastroservices.pages.dev')return;
  if((window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true){

})();

})();

<script type="module" id="smv-calendar-rasi-palan-loader">
(async()=>{
  const host=location.hostname.toLowerCase();
  const version='20261025-cross-host-assets-header-ta-v1';
  const candidates=host==='calendar.smvastroservices.in'
    ? [
        // The Calendar custom host is a separate deployment and does not reliably serve
        // the shared Horoscope source tree. Load the canonical public assets from the
        // primary Pages deployment; the exact module imports its dependencies there.
        {module:'https://smvastroservices.pages.dev/horoscope/calendar-rasi-palan.mjs',css:'https://smvastroservices.pages.dev/horoscope/calendar-rasi-palan.css'},
        {module:'/calendar-rasi-palan.mjs',css:'/calendar-rasi-palan.css'},
        {module:'/horoscope/calendar-rasi-palan.mjs',css:'/horoscope/calendar-rasi-palan.css'}
      ]
    : [{module:'../calendar-rasi-palan.mjs',css:'../calendar-rasi-palan.css'}];
  const diagnostics=[];
  let loaded=false;
  for(const candidate of candidates){
    let style=null;
    try{
      const moduleUrl=new URL(candidate.module,document.baseURI);
      const moduleCheck=await fetch(moduleUrl.href,{cache:'no-store'});
      if(!moduleCheck.ok)throw new Error('Module HTTP '+moduleCheck.status);
      const moduleText=await moduleCheck.text();
      if(/^\s*(?:<!doctype\s+html|<html\b)/i.test(moduleText) ||
         !moduleText.includes('function renderControls') ||
         !moduleText.includes('runPeriodForecast')) {
        throw new Error('The response is not the deployed Calendar Rasi Palan JavaScript asset.');
      }
      const cssUrl=new URL(candidate.css,document.baseURI);
      const cssCheck=await fetch(cssUrl.href,{cache:'no-store'});
      if(!cssCheck.ok)throw new Error('CSS HTTP '+cssCheck.status);
      const cssText=await cssCheck.text();
      if(/^\s*(?:<!doctype\s+html|<html\b)/i.test(cssText) || !cssText.includes('#calRasiPalan')) {
        throw new Error('The response is not the deployed Calendar Rasi Palan stylesheet.');
      }
      cssUrl.searchParams.set('v',version);
      style=document.createElement('link');
      style.rel='stylesheet';
      style.href=cssUrl.href;
      style.dataset.smvRasiPalanStyle='1';
      await new Promise((resolve,reject)=>{
        style.addEventListener('load',resolve,{once:true});
        style.addEventListener('error',reject,{once:true});
        document.head.append(style);
      });
      moduleUrl.searchParams.set('v',version);
      await import(moduleUrl.href);
      loaded=Boolean(document.getElementById('calRasiPalan'));
      if(!loaded)throw new Error('The module executed but did not mount #calRasiPalan.');
      break;
    }catch(error){
      style?.remove();
      diagnostics.push(candidate.module+': '+String(error?.message||error));
      console.warn('SMV Calendar forecast asset candidate unavailable.',candidate.module,error);
    }
  }
  if(!loaded){
    let target=document.getElementById('calRasiPalan');
    if(!target){
      target=document.createElement('section');
      target.id='calRasiPalan';
      target.className='cal-rasi-palan';
      document.getElementById('smvDailyCalendar')?.insertAdjacentElement('afterend',target);
    }
    target.innerHTML='<h2>ராசி பலன்கள் & கிரக கோச்சாரம் / Rasi Palan & Planetary Transits</h2><p role="alert">இந்தப் பகுதியின் source files தற்போதைய Calendar host-ல் ஏற்றப்படவில்லை. பக்கத்தை மீண்டும் திறக்கவும்; சிக்கல் தொடர்ந்தால் நிர்வாகத்திடம் தெரிவிக்கவும்.</p><p role="alert">The deployed forecast assets could not be loaded from this Calendar host.</p><details><summary>Asset diagnostics</summary><pre></pre></details>';
    const detail=target.querySelector('pre');
    if(detail)detail.textContent=diagnostics.join('\n')||'No compatible candidate was found.';
    console.error('SMV Calendar Rasi Palan and Planetary Transits could not load.',diagnostics);
  }
})();
</script>
<script id="smv-v352-pages-calendar-install-guard">
(()=>{
  if(location.hostname!=='smvastroservices.pages.dev')return;
  if(!document.documentElement.classList.contains('smv-v352-pages-standalone'))return;
  // A standalone window may belong to the parent ASTRO PWA; NEVER infer that
  // the nested Calendar PWA is installed, or change its shared-origin flag.
  const area=document.getElementById('smvCalendarInstallArea');
  if(area)area.hidden=true;
  const link=document.querySelector('.cal-app-link');
  if(link)link.hidden=true;
  // The CSS guard also covers Calendar panels rebuilt after language switches.
})();
</script>
