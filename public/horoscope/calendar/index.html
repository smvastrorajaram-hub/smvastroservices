<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f514c">
<meta name="color-scheme" content="light">
<meta name="application-name" content="SMV CALENDAR">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SMV CALENDAR</title>
<link rel="canonical" href="https://calendar.smvastroservices.in/">
<script id="smv-v350-host-nav">if(location.hostname==='smvastroservices.pages.dev'){const c=document.querySelector('link[rel="canonical"]');if(c)c.href=location.origin+'/horoscope/calendar/';document.addEventListener('DOMContentLoaded',()=>{const nav=document.querySelector('.calendar-product-nav');if(!nav)return;const a=nav.querySelector('a[href="https://smvastroservices.in/"]');const b=nav.querySelector('a[href="https://horoscope.smvastroservices.in/"]');if(a){a.href='/';a.removeAttribute('target');}if(b){b.href='/horoscope/';b.removeAttribute('target');}});}</script>
<script>
(()=>{const h=location.hostname.toLowerCase();if(h==='smvastroservices.in'||h==='www.smvastroservices.in'){location.replace('https://calendar.smvastroservices.in/'+location.search+location.hash);}})();
</script>
<meta name="description" content="Tamil and English daily Panchang, Hora, planetary transit chart, Rasi Palan and Tamil calendar.">
<link id="calendarManifest" rel="manifest" href="manifest-en.webmanifest">
<script>window.__smvCalendarInstallPrompt=null;addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__smvCalendarInstallPrompt=e;window.dispatchEvent(new CustomEvent('smv:calendar-installable'));});</script>
<link rel="icon" href="../assets/calendar-192.png">
<link rel="apple-touch-icon" href="../assets/calendar-192.png">
<link rel="stylesheet" href="../horoscope.css?v=209-css-clean">
<link rel="stylesheet" href="../daily-calendar.css?v=228-today-color">
<link rel="stylesheet" href="../calendar-v226.css?v=228-today-color">
</head>
<body class="calendar-only">
<header class="calendar-topbar">
<nav class="calendar-product-nav" aria-label="SMV services">
<a href="https://smvastroservices.in/" target="_blank" rel="noopener">SMV ASTRO</a>
<a href="https://horoscope.smvastroservices.in/" target="_blank" rel="noopener">SMV HOROSCOPE</a>
<a class="is-current" href="./" aria-current="page">SMV CALENDAR</a>
</nav>
<nav class="calendar-language-switch" aria-label="Calendar language"><button id="calTamil" lang="ta" type="button">தமிழ்</button><button id="calEnglish" lang="en" type="button">English</button></nav>
</header>
<main class="calendar-page-shell"><section id="smvDailyCalendar" aria-label="Daily Calendar"></section></main>
<footer class="calendar-install" id="smvCalendarInstallArea" hidden>
<div class="calendar-install-inner"><button id="calInstall" type="button"><img src="../assets/calendar-192.png" width="36" height="36" alt=""> <span>Install SMV CALENDAR</span></button><p id="calInstallStatus" role="status"></p></div>
</footer>
<script src="../location-search-online-offline.js?v=222"></script>
<script src="../horoscope.js?v=222-calendar-render"></script>
<script type="module" src="calendar-pwa.mjs?v=222"></script>
<script type="module" src="../daily-calendar.mjs?v=228-today-color"></script>
<script id="smv-v351-pages-calendar-install-bridge">
(()=>{
 if(location.hostname!=='smvastroservices.pages.dev')return;
 const ready=()=>{
  const area=document.getElementById('smvCalendarInstallArea');
  const button=document.getElementById('calInstall');
  const status=document.getElementById('calInstallStatus');
  if(!area||!button)return;
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const source=new URLSearchParams(location.search).get('source')||'';
  const launchedThisPwa=standalone&&source.startsWith('calendar-pwa');
  if(launchedThisPwa)return; // Do not change installed SMV CALENDAR sessions.
  if(standalone){
   // The parent ASTRO standalone app is not an installed Calendar app.
   try{localStorage.removeItem('smv-calendar-pwa-installed-v217')}catch(_){ }
  }
  area.hidden=false;
  const link=document.querySelector('.cal-app-link');if(link)link.hidden=false;
  const direct='https://smvastroservices.pages.dev/horoscope/calendar/';
  const ta=()=>document.documentElement.lang==='ta';
  const instructions=()=>ta()
   ?'தனியாக நிறுவ: Chrome browser address bar-இல் '+direct+' திறந்து ⋮ → Install app தேர்வு செய்யவும்.'
   :'To install separately, open '+direct+' directly in Chrome, then choose ⋮ → Install app.';
  if(standalone&&status)status.textContent=instructions();
  button.addEventListener('click',event=>{
   if(!standalone)return; // Existing browser-native Calendar installer remains.
   event.preventDefault();event.stopImmediatePropagation();
   area.hidden=false;
   if(status)status.textContent=instructions();
  },true);
  window.addEventListener('smv-language',()=>{if(standalone&&status)status.textContent=instructions();});
 };
 // Calendar modules are deferred and run before DOMContentLoaded.
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready,{once:true});
 else ready();
})();
</script>
</body>
</html>
