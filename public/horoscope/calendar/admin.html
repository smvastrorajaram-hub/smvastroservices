<script>
(()=> {
  const h=location.hostname.toLowerCase();
  const target=h==='smvastroservices.pages.dev'
    ? location.origin+'/horoscope/?admin=1'
    : h.endsWith('.smvastroservices.pages.dev')
      ? 'https://smvastroservices.pages.dev/horoscope/?admin=1'
      : 'https://horoscope.smvastroservices.in/?admin=1';
