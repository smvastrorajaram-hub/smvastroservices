# Temporary HTTP-only bootstrap site. Used only for ACME challenge issuance.
# Do not direct production browser traffic here; install smvastro-oci.conf after TLS is issued.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.smvastroservices.in api-staging.smvastroservices.in staging.smvastroservices.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /healthz {
        default_type application/json;
        return 200 '{"ok":true,"service":"smv-astro-oracle-bootstrap"}';
    }

    location / {
        default_type text/plain;
        return 503 'Oracle backend bootstrap is not yet TLS-enabled. Do not use this endpoint for production traffic.';
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.smvastroservices.in;

    root /opt/smvastroservices/staging/public;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
