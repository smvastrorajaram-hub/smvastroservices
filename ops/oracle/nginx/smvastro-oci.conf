# Final reverse proxy: production API, staging API, and staging browser.
# Requires one valid Let's Encrypt certificate whose SANs include all three hosts.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream smvastro_production_api {
    server 127.0.0.1:10000;
    keepalive 32;
}
upstream smvastro_staging_api {
    server 127.0.0.1:10001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.smvastroservices.in api-staging.smvastroservices.in staging.smvastroservices.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.smvastroservices.in;

    ssl_certificate /etc/letsencrypt/live/api.smvastroservices.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.smvastroservices.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SMVSSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 110m;

    location / {
        proxy_pass http://smvastro_production_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-staging.smvastroservices.in;

    ssl_certificate /etc/letsencrypt/live/api.smvastroservices.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.smvastroservices.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SMVSSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 110m;

    location / {
        proxy_pass http://smvastro_staging_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.smvastroservices.in;

    ssl_certificate /etc/letsencrypt/live/api.smvastroservices.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.smvastroservices.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SMVSSL:10m;
    ssl_session_timeout 1d;
    root /opt/smvastroservices/staging/public;
    index index.html;
    client_max_body_size 110m;

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
