services:
  smv-astro-api:
    build:
      context: ../..
      dockerfile: ops/oracle/Dockerfile
    image: smvastroservices-api:oracle
    container_name: smv-astro-api
    restart: unless-stopped
    init: true
    env_file:
      - ./backend.env
    environment:
      NODE_ENV: production
      PORT: "10000"
      SWISSEPH_EPHE_PATH: ./ephe
      HOUSE_SYSTEM: S
    ports:
      # Reverse proxy (Nginx/Caddy) on the VM terminates TLS. Do not expose this port publicly.
      - "127.0.0.1:10000:10000"
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=768m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:10000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
