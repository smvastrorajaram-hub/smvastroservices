plugins { id "com.android.application" }

def releaseKeystorePath = providers.environmentVariable("SMV_ANDROID_KEYSTORE_PATH").orNull
def releaseKeystorePassword = providers.environmentVariable("SMV_ANDROID_KEYSTORE_PASSWORD").orNull
def releaseKeyAlias = providers.environmentVariable("SMV_ANDROID_KEY_ALIAS").orNull
def releaseKeyPassword = providers.environmentVariable("SMV_ANDROID_KEY_PASSWORD").orNull
def releaseSigningConfigured = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { value -> value != null && !value.trim().isEmpty() }

def appVersionName = providers.gradleProperty("smvPagesVersionName")
        .orElse(providers.environmentVariable("SMV_PAGES_ANDROID_VERSION_NAME"))
        .orElse("v1.0")
        .get()
def versionMatcher = appVersionName =~ /^v([1-9][0-9]*)\.([0-9]{1,3})$/
if (!versionMatcher.matches()) {
    throw new GradleException("SMV Pages.dev Android version must use vMAJOR.MINOR format.")
}
long versionMajor = versionMatcher.group(1).toLong()
long versionMinor = versionMatcher.group(2).toLong()
long calculatedVersionCode = versionMajor * 1000L + versionMinor
if (calculatedVersionCode < 1000L || calculatedVersionCode > 2100000000L) {
    throw new GradleException("SMV Pages.dev Android versionCode must be within the supported range.")
}
int appVersionCode = (int) calculatedVersionCode

android {
    namespace "in.smvastroservices.pages"
    compileSdk 36

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "in.smvastroservices.pages"
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
        buildConfigField "String", "SMV_GOOGLE_WEB_CLIENT_ID", "\"299081899217-ht47n60l8t2c7gbo07nd4lpm8i51jk3m.apps.googleusercontent.com\""
    }

    flavorDimensions += "product"
    productFlavors {
        astro {
            dimension "product"
            applicationId "in.smvastroservices.pages.astro"
            buildConfigField "String", "SMV_PRODUCT", "\"astro\""
            buildConfigField "String", "SMV_HOME_URL", "\"https://smvastroservices.pages.dev/\""
            buildConfigField "String", "SMV_PDF_PATH", "\"/horoscope/report-print.html\""
            buildConfigField "boolean", "SMV_PDF_ENABLED", "true"
        }
        horoscope {
            dimension "product"
            applicationId "in.smvastroservices.pages.horoscope"
            buildConfigField "String", "SMV_PRODUCT", "\"horoscope\""
            buildConfigField "String", "SMV_HOME_URL", "\"https://smvastroservices.pages.dev/horoscope/\""
            buildConfigField "String", "SMV_PDF_PATH", "\"/horoscope/report-print.html\""
            buildConfigField "boolean", "SMV_PDF_ENABLED", "true"
        }
        calendar {
            dimension "product"
            applicationId "in.smvastroservices.pages.calendar"
            buildConfigField "String", "SMV_PRODUCT", "\"calendar\""
            buildConfigField "String", "SMV_HOME_URL", "\"https://smvastroservices.pages.dev/horoscope/calendar/\""
            buildConfigField "String", "SMV_PDF_PATH", "\"\""
            buildConfigField "boolean", "SMV_PDF_ENABLED", "false"
        }
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile = file(releaseKeystorePath)
                storeType = "PKCS12"
                storePassword = releaseKeystorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug { versionNameSuffix "-debug" }
        release {
            minifyEnabled false
            if (releaseSigningConfigured) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.18.0"
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}
