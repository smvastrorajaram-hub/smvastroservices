plugins { id "com.android.application" }

def nativeFirebaseAndroidAppId = providers.gradleProperty("smvFirebaseAndroidAppId")
        .orElse(providers.environmentVariable("SMV_FIREBASE_ANDROID_APP_ID"))
        .getOrElse("1:299081899217:android:09e43164cfdd015ba539f0")

def releaseKeystorePath = providers.environmentVariable("SMV_ANDROID_KEYSTORE_PATH").orNull
def releaseKeystorePassword = providers.environmentVariable("SMV_ANDROID_KEYSTORE_PASSWORD").orNull
def releaseKeyAlias = providers.environmentVariable("SMV_ANDROID_KEY_ALIAS").orNull
def releaseKeyPassword = providers.environmentVariable("SMV_ANDROID_KEY_PASSWORD").orNull
def releaseSigningConfigured = [
        releaseKeystorePath,
        releaseKeystorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { value -> value != null && !value.trim().isEmpty() }

def appVersionName = providers.gradleProperty("smvVersionName")
        .orElse(providers.environmentVariable("SMV_ANDROID_VERSION_NAME"))
        .orElse("v1.0")
        .get()
def versionMatcher = appVersionName =~ /^v([1-9][0-9]*)\.([0-9]{1,3})$/
if (!versionMatcher.matches()) {
    throw new GradleException("SMV Android version must use vMAJOR.MINOR format, e.g. v1.0, v1.1, v2.0 (minor must be 0-999).")
}
long versionMajor = versionMatcher.group(1).toLong()
long versionMinor = versionMatcher.group(2).toLong()
long calculatedVersionCode = versionMajor * 1000L + versionMinor
if (calculatedVersionCode < 1L || calculatedVersionCode > 2100000000L) {
    throw new GradleException("The calculated Android versionCode is outside the supported positive 32-bit Play Store range.")
}
int appVersionCode = (int) calculatedVersionCode

android {
    namespace "in.smvastroservices.smvastro"
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "in.smvastroservices.smvastro"
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
        buildConfigField "String", "SMV_FIREBASE_ANDROID_APP_ID", "\"\${nativeFirebaseAndroidAppId}\""
        buildConfigField "String", "SMV_FIREBASE_API_KEY", "\"AIzaSyAMadKqrgdqgF3NrRsS_cLySDiNrRsl6kM\""
        buildConfigField "String", "SMV_FIREBASE_PROJECT_ID", "\"smv-astro\""
        buildConfigField "String", "SMV_FIREBASE_SENDER_ID", "\"299081899217\""
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile = file(releaseKeystorePath)
                storePassword = releaseKeystorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:35.1.0")
    implementation "com.google.firebase:firebase-messaging"
    implementation "androidx.webkit:webkit:1.18.0"
}
